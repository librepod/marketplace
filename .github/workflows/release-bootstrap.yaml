name: Release Bootstrap Artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (bare X.Y.Z, e.g. 0.1.1 — no "v" prefix)'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Release version (bare X.Y.Z)'
        required: true
        type: string
      notes:
        description: 'Annotated-tag message (pin-diff summary from auto-cut)'
        required: false
        type: string
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: fluxcd/flux2/action@main

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: 'v3.0.6'

      - name: Validate version and guard against reuse
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to release: version '$VERSION' is not bare X.Y.Z (no 'v' prefix)"; exit 1
          fi
          if [ "$VERSION" = "0.0.0" ]; then
            echo "::error::Refusing to release: 0.0.0 is reserved for dev pseudo-versions"; exit 1
          fi
          if git ls-remote --tags origin "refs/tags/marketplace-bootstrap-v$VERSION" | grep -q .; then
            echo "::error::Refusing to release: git tag marketplace-bootstrap-v$VERSION already exists"; exit 1
          fi
          if docker manifest inspect "ghcr.io/${{ github.repository_owner }}/marketplace/bootstrap:$VERSION" > /dev/null 2>&1; then
            echo "::error::Refusing to release: OCI tag $VERSION already exists"; exit 1
          fi

      - name: Build bootstrap artifact directory
        run: |
          mkdir -p /tmp/bootstrap
          cp -r clusters /tmp/bootstrap/
          cp -r infrastructure /tmp/bootstrap/

      - name: Push and sign bootstrap artifact
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          retry() {
            # Retry through transient GHCR secondary rate-limits (HTTP 403)
            # during cosign signature blob uploads, and any 409 from re-signing
            # a digest that the publish job already signed (same content).
            local max=5 delay=15 i=0
            until "$@"; do
              i=$((i + 1))
              if [ "$i" -ge "$max" ]; then
                echo "::error::Failed after $i attempts: $*" >&2
                return 1
              fi
              echo "Attempt $i failed; retrying in ${delay}s..." >&2
              sleep "$delay"
              delay=$((delay + 15))
            done
          }
          DIGEST=$(flux push artifact \
            oci://ghcr.io/${{ github.repository_owner }}/marketplace/bootstrap:"$VERSION" \
            --path=/tmp/bootstrap \
            --source="$(git config --get remote.origin.url)" \
            --revision="$(git rev-parse HEAD)" \
            --output json | jq -r '.repository + "@" + .digest')
          retry cosign sign --key env://COSIGN_PRIVATE_KEY --yes "$DIGEST"

      - name: Bookmark release with a git tag
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            git tag -a "marketplace-bootstrap-v$VERSION" -m "$NOTES" "$GITHUB_SHA"
          else
            git tag "marketplace-bootstrap-v$VERSION" "$GITHUB_SHA"
          fi
          git push origin "marketplace-bootstrap-v$VERSION"
