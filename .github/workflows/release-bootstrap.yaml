name: Release Bootstrap Artifact

on:
  push:
    tags: ["marketplace-bootstrap-*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: fluxcd/flux2/action@main

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: 'v3.0.6'

      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^marketplace-bootstrap-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to release: tag '$TAG' is not marketplace-bootstrap-X.Y.Z"; exit 1
          fi

      - name: Build bootstrap artifact directory
        run: |
          mkdir -p /tmp/bootstrap
          cp -r clusters /tmp/bootstrap/
          cp -r infrastructure /tmp/bootstrap/

      - name: Push and sign bootstrap artifact
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          DIGEST=$(flux push artifact \
            oci://ghcr.io/${{ github.repository_owner }}/marketplace/bootstrap:"$TAG" \
            --path=/tmp/bootstrap \
            --source="$(git config --get remote.origin.url)" \
            --revision="$(git rev-parse HEAD)" \
            --output json | jq -r '.repository + "@" + .digest')
          cosign sign --key env://COSIGN_PRIVATE_KEY --yes "$DIGEST"
