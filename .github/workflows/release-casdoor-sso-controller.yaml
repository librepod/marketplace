name: Release Casdoor SSO Controller

# The only writer of casdoor-sso-controller's versions: the :X.Y.Z image, the
# :X.Y.Z manifest artifact and the casdoor-sso-controller-vX.Y.Z git tag.
# Master merges publish :latest only (publish-casdoor-sso-controller,
# publish-apps), so a released version never changes under a pinned cluster
# (issue #361).
#
#   cut      dispatch (patch|minor): bumps the Makefile VERSION and the three
#            pins on a release/casdoor-sso-controller-vX.Y.Z branch and opens
#            a PR. Major releases stay manual: push such a branch by hand.
#   publish  that PR merges: builds the image and manifest from the merge
#            commit, signs both, then git-tags the commit. A failed run is
#            recovered by re-running it.
#
# The merge also fires publish-bootstrap, which carries the system-apps ref.tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump level
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  cut:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Serialize double-taps: a queued second cut re-reads master fresh and
    # supersedes the first one's release PR. Job-level, so publish runs never
    # queue here (a newer pending run cancels an older one).
    concurrency:
      group: casdoor-sso-controller-release
      cancel-in-progress: false
    permissions:
      contents: write # push the release branch (via the checkout's credentials)
      pull-requests: write # open the release PR
    steps:
      - uses: actions/checkout@v6

      - name: Bump the version and pins and open the release PR
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cut-release.sh casdoor-sso-controller "$BUMP" --pr

  publish:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'release/casdoor-sso-controller-v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write # push the git tag
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: fluxcd/flux2/action@main

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: 'v3.0.6'

      - name: Publish and sign the release image and manifest, then git-tag it
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: bash scripts/publish-release.sh "$BRANCH" --push
