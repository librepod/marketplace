name: Publish App Artifacts

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Apps to publish (JSON array, e.g. ["traefik","wg-easy"]). Use ["all"] to publish all apps.'
        required: false
        default: ''
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
    paths:
      - 'apps/*/metadata.yaml'
      - 'apps/*/base/**'
      - 'apps/*/overlays/**'
      - 'apps/*/components/**'
  push:
    branches: [master]
    paths:
      - 'apps/*/metadata.yaml'
      - 'apps/*/base/**'
      - 'apps/*/overlays/**'
      - 'apps/*/components/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changes.outputs.apps }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name == 'push' && 2 || 0 }}

      - id: changes
        env:
          MANUAL_APPS: ${{ inputs.apps }}
        run: |
          discover_all_apps() {
            # Find all apps with metadata.yaml
            APPS="[]"
            for metadata in apps/*/metadata.yaml; do
              app=$(dirname "$metadata" | xargs basename)
              APPS=$(echo "$APPS" | jq --arg a "$app" '. + [$a]')
            done
            echo "$APPS"
          }

          # Use manual input if provided (workflow_dispatch)
          if [ -n "$MANUAL_APPS" ]; then
            # Check for "all" magic value
            if echo "$MANUAL_APPS" | jq -e '. == ["all"]' > /dev/null 2>&1; then
              APPS=$(discover_all_apps)
            else
              APPS="$MANUAL_APPS"
            fi
          else
            # Determine diff base depending on event type
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE="${{ github.event.pull_request.base.sha }}"
            else
              BASE="HEAD~1"
            fi

            # Get changed app directories from git diff
            CHANGED=$(git diff --name-only "${BASE}" HEAD -- 'apps/' \
              | cut -d'/' -f2 | sort -u)

            # Filter to apps with metadata.yaml (all publishable apps)
            APPS="[]"
            for app in $CHANGED; do
              # Must have metadata.yaml
              if [ ! -f "apps/$app/metadata.yaml" ]; then
                continue
              fi
              APPS=$(echo "$APPS" | jq --arg a "$app" '. + [$a]')
            done
          fi

          # Use jq -c to output compact (single-line) JSON for GITHUB_OUTPUT
          echo "apps=$(echo "$APPS" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "Apps to publish: $APPS"

  publish:
    needs: detect-changes
    if: needs.detect-changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    strategy:
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v6

      - uses: fluxcd/flux2/action@main

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: 'v3.0.6'

      - name: Get app version
        id: version
        run: |
          VERSION=$(grep 'version:' apps/${{ matrix.app }}/metadata.yaml \
            | head -1 | sed 's/.*version: *//' | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Guard — self-built app pin must reference an existing image
        if: github.event_name != 'pull_request'
        run: |
          # marketplace-ui and casdoor-sso-controller are built by LibrePod from
          # in-repo source; their metadata.yaml version is a PIN to an image tag
          # this repo must have already built (via publish-marketplace-ui /
          # publish-casdoor-sso-controller). If the pin names a tag that was never
          # built, the overlay's images[].newTag / OCIRepository ref.tag point at
          # a non-existent image → ImagePullBackOff on the cluster (the class of
          # failure that broke Tier 2 on the 0.5.0 bump). Fail fast here instead.
          #
          # Upstream-image apps are skipped: their images are the vendor's, not
          # ours to guarantee.
          APP="${{ matrix.app }}"
          case "$APP" in
            marketplace-ui|casdoor-sso-controller) ;;
            *) echo "Not a self-built app — skipping image-existence guard."; exit 0 ;;
          esac

          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/${APP}:${VERSION}"
          echo "Verifying pinned image exists: ${IMAGE}"

          # Retry with backoff: when a single PR bumps BOTH the product version
          # (ui/package.json or Makefile) and this pin, the image-build workflow
          # runs in parallel with this one. Image builds take ~40s; give it room.
          attempts=6
          delay=30
          i=0
          until docker manifest inspect "${IMAGE}" >/dev/null 2>&1; do
            i=$((i + 1))
            if [ "$i" -ge "$attempts" ]; then
              echo "::error::${APP} metadata.yaml pins ${APP}:${VERSION} but no such image exists in GHCR after ${attempts} attempts."
              echo "::error::Bump the product version (ui/package.json for marketplace-ui, casdoor-sso-controller/Makefile VERSION for the controller) so the image is built, or wait for its build to finish and re-run."
              exit 1
            fi
            echo "Image not found yet (attempt ${i}/${attempts}); the image-build workflow may still be running. Retrying in ${delay}s..."
            sleep "$delay"
          done
          echo "OK — ${IMAGE} exists."

      - name: Push and sign app artifact
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="pr-${{ github.event.pull_request.number }}"
            echo "Pushing PR artifact: ${TAG}"
            DIGEST=$(flux push artifact \
              oci://ghcr.io/${{ github.repository_owner }}/marketplace/apps/${{ matrix.app }}:${TAG} \
              --path=./apps/${{ matrix.app }} \
              --source="$(git config --get remote.origin.url)" \
              --revision="$(git rev-parse HEAD)" \
              --ignore-paths=.git/,.gitignore,.gitmodules,.gitattributes,*.jpg,*.jpeg,*.gif,*.png,*.wmv,*.flv,*.tar.gz \
              --output json | jq -r '.repository + "@" + .digest')

            echo "Signing PR artifact (keyless): $DIGEST"
            cosign sign --yes "$DIGEST"
          else
            echo "Pushing versioned artifact and capture its digest..."
            DIGEST_V=$(flux push artifact \
              oci://ghcr.io/${{ github.repository_owner }}/marketplace/apps/${{ matrix.app }}:${{ steps.version.outputs.version }} \
              --path=./apps/${{ matrix.app }} \
              --source="$(git config --get remote.origin.url)" \
              --revision="$(git rev-parse HEAD)" \
              --ignore-paths=.git/,.gitignore,.gitmodules,.gitattributes,*.jpg,*.jpeg,*.gif,*.png,*.wmv,*.flv,*.tar.gz \
              --output json | jq -r '.repository + "@" + .digest')

            echo "Signing versioned artifact by digest: $DIGEST_V"
            cosign sign --key env://COSIGN_PRIVATE_KEY --yes "$DIGEST_V"

            echo "Pushing latest artifact and capture its digest..."
            DIGEST_L=$(flux push artifact \
              oci://ghcr.io/${{ github.repository_owner }}/marketplace/apps/${{ matrix.app }}:latest \
              --path=./apps/${{ matrix.app }} \
              --source="$(git config --get remote.origin.url)" \
              --revision="$(git rev-parse HEAD)" \
              --ignore-paths=.git/,.gitignore,.gitmodules,.gitattributes,*.jpg,*.jpeg,*.gif,*.png,*.wmv,*.flv,*.tar.gz \
              --output json | jq -r '.repository + "@" + .digest')

            echo "Signing latest artifact by digest: $DIGEST_L"
            cosign sign --key env://COSIGN_PRIVATE_KEY --yes "$DIGEST_L"
          fi

  comment:
    needs: [detect-changes, publish]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.apps != '[]'
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr_number = context.payload.pull_request.number;
            const tag = `pr-${pr_number}`;
            const owner = context.repo.owner;
            const apps = JSON.parse(process.env.APPS);
            const MARKER = '<!-- pr-app-artifacts-comment -->';

            let appRows = apps.map(app =>
              `| \`${app}\` | \`ghcr.io/${owner}/marketplace/apps/${app}:${tag}\` |`
            ).join('\n');

            const body = `${MARKER}\n### PR App Artifacts Ready

            | App | Tag |
            |-----|-----|
            ${appRows}

            \`\`\`bash
            # Test in dev cluster:
            flux reconcile source oci <name> --tag ${tag}
            \`\`\``;

            // Find existing comment with our marker
            const comments = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: pr_number,
            });
            const existing = comments.data.find(c => c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr_number,
                body
              });
            }
        env:
          APPS: ${{ needs.detect-changes.outputs.apps }}
