name: Publish Release

# Sole writer of the self-built apps' :<version> tags (marketplace-ui,
# casdoor-sso-controller): the image and its manifest artifact, built from the
# release PR's merge commit, image first. Master merges publish :latest and
# :<sha> only, so a released version never changes under a pinned cluster
# (issue #361). Triggered by merging a release/<app>-vX.Y.Z PR, opened by
# release-marketplace-ui for the UI and by hand for the controller. A failed
# run is recovered by re-running it: it rebuilds the same merge commit.
on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  publish:
    if: >-
      github.event.pull_request.merged &&
      (startsWith(github.event.pull_request.head.ref, 'release/marketplace-ui-v') ||
       startsWith(github.event.pull_request.head.ref, 'release/casdoor-sso-controller-v'))
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: fluxcd/flux2/action@main

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: 'v3.0.6'

      - name: Publish and sign the release image and manifest
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: bash scripts/publish-release.sh "$BRANCH" --push
