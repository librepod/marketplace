name: Release Marketplace UI

# One-click release, PR edition: pick a bump level, get a release PR. Bumps
# the five pin spots (ui/package.json + package-lock.json via `npm version`,
# apps/marketplace-ui/metadata.yaml, infrastructure system-apps ref.tag,
# overlay newTag), commits on a release/marketplace-ui-vX.Y.Z branch, tags,
# and opens a PR — master is protected, so the merge IS the release: it fires
# the image (publish-marketplace-ui), app artifact (publish-apps), and
# bootstrap artifact (publish-bootstrap — carries the infra ref.tag)
# workflows through their on:push path triggers. publish-catalog follows on
# its own via workflow_run. Major releases stay manual (local checkout +
# edit), as with release-bootstrap.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump level
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor

# Serialize double-taps: a queued second run re-reads master fresh, and its
# supersede step closes the first run's still-open release PR and re-cuts —
# converging on one release PR instead of racing. The tag guard is the last
# resort for a version already released.
concurrency:
  group: marketplace-ui-release
  cancel-in-progress: false

permissions:
  contents: write # push the release branch + tag (via the checkout's credentials)
  pull-requests: write # open the release PR

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Bump the five version pins and open the release PR
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-marketplace-ui.sh "$BUMP" --pr
