name: Publish Component Artifacts

on:
  workflow_dispatch:
    inputs:
      components:
        description: 'Components to publish (space-separated names, or "all")'
        required: false
        default: ''
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
    paths:
      - 'components/**'
  push:
    branches: [master]
    paths:
      - 'components/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name == 'push' && 2 || 0 }}

      - uses: fluxcd/flux2/action@main

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: 'v3.0.6'

      - name: Push and sign component artifacts
        env:
          OCI_REPO: ghcr.io/${{ github.repository_owner }}/marketplace/components
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          COMPONENTS: ${{ inputs.components }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: bash scripts/publish-components.sh --push ${PR_NUMBER:+--pr "$PR_NUMBER"} ${BASE:+--base "$BASE"} $COMPONENTS
