name: Validate App Manifests

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/*/metadata.yaml'
      - 'apps/*/base/**'
      - 'apps/*/overlays/**'
      - 'apps/*/components/**'

jobs:
  # Closed category vocabulary gate (#314): a category outside this list is
  # either a typo (the Network/Networking split) or an undeclared new bucket.
  # Adding a category is a deliberate edit to the list below.
  catalog-categories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fail on app category outside the allowlist
        run: |
          set -uo pipefail
          ALLOWED="AI Development Finance Infrastructure Media Monitoring Network Productivity Security System Testing"
          status=0
          for m in apps/*/metadata.yaml; do
            app=$(basename "$(dirname "$m")")
            category=$(grep -m1 '^  category:' "$m" | sed 's/.*category: *//' | tr -d '"')
            if [ -z "$category" ] || ! grep -qw "$category" <<<"$ALLOWED"; then
              echo "::error file=$m::apps/$app: category \"$category\" is not in the allowlist: $ALLOWED"
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then echo "All app categories within the allowlist."; fi
          exit $status

  # Remote http(s) kustomize bases resolve live inside kustomize-controller on
  # every reconcile, bypassing Flux source caching — slow egress to the base's
  # host then stalls the app's Kustomization and its whole dependsOn tree (#311).
  # Apps must vendor upstream manifests into the artifact instead (pattern:
  # apps/nfs-provisioner/base/upstream/, apps/external-secrets-reloader/base/bundle.yaml).
  no-remote-bases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fail on remote http(s) kustomize bases
        run: |
          set -euo pipefail
          hits=$(grep -rnE '^[[:space:]]*-[[:space:]]*["'"'"']?https?://' \
            apps --include='kustomization*.yaml' || true)
          if [ -n "$hits" ]; then
            echo "::error::Remote http(s) kustomize bases are forbidden — vendor the manifests into the app instead (see apps/nfs-provisioner/base/upstream/)."
            echo "$hits"
            exit 1
          fi
          echo "No remote http(s) bases under apps/."

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changes.outputs.apps }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: changes
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "${BASE}" HEAD -- 'apps/' | cut -d'/' -f2 | sort -u)
          APPS="[]"
          for app in $CHANGED; do
            [ -f "apps/$app/metadata.yaml" ] || continue
            [ -d "apps/$app/overlays/librepod" ] || continue
            APPS=$(echo "$APPS" | jq --arg a "$app" '. + [$a]')
          done
          echo "apps=$(echo "$APPS" | jq -c .)" >> "$GITHUB_OUTPUT"

  validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build + lint + flux render
        run: |
          nix-shell shell.nix --run '
            set -euo pipefail
            APP=${{ matrix.app }}
            echo "== kustomize build =="
            kustomize build "apps/$APP/overlays/librepod" > /tmp/rendered.yaml
            echo "== kubeconform =="
            kubeconform \
              -schema-location default \
              -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
              -strict -ignore-missing-schemas -summary /tmp/rendered.yaml
            echo "== flux build =="
            flux build kustomization "$APP" \
              --path "apps/$APP/overlays/librepod" \
              --local-sources GitRepository/flux-system/librepod-apps=./ \
              --dry-run || true
          '

  e2e:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.apps != '[]' &&
      contains(github.event.pull_request.labels.*.name, 'renovate-e2e')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Ephemeral k3d deploy + smoke test
        run: |
          echo "On-demand e2e for ${{ matrix.app }} (label renovate-e2e present)."
          echo "TODO wiring note: reuse the k3d flow from ui-e2e-cluster.yaml /"
          echo "the verify-app skill to deploy apps/${{ matrix.app }} and smoke-test."
          # Placeholder gate: kept green until the k3d harness is wired in a follow-up.
