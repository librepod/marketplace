name: Validate App Manifests

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/*/metadata.yaml'
      - 'apps/*/base/**'
      - 'apps/*/overlays/**'
      - 'apps/*/components/**'
      - 'components/**'
      - 'infrastructure/system-apps/**'
      - 'scripts/**'
  # Direct pushes to master also run the repo-level jobs (version-lockstep in
  # particular): PRs are the usual gate, but the publish workflows fire on push
  # too, so the invariants must not be PR-only.
  push:
    branches: [master]
    paths:
      - 'apps/*/metadata.yaml'
      - 'apps/*/base/**'
      - 'apps/*/overlays/**'
      - 'apps/*/components/**'
      - 'components/**'
      - 'infrastructure/system-apps/**'
      - 'scripts/**'
  # Weekly sweep of the repo-level jobs: a forgotten rollout PR leaves the pin
  # drift stale without any commit touching the watched paths, so only a
  # scheduled run can fail it (check-version-lockstep.sh grace period).
  schedule:
    - cron: '13 6 * * 1'

jobs:
  # Closed category vocabulary gate (#314): a category outside this list is
  # either a typo (the Network/Networking split) or an undeclared new bucket.
  # Adding a category is a deliberate edit to the list below.
  catalog-categories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fail on app category outside the allowlist
        run: |
          set -uo pipefail
          ALLOWED="AI Development Finance Infrastructure Media Monitoring Network Productivity Security System Testing"
          status=0
          for m in apps/*/metadata.yaml; do
            category=$(grep -m1 '^  category:' "$m" | sed 's/.*category: *//' | tr -d '"')
            if [ -z "$category" ] || ! grep -qw "$category" <<<"$ALLOWED"; then
              echo "::error file=$m::$m: category \"$category\" is not in the allowlist: $ALLOWED"
              status=1
            fi
          done
          exit $status

  # Remote http(s) kustomize bases resolve live inside kustomize-controller on
  # every reconcile, bypassing Flux source caching — slow egress to the base's
  # host then stalls the app's Kustomization and its whole dependsOn tree (#311).
  # Apps must vendor upstream manifests into the artifact instead (pattern:
  # apps/nfs-provisioner/base/upstream/, apps/external-secrets-reloader/base/bundle.yaml).
  no-remote-bases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fail on remote http(s) kustomize bases
        run: |
          set -euo pipefail
          hits=$(grep -rnE '^[[:space:]]*-[[:space:]]*["'"'"']?https?://' \
            apps --include='kustomization*.yaml' || true)
          if [ -n "$hits" ]; then
            echo "::error::Remote http(s) kustomize bases are forbidden — vendor the manifests into the app instead (see apps/nfs-provisioner/base/upstream/)."
            echo "$hits"
            exit 1
          fi
          echo "No remote http(s) bases under apps/."

  detect-changes:
    # PR-only: it diffs against the PR base. On push events it is skipped, and
    # the skipped `needs` cascades to the app-matrix jobs (validate, e2e) —
    # only the repo-level jobs are meant to run there.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changes.outputs.apps }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: changes
        # apps/<app>/ diffs AND system-apps pin bumps (app resolved from the OCI
        # URL) feed the matrix — the rollout PR must run the same gates.
        run: echo "apps=$(bash scripts/detect-changed-apps.sh "${{ github.event.pull_request.base.sha }}")" >> "$GITHUB_OUTPUT"

  validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build + lint + flux render
        run: |
          nix-shell shell.nix --run '
            set -euo pipefail
            APP=${{ matrix.app }}
            echo "== kustomize build =="
            kustomize build "apps/$APP/overlays/librepod" > /tmp/rendered.yaml
            echo "== kubeconform =="
            kubeconform \
              -schema-location default \
              -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
              -strict -ignore-missing-schemas -summary /tmp/rendered.yaml
            echo "== flux build =="
            flux build kustomization "$APP" \
              --path "apps/$APP/overlays/librepod" \
              --local-sources GitRepository/flux-system/librepod-apps=./ \
              --dry-run || true
          '

  app-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check app/shared-component compatibility
        run: nix-shell shell.nix --run 'bash scripts/check-app-components.sh'

  # Version-pin lockstep, two-phase flow: PR 1 bumps the app (metadata +
  # artifact); PR 2 bumps the system-apps deploy pin and rolls the fleet (e2e +
  # CODEOWNERS review). Renovate only automates PR 1, so CI owns the coupling:
  # drift warns while fresh, fails once older than the grace period — the fleet
  # must not be stranded on a stale artifact with no failing signal.
  version-lockstep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: drift age = last commit touching apps/<app>/metadata.yaml
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check version pin lockstep
        run: nix-shell shell.nix --run 'bash scripts/check-version-lockstep.sh'

  e2e:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.apps != '[]' &&
      contains(github.event.pull_request.labels.*.name, 'renovate-e2e')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Ephemeral k3d deploy + smoke test
        run: |
          echo "On-demand e2e for ${{ matrix.app }} (label renovate-e2e present)."
          echo "TODO wiring note: reuse the k3d flow from ui-e2e-cluster.yaml /"
          echo "the verify-app skill to deploy apps/${{ matrix.app }} and smoke-test."
          # Placeholder gate: kept green until the k3d harness is wired in a follow-up.
