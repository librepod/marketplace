name: Publish Marketplace UI

# Owns the marketplace-ui Docker IMAGE only (source: ui/). The OCI manifest
# artifact (source: apps/marketplace-ui/) is published by the generic
# publish-apps.yaml workflow — keeping the image and manifest on independent
# cadences and avoiding a duplicate OCI push + cosign/Rekor 409.
on:
  push:
    branches: [master]
    paths:
      - 'ui/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
    paths:
      - 'ui/**'
  workflow_dispatch:

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get app version
        id: version
        run: |
          VERSION=$(grep 'version:' apps/marketplace-ui/metadata.yaml \
            | head -1 | sed 's/.*version: *//' | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="pr-${{ github.event.pull_request.number }}"
            docker buildx build --push \
              -t ghcr.io/librepod/marketplace-ui:${TAG} \
              ./ui
          else
            docker buildx build --push \
              -t ghcr.io/librepod/marketplace-ui:latest \
              -t ghcr.io/librepod/marketplace-ui:${{ steps.version.outputs.version }} \
              -t ghcr.io/librepod/marketplace-ui:${{ github.sha }} \
              ./ui
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: 'v3.1.3'

      - name: Sign Docker image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          retry() {
            # Retry through transient GHCR secondary rate-limits (HTTP 403)
            # during cosign signature blob uploads.
            local max=5 delay=15 i=0
            until "$@"; do
              i=$((i + 1))
              if [ "$i" -ge "$max" ]; then
                echo "::error::Failed after $i attempts: $*" >&2
                return 1
              fi
              echo "Attempt $i failed; retrying in ${delay}s..." >&2
              sleep "$delay"
              delay=$((delay + 15))
            done
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="pr-${{ github.event.pull_request.number }}"
            DIGEST=$(docker buildx imagetools inspect \
              ghcr.io/librepod/marketplace-ui:${TAG} \
              --format '{{.Manifest.Digest}}')
            retry cosign sign --yes "ghcr.io/librepod/marketplace-ui@${DIGEST}"
          else
            DIGEST=$(docker buildx imagetools inspect \
              ghcr.io/librepod/marketplace-ui:latest \
              --format '{{.Manifest.Digest}}')
            retry cosign sign --key env://COSIGN_PRIVATE_KEY --yes \
              "ghcr.io/librepod/marketplace-ui@${DIGEST}"
          fi

  comment:
    needs: [publish-image]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr_number = context.payload.pull_request.number;
            const tag = `pr-${pr_number}`;
            const owner = context.repo.owner;

            const body = `### PR Image Ready

            | Type | Tag |
            |------|-----|
            | Docker image | \`ghcr.io/${owner}/marketplace-ui:${tag}\` |`;

            github.rest.issues.createComment({
              ...context.repo,
              issue_number: pr_number,
              body
            });
