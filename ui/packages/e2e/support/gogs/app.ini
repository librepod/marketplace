[server]
DOMAIN = git.libre.pod
HTTP_PORT = 3000
EXTERNAL_URL = http://git.libre.pod/
DISABLE_SSH = true

[database]
TYPE = sqlite3
PATH = /data/gogs.db

[repository]
ROOT = /data/git/gogs-repositories

[log]
# Redirect all logs (incl. xorm.log) into the volume, which start.sh chowns to
# the git user. The image ships no /app/gogs/log dir, so the default root path
# would fail with "no such file or directory".
ROOT_PATH = /data/gogs/log

[security]
INSTALL_LOCK = true

[auth]
REQUIRE_SIGNIN_VIEW = true
