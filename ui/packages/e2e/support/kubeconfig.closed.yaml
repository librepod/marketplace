# Throwaway kubeconfig for Tier 1: points at a closed local port so the
# server's FluxStatusService (which calls loadFromDefault() when
# KUBERNETES_SERVICE_HOST is unset) gets an immediate ECONNREFUSED instead of
# reaching a real cluster. getStatusFor catches that and degrades to
# "installing" — keeping the suite hermetic (design constraint C2) without
# depending on the host's ~/.kube/config or dev-cluster state.
apiVersion: v1
kind: Config
clusters:
  - name: closed
    cluster:
      server: http://127.0.0.1:1
contexts:
  - name: closed
    context:
      cluster: closed
      user: closed
current-context: closed
users:
  - name: closed
    user: {}
