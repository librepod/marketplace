apiVersion: marketplace/v1
kind: Catalog
metadata:
  generatedAt: "2026-01-01T00:00:00Z"
apps:
  # The plain-install target: no settings, so Install fires directly (my-apps
  # asserts the toast without a dialog). Settings-dialog coverage lives on
  # renovate below.
  - name: vaultwarden
    version: "1.35.2"
    displayName: Vaultwarden
    description: Lightweight Bitwarden-compatible password manager server
    category: Security
    icon: https://example.com/vaultwarden.png
    sourceType: oci-kustomize
    sourceUrl: https://github.com/dani-garcia/vaultwarden
    templates:
      source: |
        apiVersion: source.toolkit.fluxcd.io/v1beta2
        kind: OCIRepository
        metadata:
          name: vaultwarden
          namespace: flux-system
        spec:
          url: oci://ghcr.io/librepod/marketplace/apps/vaultwarden
      release: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: vaultwarden
          namespace: vaultwarden
        spec:
          chart:
            spec:
              sourceRef:
                kind: OCIRepository
                name: vaultwarden
          values:
            domain: ${BASE_DOMAIN}
      kustomization: |
        apiVersion: kustomize.config.k8s.io/v1beta1
        kind: Kustomization
        resources:
          - source.yaml
          - release.yaml

  - name: gogs
    version: "1.1.0"
    displayName: Gogs
    description: Lightweight self-hosted Git service
    category: Development
    icon: https://example.com/gogs.png
    sourceType: oci-kustomize
    sourceUrl: oci://ghcr.io/librepod/marketplace/apps/gogs

  # A platform-managed app used as the e2e target for the read-only Platform
  # panel (see SYSTEM_APPS_OVERRIDE in projects/tier1.config.ts). Mirrors the
  # real-world case this feature fixes: it would normally appear
  # user-installable in the catalog, but the cluster manages it — so it is
  # excluded from /api/apps and install is refused (409) by the system guard
  # before the templates check. Deliberately not asserted by any other spec.
  - name: frp-operator
    version: "0.1.0"
    displayName: FRP Operator
    description: Fast reverse proxy operator for exposing services
    category: Networking
    icon: https://example.com/frp-operator.png
    sourceType: oci-kustomize
    sourceUrl: oci://ghcr.io/librepod/marketplace/apps/frp-operator

  - name: litellm
    version: "1.81.9"
    displayName: LiteLLM
    description: Open-source API gateway for 100+ LLM providers
    category: AI
    icon: https://example.com/litellm.png
    sourceType: oci-kustomize
    sourceUrl: oci://ghcr.io/librepod/marketplace/apps/litellm
    templates:
      source: |
        apiVersion: source.toolkit.fluxcd.io/v1beta2
        kind: OCIRepository
        metadata:
          name: litellm
          namespace: flux-system
        spec:
          url: oci://ghcr.io/librepod/marketplace/apps/litellm
      release: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: litellm
          namespace: litellm
        spec:
          chart:
            spec:
              sourceRef:
                kind: OCIRepository
                name: litellm
          values:
            ingress:
              host: litellm.${BASE_DOMAIN}
      kustomization: |
        apiVersion: kustomize.config.k8s.io/v1beta1
        kind: Kustomization
        resources:
          - source.yaml
          - release.yaml

  # Has install questions (catalog `settings`): Install opens a dialog, and the
  # answers go to the dev-mode OpenBao — never into the Gogs repo.
  - name: renovate
    version: "41.0.0"
    displayName: Renovate
    description: Keeps your project dependencies up to date
    category: Automation
    icon: https://example.com/renovate.png
    sourceType: oci-kustomize
    sourceUrl: oci://ghcr.io/librepod/marketplace/apps/renovate
    settings:
      allowCustom: true
      items:
        - name: RENOVATE_TOKEN
          label: Access token
          description: Personal Access Token for your Git platform (repo, pull-request and issues scopes).
          sensitive: true
          required: true
        - name: RENOVATE_GITHUB_COM_TOKEN
          label: GitHub.com token
          description: PAT for github.com to fetch changelogs when your platform is NOT github.com. Leave empty when targeting github.com.
          sensitive: true
        # Fixture-local generated item (no real app ships this name): the dialog
        # must hide it and the installer must resolve it server-side into the
        # OpenBao entry (install-settings.spec.ts asserts both).
        - name: E2E_FIXTURE_CACHE_KEY
          label: Fixture cache key
          description: Machine-generated at install time; the dialog never asks for it.
          generate:
            length: 32
    templates:
      source: |
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: marketplace-renovate
          namespace: flux-system
        spec:
          url: oci://ghcr.io/librepod/marketplace/apps/renovate
      release: |
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: marketplace-renovate
          namespace: flux-system
        spec:
          sourceRef:
            kind: OCIRepository
            name: marketplace-renovate
          path: ./overlays/librepod
      kustomization: |
        apiVersion: kustomize.config.k8s.io/v1beta1
        kind: Kustomization
        resources:
          - source.yaml
          - release.yaml

  - name: traefik
    version: "1.0.0"
    displayName: Traefik
    description: Cloud-native edge router and load balancer
    category: Infrastructure
    icon: https://example.com/traefik.png
    sourceType: oci-kustomize
    sourceUrl: oci://ghcr.io/librepod/marketplace/apps/traefik
  - name: cert-manager
    version: "1.0.0"
    displayName: Cert-Manager
    description: Cloud-native certificate management
    category: Infrastructure
    icon: https://example.com/cert-manager.png
    sourceType: oci-kustomize
    sourceUrl: oci://ghcr.io/librepod/marketplace/apps/cert-manager
  - name: nfs-provisioner
    version: "1.0.0"
    displayName: NFS Provisioner
    description: Kubernetes dynamic provisioner for NFS storage
    category: Infrastructure
    icon: https://example.com/nfs.png
    sourceType: oci-kustomize
    sourceUrl: oci://ghcr.io/librepod/marketplace/apps/nfs-provisioner
