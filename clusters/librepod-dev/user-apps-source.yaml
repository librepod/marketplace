---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: user-apps-source
  namespace: flux-system
spec:
  dependsOn:
    - name: system-configs
    - name: gogs
  interval: 1h
  retryInterval: 2m
  # Do NOT lower: `timeout` bounds the health check below, which waits on the
  # seeding Job (whose own worst case is now apk + the 4-attempt download
  # ladder ≈ 20 min all-stalled + the 300s Gogs poll, bounded by its
  # activeDeadlineSeconds: 1800 — see bootstrap-ssh-key/job.yaml). Keep the
  # timeout ≥ that deadline or cold boots show spurious Ready=False.
  # Why: docs/DECISIONS_LOG.md row 8.
  timeout: 35m
  sourceRef:
    kind: OCIRepository
    name: marketplace-bootstrap
  path: ./infrastructure/user-apps-source
  prune: true
  # Ready ⇔ Flux cloned a SEEDED repo, and that is all. Do NOT "fix" this to
  # `wait: true`: the CRD ignores healthChecks when wait is enabled, so it would
  # health-check every applied object — Kustomization/user-apps included — which is
  # exactly the coupling #182 removes. Why: docs/DECISIONS_LOG.md row 8.
  wait: false
  healthChecks:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: user-apps-source
      namespace: flux-system
  patches: []
  postBuild:
    substitute:
      BASE_DOMAIN: "librepod.dev"
