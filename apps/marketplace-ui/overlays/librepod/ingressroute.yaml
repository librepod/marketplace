apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: marketplace-ui
spec:
  entryPoints:
  - web
  - websecure
  routes:
  # Bare apex — the device's front door: https://libre.pod lands on the
  # marketplace. Requires the shared default cert to also list this host
  # (the *.libre.pod wildcard does not cover the apex); see
  # infrastructure/system-configs/certificate.yaml.
  - kind: Rule
    match: Host(`${BASE_DOMAIN:=libre.pod}`)
    services:
    - name: marketplace-ui
      port: 80
  # Subdomain kept for backward compatibility / direct links.
  - kind: Rule
    match: Host(`marketplace.${BASE_DOMAIN:=libre.pod}`)
    priority: 1
    services:
    - name: marketplace-ui
      port: 80
  tls: {}
