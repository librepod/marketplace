apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- ingressroute.yaml
- ingressroute-ip.yaml
- ssoclient.yaml
- externalsecret-ca.yaml

components:
# Generates Secret/marketplace-ui-session (a random HMAC session-cookie key) on
# first install. The Secret is Job-owned, never committed, so Flux cannot
# clobber it back to a placeholder — same model as headscale's bootstrap-api-key.
- ../../components/bootstrap-session-secret

namespace: marketplace-ui

patches:
  - path: deployment-auth-patch.yaml

images:
  - name: marketplace-ui
    newName: ghcr.io/librepod/marketplace-ui
    newTag: "0.8.1"
