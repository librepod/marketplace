# HMAC signing key for the NestJS session cookie (SessionService). This is NOT
# an OIDC credential — it only signs/verifies our own session cookie. Same
# pattern as Secret/oauth2-proxy-cookie: a committed default that works
# out-of-box, Flux-substitutable so a cluster can override it.
#
# To use your own, set MARKETPLACE_UI_SESSION_SECRET in the cluster's Flux
# Kustomization (postBuild.substitute). Generate one with:
#   openssl rand -base64 32
# ${...:=default} is expanded by Flux postBuild.substitute at deploy time; the
# :=default fires on unset OR empty (but only when the substitute map is
# non-empty — production always sets BASE_DOMAIN, so it is). In a plain
# `kustomize build` the value stays literal, which is still a valid HMAC key.
apiVersion: v1
kind: Secret
metadata:
  name: marketplace-ui-session
  namespace: marketplace-ui
type: Opaque
stringData:
  session-secret: "${MARKETPLACE_UI_SESSION_SECRET:=NZcbV2j7TK5DZTTEwD/tqssrP8CdDqHrjz/HpHjMJDg=}"
