# The gogs flux-account credential — the SAME one flux-system's
# GitRepository/user-apps-source authenticates with — synced by the External
# Secrets Operator from openbao KV apps/user-apps-source (published by the
# gogs publish-auth Job). The installer and Flux can never drift on WHO wrote
# the user-apps repo. Replaces the empty Reflector-mirror stub generator
# (#253); the deployment mounts the Secret (volume user-apps-git-credentials,
# optional until first sync) and the server reads username/password files.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-apps-git-auth
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: user-apps-git-auth
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: apps/user-apps-source
        property: username
    - secretKey: password
      remoteRef:
        key: apps/user-apps-source
        property: password
