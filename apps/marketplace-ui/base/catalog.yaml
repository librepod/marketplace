      category: "Security"
      icon: "https://raw.githubusercontent.com/dani-garcia/vaultwarden/main/resources/vaultwarden-icon.svg"
      sourceType: oci-kustomize
      sourceUrl: "oci://ghcr.io/librepod/marketplace/apps/vaultwarden"
      templates:
        source: |
            apiVersion: source.toolkit.fluxcd.io/v1
            kind: OCIRepository
            metadata:
              name: marketplace-vaultwarden
              namespace: flux-system
              labels:
                marketplace.io/managed: "true"
                marketplace.io/app: "vaultwarden"
            spec:
              interval: 10m
              url: oci://ghcr.io/librepod/marketplace/apps/vaultwarden
              ref:
                tag: "1.37.0"
        release: |
            apiVersion: kustomize.toolkit.fluxcd.io/v1
            kind: Kustomization
            metadata:
              name: marketplace-vaultwarden
              namespace: flux-system
              labels:
                marketplace.io/managed: "true"
                marketplace.io/app: "vaultwarden"
            spec:
              dependsOn:
                - name: casdoor-sso-controller
              interval: 10m
              targetNamespace: vaultwarden
              sourceRef:
                kind: OCIRepository
                name: marketplace-vaultwarden
              path: ./overlays/librepod
              prune: true
              wait: true
              postBuild:
                substitute:
                  BASE_DOMAIN: "${BASE_DOMAIN}"
                substituteFrom:
                  - kind: Secret
                    name: vaultwarden-config
        secret: |
            apiVersion: v1
            kind: Secret
            metadata:
              name: vaultwarden-config
              namespace: flux-system
              labels:
                marketplace.io/managed: "true"
                marketplace.io/app: "vaultwarden"
            type: Opaque
            stringData:
              ADMIN_TOKEN: "${ADMIN_TOKEN}"
        kustomization: |
            apiVersion: kustomize.config.k8s.io/v1beta1
            kind: Kustomization
            resources:
              - source.yaml
              - release.yaml
              - secret.yaml
      params:
            required:
              - name: BASE_DOMAIN
                description: "Base domain (app will be at vaultwarden.BASE_DOMAIN)"
                type: string
                example: "example.com"
      secrets:
            - name: ADMIN_TOKEN
              description: "Admin panel access token (leave empty to disable admin panel)"
              required: false
              generate:
                type: random
                length: 64
    - name: wg-easy
      version: "15.3.0"
      displayName: "WG Easy"
      description: "WireGuard VPN with a web-based configuration UI for easy setup and management"
      category: "Network"
      icon: "https://raw.githubusercontent.com/wg-easy/wg-easy/master/src/assets/img/logo.png"
      sourceType: oci-kustomize
      sourceUrl: "oci://ghcr.io/librepod/marketplace/apps/wg-easy"
      templates:
        source: |
            apiVersion: source.toolkit.fluxcd.io/v1
            kind: OCIRepository
            metadata:
              name: marketplace-wg-easy
              namespace: flux-system
              labels:
                marketplace.io/managed: "true"
                marketplace.io/app: "wg-easy"
            spec:
              interval: 10m
              url: oci://ghcr.io/librepod/marketplace/apps/wg-easy
              ref:
                tag: "15.3.0"
        release: |
            apiVersion: kustomize.toolkit.fluxcd.io/v1
            kind: Kustomization
            metadata:
              name: marketplace-wg-easy
              namespace: flux-system
              labels:
                marketplace.io/managed: "true"
                marketplace.io/app: "wg-easy"
            spec:
              dependsOn:
                - name: traefik
                - name: storage
              interval: 1h
              retryInterval: 2m
              timeout: 5m
              sourceRef:
                kind: OCIRepository
                name: marketplace-wg-easy
              path: ./overlays/librepod
              prune: true
              wait: true
              postBuild:
                substitute:
                  BASE_DOMAIN: "${BASE_DOMAIN}"
                  FRP_SERVER_ADDR: "${FRP_SERVER_ADDR}"
                  FRP_REMOTE_PORT: "${FRP_REMOTE_PORT}"
                  WIREGUARD_PROXY_NAME: "${WIREGUARD_PROXY_NAME}"
                  TZ: "${TZ}"
        kustomization: |
            apiVersion: kustomize.config.k8s.io/v1beta1
            kind: Kustomization
            resources:
              - source.yaml
              - release.yaml
      params:
            required:
              - name: BASE_DOMAIN
                description: "Base domain for cluster (WG Easy web UI will be at wg-easy.BASE_DOMAIN)"
                type: string
                example: "example.com"
              - name: FRP_SERVER_ADDR
                description: "FRP server public address (WireGuard clients connect to this host)"
                type: string
                example: "vla1.libreport.ru"
            optional:
              - name: TZ
                description: "Timezone for the wg-easy server (IANA name, e.g. Europe/Moscow)"
                type: string
                default: "UTC"
              - name: FRP_REMOTE_PORT
                description: "Public port on the FRP relay. Default 51820. Set to 0 to let the relay auto-assign (discover the port in frpc logs / frps dashboard)."
                type: string
                default: "51820"
              - name: WIREGUARD_PROXY_NAME
                description: "FRP proxy name (the Upstream CR name). Must be unique per relay when devices share a relay. Default wg-easy-wireguard; set wg-easy-wireguard-<device> to share."
                type: string
                default: "wg-easy-wireguard"
