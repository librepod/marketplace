      category: "Network"
      icon: "https://raw.githubusercontent.com/fatedier/frp/main/doc/pic/frp.png"
      sourceType: oci-kustomize
      sourceUrl: "oci://ghcr.io/librepod/marketplace/apps/frpc"
      templates:
        source: |
            apiVersion: source.toolkit.fluxcd.io/v1
            kind: OCIRepository
            metadata:
              name: frpc
