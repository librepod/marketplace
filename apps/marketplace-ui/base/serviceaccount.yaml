apiVersion: v1
kind: ServiceAccount
metadata:
  name: marketplace-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: marketplace-ui-flux-reader
rules:
  - apiGroups: ['kustomize.toolkit.fluxcd.io']
    resources: ['kustomizations']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['helm.toolkit.fluxcd.io']
    resources: ['helmreleases']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['source.toolkit.fluxcd.io']
    resources: ['ocirepositories']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  # Read-only: LaunchUrlService lists IngressRoutes per app namespace to resolve
  # the launch tile (the librepod.org/launch path override + the zero-route
  # "no web UI" suppression). Without this the list call is denied, the service
  # swallows the error and returns "no opinion", and every app's tile falls back
  # to https://<name>.<domain> — ignoring both signals.
  - apiGroups: ['traefik.io']
    resources: ['ingressroutes']
    verbs: ['get', 'list', 'watch']
  # Read-only: GitRemoteService reads spec.url + spec.ref.branch from
  # GitRepository/user-apps-source so the installer always commits to the repo
  # Flux is actually reconciling. Repointing that object at GitHub/GitLab needs
  # no code change. The Secret it references is deliberately NOT read here — its
  # name is dynamic, so RBAC could not scope it and this would need `get secrets`
  # across all of flux-system; the credential is mounted instead.
  - apiGroups: ['source.toolkit.fluxcd.io']
    resources: ['gitrepositories']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: marketplace-ui-flux-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: marketplace-ui-flux-reader
subjects:
  - kind: ServiceAccount
    name: marketplace-ui
    namespace: marketplace-ui
---
# Persist Secret/marketplace-ui-admin-credential — the device-admin password
# the onboarding wizard provisions to wg-easy (and future apps) at claim
# time. Not in Git (like marketplace-ui-session), so Flux never prunes it.
# create cannot be scoped by resourceNames (the object doesn't exist yet),
# get/patch/update are locked to the one name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: marketplace-ui-admin-credential
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch", "update"]
    resourceNames: ["marketplace-ui-admin-credential"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: marketplace-ui-admin-credential
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: marketplace-ui-admin-credential
subjects:
  - kind: ServiceAccount
    name: marketplace-ui
    namespace: marketplace-ui
