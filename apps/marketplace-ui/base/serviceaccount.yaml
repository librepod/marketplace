apiVersion: v1
kind: ServiceAccount
metadata:
  name: marketplace-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: marketplace-ui-flux-reader
rules:
  - apiGroups: ['kustomize.toolkit.fluxcd.io']
    resources: ['kustomizations']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['helm.toolkit.fluxcd.io']
    resources: ['helmreleases']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['source.toolkit.fluxcd.io']
    resources: ['ocirepositories']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  # Read-only: LaunchUrlService lists IngressRoutes per app namespace to resolve
  # the launch tile (the librepod.org/launch path override + the zero-route
  # "no web UI" suppression). Without this the list call is denied, the service
  # swallows the error and returns "no opinion", and every app's tile falls back
  # to https://<name>.<domain> — ignoring both signals.
  - apiGroups: ['traefik.io']
    resources: ['ingressroutes']
    verbs: ['get', 'list', 'watch']
  # Read-only: GitRemoteService reads spec.url + spec.ref.branch from
  # GitRepository/user-apps-source so the installer always commits to the repo
  # Flux is actually reconciling. Repointing that object at GitHub/GitLab needs
  # no code change. The Secret it references is deliberately NOT read here — its
  # name is dynamic, so RBAC could not scope it and this would need `get secrets`
  # across all of flux-system; the credential is mounted instead.
  - apiGroups: ['source.toolkit.fluxcd.io']
    resources: ['gitrepositories']
    verbs: ['get', 'list', 'watch']
  # Read-only: NodeAddressService reads this pod's own Node (NODE_NAME, from the
  # downward API) for its InternalIP — the device's LAN address, rendered as
  # ${DEVICE_IP} into app templates that ask for it (the VPN endpoint host).
  # get only: the server never lists nodes.
  - apiGroups: ['']
    resources: ['nodes']
    verbs: ['get']
  # Patch only: InstalledService.updateSettings annotates the app's <app>-settings
  # ExternalSecret with force-sync after a save, so ESO re-syncs it now and the
  # reloader restarts the app. A denied patch only delays the restart.
  - apiGroups: ['external-secrets.io']
    resources: ['externalsecrets']
    verbs: ['patch']
  # DeviceService: LibrePod OS's Device (one per node). patch writes the owner's
  # answers into spec. patch devices is effectively root on the node: spec.sshKeys
  # grants a login as librepod, which has sudo. Only this ServiceAccount may hold
  # it. Never devices/status — only the OS agent writes status.
  - apiGroups: ['os.librepod.org']
    resources: ['devices']
    verbs: ['get', 'list', 'watch', 'patch']
  # Live CPU/memory for the Device page, from k3s's bundled metrics-server.
  - apiGroups: ['metrics.k8s.io']
    resources: ['nodes']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: marketplace-ui-flux-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: marketplace-ui-flux-reader
subjects:
  - kind: ServiceAccount
    name: marketplace-ui
    namespace: marketplace-ui
