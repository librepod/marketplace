apiVersion: v1
kind: ConfigMap
metadata:
  name: marketplace-ui-env
data:
  PORT: "3000"
  CATALOG_PATH: "/data/catalog.yaml"
  # Where the app-store repo working copy and the private credential copies live
  # (the emptyDir mounted by the Deployment).
  USER_APPS_WORK_DIR: "/var/lib/user-apps"
  USER_APPS_GIT_CREDENTIALS_DIR: "/etc/user-apps-git"
  # NB: no USER_APPS_GIT_URL here on purpose. It is discovered from
  # GitRepository/user-apps-source, so the installer can never commit to a repo
  # Flux is not reading; the env var exists only as a test seam (Tier 1).
  # The cluster's app zone, substituted by Flux postBuild (system-apps sets
  # BASE_DOMAIN). The server reads this to build every launch link
  # (https://<name>.<BASE_DOMAIN>); without it the server falls back to its
  # own "libre.pod" default, so on any device whose domain is NOT libre.pod the
  # "My Apps" launch tiles would point at the wrong host.
  BASE_DOMAIN: "${BASE_DOMAIN:=libre.pod}"
  ALLOWED_ORIGINS: "https://marketplace.${BASE_DOMAIN:=libre.pod}"
  CASDOOR_ENDPOINT: "https://id.${BASE_DOMAIN:=libre.pod}"
  CASDOOR_ORG_NAME: "librepod"
  CASDOOR_APP_NAME: "marketplace-ui"
  # In-cluster service URLs for first-run onboarding: the wizard proxies
  # Casdoor's admin API and wg-easy's API because the browser (raw IP, no DNS
  # yet) cannot reach either host. http, not https — cluster-internal traffic.
  CASDOOR_BASE_URL: "http://casdoor.casdoor.svc.cluster.local"
  WGEASY_BASE_URL: "http://wg-easy.wg-easy.svc.cluster.local"
  # Factory admin passwords the wizard probes to tell onboarding mode from
  # claimed, and rotates to the user's chosen password at claim time. Both are
  # committed defaults by design (public in this repo, same as wg-easy's
  # INIT_PASSWORD env) — the claim itself closes the window. No Reflector
  # mirroring of wg-easy's Secret: Reflector is retired (ESO era), and the
  # wizard needs only this public value, never a live one.
  CASDOOR_ADMIN_DEFAULT_PASSWORD: "123"
  WGEASY_ADMIN_DEFAULT_PASSWORD: "ChangeMeOnFirstLogin!"
  # Settings store (install questions + generated secrets) — the OpenBao system
  # app. Unset OPENBAO_ADDR would make every settings install 503. The KV mount
  # is "apps" (NOT the client default "secret") — see the ClusterSecretStore.
  # OPENBAO_AUTH_MOUNT/ROLE defaults (kubernetes / marketplace-ui) match the
  # role the openbao bootstrap Job creates. Never set OPENBAO_TOKEN here — it
  # is a Tier-1 test seam only.
  OPENBAO_ADDR: "http://openbao.openbao.svc.cluster.local:8200"
  OPENBAO_KV_MOUNT: "apps"
