apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace-ui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: marketplace-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketplace-ui
    spec:
      serviceAccountName: marketplace-ui
      initContainers:
        # Gate the server on the Gogs `flux` admin USER existing, not just on the
        # gogs pod answering on :3000. The gogs Deployment becomes Ready (TCP
        # :3000) before its postStart hook finishes `gogs admin create-user`, so
        # `dependsOn: gogs` alone leaves a window where the user is absent. The
        # server bootstraps its API token ONCE at startup (Basic-auth POST to
        # /users/<user>/tokens) and never retries — if it boots in that window
        # the token is empty for the pod's whole life and every install 500s.
        # Poll the exact call the server makes so success here guarantees the
        # server's onModuleInit succeeds. Best-effort: after the bound we still
        # start (the server logs its own failure) rather than block forever.
        - name: wait-for-gogs-user
          image: alpine:3.19
          command: ["/bin/sh", "-c"]
          env:
            - name: GOGS_URL
              valueFrom:
                configMapKeyRef:
                  name: marketplace-ui-env
                  key: GOGS_URL
            - name: GOGS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gogs-auth
                  key: username
            - name: GOGS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gogs-auth
                  key: password
          args:
            - |
              AUTH="$(printf '%s:%s' "$GOGS_USERNAME" "$GOGS_TOKEN" | base64 | tr -d '\n')"
              i=0
              until wget -q -O /dev/null \
                  --header="Authorization: Basic $AUTH" \
                  "$GOGS_URL/api/v1/users/$GOGS_USERNAME/tokens"; do
                i=$((i + 1))
                if [ "$i" -ge 60 ]; then
                  echo "WARN: gogs user '$GOGS_USERNAME' not authenticating after 300s; starting anyway (server will log the token-bootstrap result)." >&2
                  exit 0
                fi
                echo "Waiting for gogs user '$GOGS_USERNAME' to exist and authenticate ($i/60)..."
                sleep 5
              done
              echo "gogs user '$GOGS_USERNAME' authenticates; server token bootstrap will succeed."
      containers:
        - name: marketplace-ui
          image: marketplace-ui
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: marketplace-ui-env
          env:
            - name: GOGS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gogs-auth
                  key: username
            - name: GOGS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gogs-auth
                  key: password
          volumeMounts:
            - name: catalog
              mountPath: /data
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: catalog
          configMap:
            name: marketplace-ui-catalog
