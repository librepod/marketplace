apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace-ui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: marketplace-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketplace-ui
    spec:
      serviceAccountName: marketplace-ui
      # NOTE: the `wait-for-gogs-user` initContainer that used to live here was
      # removed (issue #180). It polled a Gogs-only endpoint (the flux admin
      # USER) and never gated on the seeded flux/user-apps REPO, so the server
      # could still become Ready against a commitless repo and the first install
      # would 500. Repo readiness is now enforced provider-neutrally by the
      # marketplace-ui Kustomization's `dependsOn: user-apps` (a Flux Kustomization
      # that is Ready ⇔ the repo is cloned+applied — works for Gogs/GitHub/GitLab
      # alike). The server also self-heals its token lazily (GogsService.ensureToken).
      # The CA-merge initContainer is added by overlays/librepod/deployment-auth-patch.yaml.
      containers:
        - name: marketplace-ui
          image: marketplace-ui
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: marketplace-ui-env
          env:
            - name: GOGS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gogs-auth
                  key: username
            - name: GOGS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gogs-auth
                  key: password
          volumeMounts:
            - name: catalog
              mountPath: /data
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: catalog
          configMap:
            # Rendered by the separate marketplace-catalog Kustomization
            # (CI-published OCI artifact), which reconciles independently of
            # this app. Optional so pods still schedule during bootstrap or
            # upgrade windows when that ConfigMap does not exist yet — the
            # server starts with an empty catalog and hot-reloads it (it
            # watches the mount directory) as soon as kubelet mounts it.
            name: marketplace-catalog
            optional: true
