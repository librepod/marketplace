apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace-ui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: marketplace-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketplace-ui
    spec:
      serviceAccountName: marketplace-ui
      # NOTE: repo readiness is enforced provider-neutrally by the marketplace-ui
      # Kustomization's `dependsOn: user-apps-source`, whose Ready condition is a
      # selective healthCheck on GitRepository/user-apps-source — i.e. "Flux
      # cloned a seeded repo". It deliberately does NOT depend on `user-apps`:
      # that Kustomization builds every installed app's YAML, so one broken app
      # would block re-applying the installer UI (issue #182).
      # The CA-merge initContainer is added by overlays/librepod/deployment-auth-patch.yaml.
      containers:
        - name: marketplace-ui
          image: marketplace-ui
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: marketplace-ui-env
          volumeMounts:
            - name: catalog
              mountPath: /data
              readOnly: true
            # The same credential Flux uses for this repo, as `username`/`password`
            # files (GitRemoteService reads exactly those two names).
            - name: user-apps-git-credentials
              mountPath: /etc/user-apps-git
              readOnly: true
            # Working copy of the app-store repo (shallow clone) + the generated
            # .git-credentials. Disposable: rebuilt on demand.
            - name: user-apps-work
              mountPath: /var/lib/user-apps
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: catalog
          configMap:
            # Rendered by the separate marketplace-catalog Kustomization
            # (CI-published OCI artifact), which reconciles independently of
            # this app. Optional so pods still schedule during bootstrap or
            # upgrade windows when that ConfigMap does not exist yet — the
            # server starts with an empty catalog and hot-reloads it (it
            # watches the mount directory) as soon as kubelet mounts it.
            name: marketplace-catalog
            optional: true
        # user-apps-git-auth is generated EMPTY by this app's kustomization and
        # filled by Reflector from gogs/user-apps-source-auth. Two guards, because
        # data-less and missing are different failures: the empty placeholder covers
        # an EMPTY Secret (mounts fine), `optional: true` covers an ABSENT one — a
        # missing Secret blocks the mount and the pod never starts. That window is
        # real: this release's gogs-auth → user-apps-git-auth rename, a rotation, or
        # cold-boot-repro.sh, which deletes it in all three namespaces. The server
        # already tolerates both — GitRemoteService throws a named "no
        # username/password in env or /etc/user-apps-git" on writes, reads degrade.
        - name: user-apps-git-credentials
          secret:
            secretName: user-apps-git-auth
            optional: true
        - name: user-apps-work
          emptyDir: {}
