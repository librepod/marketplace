apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: marketplace-ui

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: marketplace-ui

resources:
- namespace.yaml
- serviceaccount.yaml
- configmap.yaml
- service.yaml
- deployment.yaml
- externalsecret-git-auth.yaml
