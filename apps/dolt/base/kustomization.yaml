apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dolt

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: dolt

configMapGenerator:
- name: dolt
  envs:
  - dolt.env

resources:
- namespace.yaml
- secret.yaml
- pvc.yaml
- service.yaml
- deployment.yaml
