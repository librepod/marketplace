apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dolt-settings
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: dolt-settings
  dataFrom:
    - extract:
        # The full entry is <mount>/<name>; ESO accepts the mount-prefixed key
        # and strips the leading store path.
        key: apps/dolt
