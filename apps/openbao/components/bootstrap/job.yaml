# Post-deploy bootstrap: initializes OpenBao on first boot (recovery keys +
# root token land in the openbao-credentials Secret) and configures the KV v2
# engine, Kubernetes auth, OIDC auth (Casdoor SSO), policies and roles.
# Site-specific policies come from the overlay's openbao-policies ConfigMap
# (optional mount). (The audit device is declared in the server
# configuration instead — see helmrelease.yaml.)
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-bootstrap
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao
spec:
  backoffLimit: 6
  # ≥ the two bounded waits in bootstrap.sh: up to 15 min for the
  # step-certificates publisher to land apps/step-ca in KV (cold boot) + 5 min
  # for the SSO Secret, plus the init/API-wait budget.
  activeDeadlineSeconds: 1800
  # ttlSecondsAfterFinished: Flux recreates the Job on each reconcile after
  # the TTL GC (same pattern as the step-ca bootstrap Job). Every re-run
  # re-applies the configuration idempotently and refreshes the OIDC trust CA
  # from KV (apps/step-ca) — so a re-initialized step-ca CA is picked up
  # within ~one recreate cycle. (The CA *publication* into KV lives in the
  # step-certificates bootstrap Job, not here.) The script rides the
  # hash-disabled openbao-bootstrap ConfigMap, so script edits never touch
  # this (immutable-while-the-object-exists) spec.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao
      annotations:
        # Bump whenever an overlay policy .hcl changes: the Job spec is
        # immutable, so this is what makes the apply recreate (force:true) and
        # re-run the bootstrap, which re-applies policies idempotently.
        openbao.librepod/policies-version: "3"
    spec:
      restartPolicy: Never
      serviceAccountName: openbao-bootstrap
      containers:
        # Waits for the server, initializes it once and applies all
        # runtime configuration via the bao CLI.
        - name: bootstrap
          image: openbao/openbao   # tag pinned in the overlay
          env:
            - name: BAO_ADDR
              value: http://openbao.openbao.svc.cluster.local:8200
            # Public coordinates of the OIDC setup (substituted by Flux
            # postBuild.substitute at deploy time — never inside the script
            # itself, whose ${...} patterns Flux would mangle).
            - name: BAO_PUBLIC_ADDR
              value: https://openbao.${BASE_DOMAIN:=libre.pod}
            - name: SSO_DISCOVERY_URL
              value: https://id.${BASE_DOMAIN:=libre.pod}
          command: ["/bin/sh", "/bootstrap/bootstrap.sh"]
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
            - name: policies
              mountPath: /policies
            - name: shared
              mountPath: /shared
            # write access only to drop a stale credentials copy when the
            # data volume turns out to have been wiped (see bootstrap.sh)
            - name: seal
              mountPath: /seal
            # OIDC client credentials (provisioned by the
            # casdoor-sso-controller from the SSOClient CR). optional:true —
            # the SECRET is late (controller reconcile lag): the script waits
            # for the files in-pod (bootstrap.sh), so a missing Secret delays
            # only the SSO section, never the init/KV/k8s-auth bootstrap
            # itself. Kubelet populates the volume once the Secret appears.
            - name: sso
              mountPath: /sso
              readOnly: true
        # Persists the root token + recovery keys to the openbao-credentials
        # Secret on first init and mirrors them to the seal PVC, so a
        # reinstall that preserves the volumes restores the Secret (and thus
        # admin access) automatically; hands the root token to the bootstrap
        # container on re-runs.
        - name: store-credentials
          image: alpine/k8s:1.34.9
          # uid/gid 100/1000 match the server's seal-key-init writer; NFS
          # writes as non-root are proven, root may be squashed
          securityContext:
            runAsUser: 100
            runAsGroup: 1000
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
            - name: shared
              mountPath: /shared
            - name: seal
              mountPath: /seal
          command: ["/bin/sh", "/bootstrap/store.sh"]
      volumes:
        - name: bootstrap
          configMap:
            name: openbao-bootstrap
        # site-specific policies from the overlay; optional so the component
        # is complete without them
        - name: policies
          configMap:
            name: openbao-policies
            optional: true
        - name: shared
          emptyDir: {}
        # seal volume is RWO: the Job pod must schedule on the same node as
        # the server pod — always true on single-node clusters
        - name: seal
          persistentVolumeClaim:
            claimName: openbao-seal
        # OIDC client credentials written by the casdoor-sso-controller
        # (SSOClient CR in the overlay); optional — see the mount comment
        - name: sso
          secret:
            secretName: openbao-sso
            optional: true
