apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-audit-rotation
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
