apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openbao

resources:
- ../../base
- ingressroute.yaml
- certificate.yaml
- ssoclient.yaml

components:
- ../../components/audit-rotation
- ../../components/bootstrap

configMapGenerator:
  # Site-specific OpenBao policies: every *.hcl here becomes a policy named
  # after its file (written by the bootstrap Job).
  - name: openbao-policies
    files:
      - eso-read-apps.hcl=policies/eso-read-apps.hcl
      - marketplace-ui-write-apps.hcl=policies/marketplace-ui-write-apps.hcl
    options:
      # the bootstrap Job mounts this ConfigMap; a name hash would rewrite
      # the immutable Job spec on every content change and brick the apply
      disableNameSuffixHash: true
  # LibrePod root CA stub, mirrored by Reflector from step-ca: the bootstrap
  # Job mounts it and passes it to the server via oidc_discovery_ca_pem, so
  # the server's OIDC calls to https://id.<BASE_DOMAIN> verify the private
  # CA (docs/sso-app-author-guide.md §4).
  # disableNameSuffixHash is REQUIRED: Reflector keys replication off this
  # exact object name, and the pods mount the ConfigMap by name.
  - name: step-certificates-certs
    options:
      disableNameSuffixHash: true
      annotations:
        reflector.v1.k8s.emberstack.com/reflects: "step-ca/step-certificates-certs"

# Structural exception (skill "Image versions", cross-renderer category): the
# bootstrap Job is a Kustomize-rendered resource that must run the SAME openbao
# binary the Helm chart deploys. The HelmRelease sets no image tag (chart
# appVersion owns it); this newTag must match that appVersion — move both
# together on chart-pin bumps.
images:
- name: openbao/openbao
  newTag: 2.7.1

patches:
- path: ./patch-helmrelease.yaml
  target:
    kind: HelmRelease
- path: ./patch-storage-class.yaml
  target:
    kind: PersistentVolumeClaim
