apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openbao

resources:
- ../../base
- ingressroute.yaml

components:
- ../../components/audit-rotation
- ../../components/bootstrap

configMapGenerator:
  # Site-specific OpenBao policies: every *.hcl here becomes a policy named
  # after its file (written by the bootstrap Job). Bump the Job's
  # openbao.librepod/policies-version annotation when these change.
  - name: openbao-policies
    files:
      - eso-read-apps.hcl=policies/eso-read-apps.hcl
      - marketplace-ui-write-apps.hcl=policies/marketplace-ui-write-apps.hcl
      - step-certificates-write-apps.hcl=policies/step-certificates-write-apps.hcl
    options:
      # the bootstrap Job mounts this ConfigMap; a name hash would rewrite
      # the immutable Job spec on every content change and brick the apply
      disableNameSuffixHash: true

# Structural exception (skill "Image versions", cross-renderer category): the
# bootstrap Job is a Kustomize-rendered resource that must run the SAME openbao
# binary the Helm chart deploys. The HelmRelease sets no image tag (chart
# appVersion owns it); this newTag must match that appVersion — move both
# together on chart-pin bumps.
images:
- name: openbao/openbao
  newTag: 2.7.1

patches:
- path: ./patch-helmrelease.yaml
  target:
    kind: HelmRelease
- path: ./patch-storage-class.yaml
  target:
    kind: PersistentVolumeClaim
