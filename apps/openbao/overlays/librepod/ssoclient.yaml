# Declares the openbao OIDC client for UI/CLI SSO login. The
# casdoor-sso-controller reconciles this into a Casdoor Application
# (owner/name = admin/openbao) and writes clientId / clientSecret / issuer
# into Secret/openbao-sso in THIS namespace. The bootstrap Job mounts that
# Secret as files and configures OpenBao's OIDC auth method with it (see
# components/bootstrap/bootstrap.sh) — no OIDC secret is committed to git.
#
# ${BASE_DOMAIN} is expanded by Flux postBuild.substitute at deploy time (and
# by the dev-render step), so the CR that lands on-cluster carries concrete
# redirect URIs. They must match the role's allowed_redirect_uris EXACTLY —
# Casdoor matches redirect URIs by exact string.
apiVersion: marketplace.librepod.org/v1alpha1
kind: SSOClient
metadata:
  name: openbao-sso              # default output Secret name
  namespace: openbao
spec:
  clientId: openbao              # Casdoor app name (id=admin/openbao) AND OIDC client_id
  organization: librepod         # platform org (created at bootstrap); login users must live here
  redirectUris:
    # OpenBao UI login (the legacy /ui/vault/... path is what the UI generates)
    - "https://openbao.${BASE_DOMAIN}/ui/vault/auth/oidc/oidc/callback"
    # `bao login -method=oidc` CLI callback (loopback browser flow)
    - "http://localhost:8250/oidc/callback"
  grantTypes: [authorization_code, refresh_token]
  # JWT-Standard: spec-compliant OIDC claims only — openbao's OIDC consumer is
  # a strict go-oidc client, and plain JWT embeds the whole Casdoor user
  # object incl. password/salt. See docs/sso-app-author-guide.md "Token format".
  tokenFormat: JWT-Standard
  expireInHours: 168             # 7 days
  output:
    secretName: openbao-sso
    keys:
      # file names the bootstrap Job reads from the mounted Secret
      clientId: client_id
      clientSecret: client_secret
      issuer: issuer
  casdoorPolicy: retain          # keep the Casdoor app if this CR is deleted
