# OpenBao is API-first: the injector webhook, the bao CLI and in-cluster
# clients talk to :8200 directly with their own credentials, so no oauth2
# forward-auth middlewares here — OpenBao performs its own authentication
# (tokens and the Kubernetes auth method configured post-install).
#
# TLS-only on websecure, served by the cluster's shared default wildcard
# cert (Traefik default TLS store) — no dedicated Certificate: every machine
# client reaches openbao over in-cluster HTTP (openbao.openbao.svc:8200), so
# only the browser route needs TLS and it rides the wildcard like every other
# app. A tls: block makes the router TLS-only, so there is deliberately no
# plain-HTTP web entrypoint route.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openbao
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`openbao.${BASE_DOMAIN:=libre.pod}`)
    priority: 1
    services:
    - name: openbao
      port: 8200
  tls: {}
