apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
spec:
  chart:
    spec:
      chart: openbao
      # HTTP Helm repo: pin the chart minor here (the OCIRepository semver
      # range cannot be used for HelmRepository sources).
      version: "~0.30.0"
      sourceRef:
        kind: HelmRepository
        name: openbao-helm-charts
      interval: 12h
  values:
    # No image tag overrides — the chart's baked appVersion (v2.7.1) is the
    # app-version source of truth (see skill "Image versions").
    server:
      dataStorage:
        storageClass: nfs-client
      auditStorage:
        storageClass: nfs-client
