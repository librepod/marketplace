apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
spec:
  chart:
    spec:
      chart: openbao
      # HTTP Helm repo: pin the chart minor here (the OCIRepository semver
      # range cannot be used for HelmRepository sources).
      version: "~0.30.0"
      sourceRef:
        kind: HelmRepository
        name: openbao-helm-charts
      interval: 12h
  values:
    server:
      image:
        tag: "2.7.1"
      dataStorage:
        storageClass: nfs-client
      auditStorage:
        storageClass: nfs-client
