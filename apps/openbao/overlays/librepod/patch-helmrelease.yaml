apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
spec:
  chart:
    spec:
      chart: openbao
      # HTTP Helm repo: pin the chart EXACT version here (the OCIRepository
      # semver range cannot be used for HelmRepository sources, and a ~ range
      # would let chart patches bump appVersion — 0.30.0 bakes 2.7.0, 0.30.2
      # bakes 2.7.1 — silently past what metadata.yaml advertises). No renovate
      # manager covers this file: bump manually, moving spec.version and the
      # bootstrap Job newTag in the same change.
      version: "0.30.2"
      sourceRef:
        kind: HelmRepository
        name: openbao-helm-charts
      interval: 12h
  values:
    # No image tag overrides — the chart's baked appVersion (v2.7.1) is the
    # app-version source of truth (see skill "Image versions").
    server:
      dataStorage:
        storageClass: nfs-client
      auditStorage:
        storageClass: nfs-client
      # SSO (OIDC login via Casdoor): trust the private root CA for the
      # server-side calls to https://id.<BASE_DOMAIN> (discovery, token
      # exchange). Mounted directly with SSL_CERT_FILE pointing at it — no
      # bundle-merge init container, because the server's ONLY outbound TLS
      # is to the private IdP. If it ever verifies public endpoints, switch
      # to the merge pattern (docs/sso-app-author-guide.md §4).
      extraEnvironmentVars:
        SSL_CERT_FILE: /openbao/ca/root_ca.crt
      # HelmRelease values patches REPLACE lists (values is opaque to
      # strategic merge): the seal volume entries below are copies of
      # base/helmrelease.yaml — keep both sides in sync when editing either.
      volumes:
        - name: seal
          persistentVolumeClaim:
            claimName: openbao-seal
        - name: root-ca-cert
          configMap:
            name: step-certificates-certs
            items:
              - key: root_ca.crt
                path: root_ca.crt
      volumeMounts:
        - name: seal
          mountPath: /openbao/seal
        - name: root-ca-cert
          mountPath: /openbao/ca
          readOnly: true
