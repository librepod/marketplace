apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
spec:
  chart:
    spec:
      chart: openbao
      # HTTP Helm repo: pin the chart EXACT version here (the OCIRepository
      # semver range cannot be used for HelmRepository sources, and a ~ range
      # would let chart patches bump appVersion — 0.30.0 bakes 2.7.0, 0.30.2
      # bakes 2.7.1 — silently past what metadata.yaml advertises). No renovate
      # manager covers this file: bump manually, moving spec.version and the
      # bootstrap Job newTag in the same change.
      version: "0.30.2"
      sourceRef:
        kind: HelmRepository
        name: openbao-helm-charts
      interval: 12h
  values:
    # No image tag overrides — the chart's baked appVersion (v2.7.1) is the
    # app-version source of truth (see skill "Image versions").
    server:
      dataStorage:
        storageClass: nfs-client
      auditStorage:
        storageClass: nfs-client
      # NOTE: no CA wiring here. The server's TLS to https://id.<BASE_DOMAIN>
      # (discovery, token exchange, userinfo) is scoped to the OIDC auth
      # method via oidc_discovery_ca_pem, written by the bootstrap Job —
      # a server-wide SSL_CERT_FILE would shadow the system roots and break
      # any future outbound public-TLS (docs/sso-app-author-guide.md §4).
