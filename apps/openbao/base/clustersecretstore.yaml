# Service account used by the External Secrets Operator to log in to OpenBao
# via the Kubernetes auth method (role: external-secrets).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-eso
---
# Cluster-wide SecretStore so every namespace can pull secrets from the
# openbao KV v2 engine mounted at apps/.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      # KV v2: remoteRef keys are engine-relative (apps/myapp -> /v1/apps/data/myapp)
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: openbao-eso
            namespace: openbao
