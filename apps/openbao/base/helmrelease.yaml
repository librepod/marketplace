apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
spec:
  interval: 12h
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  chart:
    spec:
      chart: openbao
      sourceRef:
        kind: HelmRepository
        name: openbao-helm-charts
      interval: 12h
  values:
    # No image/agentImage tags anywhere: the pinned chart's baked appVersion
    # (v2.7.1 at chart 0.30.2) is the app-version source of truth for both
    # the server image and injected agent sidecars. spec.version in
    # metadata.yaml mirrors it — update both together when bumping the chart.
    # Vault Agent Injector webhook — lets workloads consume secrets as
    # injected sidecars without calling the API themselves.
    injector:
      enabled: true

    server:
      # annotate the pod with a config checksum so declarative config
      # changes (e.g. the audit stanza) roll the statefulset
      configAnnotation: true

      # Chart default is OnDelete: upgrades would never restart the server,
      # so any values change here only applies after a manual pod delete.
      # RollingUpdate is safe: the static seal auto-unseals and
      # single-replica delete-then-create releases the RWO seal PVC.
      updateStrategyType: RollingUpdate

      # Full server config: the static seal stanza is what makes OpenBao come
      # back unsealed after pod restarts / node reboots without manual unseal.
      # The key itself never appears here — only its file path on the seal PVC.
      standalone:
        config: |
          ui = true
          disable_mlock = true

          listener "tcp" {
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_disable = true
          }

          storage "pebbledb" {
            path = "/openbao/data/pebbledb"
          }

          seal "static" {
            current_key_id = "openbao-seal-v1"
            current_key    = "file:///openbao/seal/unseal.key"
          }

          # Declarative audit device (2.7+ rejects API-enabled audit devices);
          # enabled on restart/SIGHUP, logs land on the auditStorage PVC.
          audit "audit-log" {
            type = "file"
            path = "file/"
            options = {
              file_path = "/openbao/audit/audit.log"
            }
          }

      dataStorage:
        enabled: true
        size: 10Gi
        mountPath: /openbao/data

      auditStorage:
        enabled: true
        size: 10Gi
        mountPath: /openbao/audit

      # Provision the 32-byte static seal key once; idempotent across restarts.
      extraInitContainers:
        - name: seal-key-init
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              KEY=/openbao/seal/unseal.key
              if [ ! -s "$KEY" ]; then
                dd if=/dev/urandom of="$KEY.tmp" bs=32 count=1
                mv "$KEY.tmp" "$KEY"
              fi
              chmod 600 "$KEY"
          securityContext:
            runAsUser: 100
            runAsGroup: 1000
          volumeMounts:
            - name: seal
              mountPath: /openbao/seal

      volumes:
        - name: seal
          persistentVolumeClaim:
            claimName: openbao-seal

      volumeMounts:
        - name: seal
          mountPath: /openbao/seal

      # server.authDelegator is enabled by the chart: the server ServiceAccount
      # gets the system:auth-delegator ClusterRoleBinding, which lets the
      # Kubernetes auth method review client tokens without a static
      # token_reviewer_jwt.
