# Post-deploy bootstrap: initializes OpenBao on first boot (recovery keys +
# root token land in the openbao-credentials Secret) and configures the KV v2
# engine, Kubernetes auth, policies and roles. (The audit device is declared
# in the server configuration instead — see helmrelease.yaml.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-bootstrap
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openbao-credentials"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-bootstrap
subjects:
  - kind: ServiceAccount
    name: openbao-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-bootstrap
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: openbao-bootstrap
      containers:
        # Waits for the server, initializes it once and applies all
        # runtime configuration via the bao CLI.
        - name: bootstrap
          image: openbao/openbao   # tag pinned in the overlay
          env:
            - name: BAO_ADDR
              value: http://openbao.openbao.svc.cluster.local:8200
          command: ["/bin/sh", "/bootstrap/bootstrap.sh"]
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
            - name: shared
              mountPath: /shared
            # write access only to drop a stale credentials copy when the
            # data volume turns out to have been wiped (see bootstrap.sh)
            - name: seal
              mountPath: /seal
        # Persists the root token + recovery keys to the openbao-credentials
        # Secret on first init and mirrors them to the seal PVC, so a
        # reinstall that preserves the volumes restores the Secret (and thus
        # admin access) automatically; hands the root token to the bootstrap
        # container on re-runs.
        - name: store-credentials
          image: alpine/k8s:1.34.9
          # uid/gid 100/1000 match the server's seal-key-init writer; NFS
          # writes as non-root are proven, root may be squashed
          securityContext:
            runAsUser: 100
            runAsGroup: 1000
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: seal
              mountPath: /seal
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              SEAL_CREDS=/seal/credentials.json
              root_token() {
                sed -n 's/.*"root_token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$1"
              }

              if kubectl get secret openbao-credentials >/dev/null 2>&1; then
                kubectl get secret openbao-credentials -o jsonpath='{.data.root-token}' | base64 -d > /shared/root-token
                # keep the seal-volume copy current (back-fill after upgrades)
                if [ ! -s "$SEAL_CREDS" ]; then
                  kubectl get secret openbao-credentials -o jsonpath='{.data.recovery-keys}' | base64 -d > "$SEAL_CREDS"
                  chmod 600 "$SEAL_CREDS"
                fi
                exit 0
              fi

              if [ -s "$SEAL_CREDS" ]; then
                # reinstall with preserved data: restore the Secret from the
                # seal-volume copy — credentials survive namespace deletion
                ROOT_TOKEN=$(root_token "$SEAL_CREDS")
                kubectl create secret generic openbao-credentials \
                  --from-literal=root-token="$ROOT_TOKEN" \
                  --from-file=recovery-keys="$SEAL_CREDS"
                printf '%s' "$ROOT_TOKEN" > /shared/root-token
                exit 0
              fi

              touch /shared/no-secret
              until [ -f /shared/done ]; do
                sleep 2
              done
              if [ -f /shared/credentials.json ]; then
                ROOT_TOKEN=$(root_token /shared/credentials.json)
                kubectl create secret generic openbao-credentials \
                  --from-literal=root-token="$ROOT_TOKEN" \
                  --from-file=recovery-keys=/shared/credentials.json
                cp /shared/credentials.json "$SEAL_CREDS"
                chmod 600 "$SEAL_CREDS"
              fi
      volumes:
        - name: bootstrap
          configMap:
            name: openbao-bootstrap
        - name: shared
          emptyDir: {}
        # seal volume is RWO: the Job pod must schedule on the same node as
        # the server pod — always true on single-node clusters
        - name: seal
          persistentVolumeClaim:
            claimName: openbao-seal
