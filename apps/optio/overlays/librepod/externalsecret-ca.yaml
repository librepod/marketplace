# LibrePod root CA for the API's server-side HTTPS calls to the IdP
# (https://id.<BASE_DOMAIN> — discovery, token exchange, userinfo). Optio is
# Node/Fastify: NODE_EXTRA_CA_CERTS (base/optio.env) points at the
# mounted root_ca.crt, which Node APPENDS to its built-in roots — no
# init-container bundle merge needed. See docs/sso-app-author-guide.md §4.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: step-certificates-certs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: step-certificates-certs
    creationPolicy: Owner
  data:
    - secretKey: root_ca.crt
      remoteRef: { key: apps/step-ca, property: root_ca.crt }
