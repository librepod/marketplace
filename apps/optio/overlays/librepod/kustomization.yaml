apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: optio

resources:
- ../../base
- externalsecret-ca.yaml
- ssoclient.yaml
- ingressroute.yaml

# Version anchors for the whole app — move together with
# base/optio.env OPTIO_AGENT_IMAGE(_TAG) and metadata.yaml spec.version.
images:
- name: ghcr.io/jonwiggins/optio-api
  newTag: "0.18.2"
- name: ghcr.io/jonwiggins/optio-web
  newTag: "0.18.2"
- name: postgres
  newTag: "16"
- name: valkey/valkey
  newTag: 8.1-alpine

patches:
- path: ./patch-storage-class.yaml
  target:
    kind: PersistentVolumeClaim
- path: ./deployment-api-ca-patch.yaml
  target:
    kind: Deployment
    name: optio-api
