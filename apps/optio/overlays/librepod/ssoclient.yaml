# casdoor-sso-controller provisions the Casdoor OIDC Application (clientId
# "optio") and writes id/secret to Secret/optio-sso; deployment-api.yaml reads
# them via secretKeyRef. SSO_ISSUER is mapped but unused: Optio appends
# /.well-known/openid-configuration to a BARE issuer (OIDC_ISSUER_URL in
# base/optio.env), while the controller's issuer key is the full discovery URL.
apiVersion: marketplace.librepod.org/v1alpha1
kind: SSOClient
metadata:
  name: optio-sso
  namespace: optio
spec:
  clientId: optio
  organization: librepod
  redirectUris:
    - "https://optio.${BASE_DOMAIN}/api/auth/oidc/callback"
  grantTypes: [authorization_code, refresh_token]
  # JWT-Standard: spec-compliant OIDC claims, no Casdoor user-object leakage.
  # Optio's TS OIDC client is lenient, but standard claims are all it reads.
  tokenFormat: JWT-Standard
  expireInHours: 168
  output:
    secretName: optio-sso
    keys:
      clientId: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
      issuer: SSO_ISSUER
  casdoorPolicy: retain
