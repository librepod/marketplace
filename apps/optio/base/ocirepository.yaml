apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: optio-helm-charts
spec:
  interval: 24h
  url: oci://ghcr.io/jonwiggins/optio
  ref:
    # Vendor versions chart and app in lockstep: chart N.N.N ships app N.N.N
    # (the in-repo Chart.yaml lags at 0.1.0 — the published OCI tag is the real
    # one). Bump together with metadata.yaml spec.version and the three image
    # tag pins in helmrelease.yaml, in the same commit.
    tag: "0.18.2"
