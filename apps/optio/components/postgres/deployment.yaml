apiVersion: apps/v1
kind: Deployment
metadata:
  name: optio-postgres
  labels:
    app: postgres
spec:
  replicas: 1
  # NFS PVCs have no attach semantics: a RollingUpdate surge pod mounts the
  # same export while the old postmaster is still running, and postgres's
  # lockfile is unreliable over NFS — two writers on one PGDATA corrupt the
  # WAL (verified: "could not locate a valid checkpoint record" after a
  # mid-roll restart). Recreate terminates the old pod before starting the
  # new one, serializing access by construction.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Ensure the data volume is owned by uid/gid 999; some CSI drivers
        # don't reliably apply fsGroup to pre-existing directories, which
        # leaves postgres unable to write and fails startup.
        - name: init-data-perms
          image: busybox:1.36
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              # chown/chmod require these caps even when running as UID 0;
              # `drop: ALL` alone leaves root unable to change ownership.
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /var/lib/postgresql/data/pgdata
              chown -R 999:999 /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: postgres
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: optio-settings
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        # NFS rebound data dirs keep the password from the install that
        # created them (POSTGRES_PASSWORD only applies at initdb), so every
        # boot converges the stored password to the declared one. Works
        # because the official image's pg_hba.conf trusts loopback TCP and
        # containers in one pod share a network namespace (skill: Bundled
        # PostgreSQL; script is verbatim from it — each detail there fixed a
        # real bug, braceless $VAR included: Flux substitute rewrites ${VAR}).
        - name: converge-db-password
          image: postgres
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: postgres
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: optio-settings
                  key: DB_PASSWORD
          command: ["/bin/sh", "-c"]
          args:
            - |
              until psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c '\q' 2>/dev/null; do
                sleep 1
              done
              printf "ALTER USER %s PASSWORD :'pw';\n" "$POSTGRES_USER" | \
                psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                -v on_error_stop=1 -v pw="$POSTGRES_PASSWORD"
              while sleep 3600; do :; done
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: optio-postgres-data
