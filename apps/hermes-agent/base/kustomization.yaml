apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hermes-agent

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: hermes-agent

configMapGenerator:
- name: hermes-agent
  envs:
  - hermes-agent.env
- name: hermes-agent-launcher
  files:
  - entrypoint.sh
  # Shell script: Flux postBuild.substitute (strict envsubst) would hard-fail
  # on any literal ${VAR} in it — including in comments explaining this very
  # rule. The script is deliberately braceless; substitution has nothing to do
  # here. (Verified on dev: without this, the marketplace install dies at
  # post-build with 'variable not set (strict mode)'.)
  options:
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled

resources:
- namespace.yaml
- serviceaccount.yaml
- pvc.yaml
- service.yaml
- deployment.yaml
- externalsecret.yaml
