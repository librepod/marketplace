# Sentinel harness. The marketplace/Flux owns ONLY what is in this file set;
# the hermes-agent code itself lives on the data PVC and updates out-of-band
# via `hermes update` (cron check + /update in chat) — never via image bumps.
#
# - runtimeClassName kata: hardware-isolated micro-VM (RuntimeClass "kata" is
#   created by the kata-containers app). Root inside the VM is not host root.
# - runAsUser 0: the installer and `hermes update` manage distro packages
#   (libatomic etc.) as root; all writes that matter go to /opt/data anyway.
# - Recreate: single writer on the SQLite stores under /opt/data (NFS-backed
#   PVC has no attach semantics to serialize a RollingUpdate surge pod).
# - Image = vetted dependency toolkit only (see the overlay pin); the executed
#   code is always the PVC checkout, never the image's /opt/hermes copy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      runtimeClassName: kata
      # Make the pause container PID 1 of the pod sandbox: it reaps orphaned
      # children (MCP stdio subprocesses, git, ...) the gateway spawns. The
      # image's own tini is a shim into its s6 tree — unusable for this
      # root-owned PVC-checkout layout — so pod-level sharing does the job.
      shareProcessNamespace: true
      serviceAccountName: hermes-agent
      securityContext:
        runAsUser: 0
      containers:
        - name: hermes-agent
          image: nousresearch/hermes-agent
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/launcher/entrypoint.sh"]
          ports:
            - name: http
              containerPort: 9119   # hermes dashboard (web management UI)
          env:
            # client_id provisioned by casdoor-sso-controller (public PKCE
            # client, no secret — see overlays/librepod/ssoclient.yaml).
            # Non-optional on purpose: the pod waits for the Casdoor app.
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-sso
                  key: HERMES_DASHBOARD_OIDC_CLIENT_ID
          envFrom:
            - configMapRef:
                name: hermes-agent
            - secretRef:
                name: hermes-agent-settings   # LAST: settings override .env defaults
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: launcher
              mountPath: /launcher
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
        - name: launcher
          configMap:
            name: hermes-agent-launcher
            defaultMode: 0755
