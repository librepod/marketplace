# Syncs the LibrePod root CA into this namespace: the dashboard verifies the
# private-CA-signed IdP on its server-side OIDC calls (discovery, token
# exchange, JWKS). Standard shape — docs/sso-app-author-guide.md §4.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: step-certificates-certs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: step-certificates-certs
    creationPolicy: Owner
  data:
    - secretKey: root_ca.crt
      remoteRef: { key: apps/step-ca, property: root_ca.crt }
    - secretKey: intermediate_ca.crt
      remoteRef: { key: apps/step-ca, property: intermediate_ca.crt }
