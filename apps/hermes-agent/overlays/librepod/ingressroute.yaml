# No oauth2-proxy middlewares: the dashboard speaks OIDC natively against
# Casdoor (self-hosted provider — see SSOClient + HERMES_DASHBOARD_OIDC_* env).
# Binding 0.0.0.0 engages hermes's fail-closed auth gate, so unauthenticated
# traffic bounces to /login → Casdoor.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes-agent
  # The app is served at hermes.<BASE_DOMAIN>, not under its own name. The
  # marketplace computes the launch link from the app name unless a route
  # carries the launch annotation, so this route declares the host root: the
  # tile then follows its real Host rule instead of the old hermes-agent host.
  annotations:
    librepod.org/launch: "/"
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    match: Host(`hermes.${BASE_DOMAIN:=libre.pod}`)
    priority: 1
    services:
    - name: hermes-agent
      port: 80
