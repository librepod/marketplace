# Fuses the LibrePod root CA into the pod's system CA bundle so the dashboard's
# server-side OIDC calls (discovery, token exchange, JWKS) verify against the
# private-CA-signed IdP. SSL_CERT_FILE (base .env) points the Python stack at
# the merged file — it must be system CAs + root, never the root alone:
# httpx loads ONLY the file SSL_CERT_FILE names.
# docs/sso-app-author-guide.md §4
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
spec:
  template:
    spec:
      initContainers:
        - name: merge-ca-bundle
          image: alpine:3.19
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cat /etc/ssl/certs/ca-certificates.crt > /mnt/merged-ca/ca-certificates.crt
              echo "" >> /mnt/merged-ca/ca-certificates.crt
              echo "# LibrePod Root CA" >> /mnt/merged-ca/ca-certificates.crt
              cat /mnt/root-ca/root_ca.crt >> /mnt/merged-ca/ca-certificates.crt
          volumeMounts:
            - { name: root-ca-cert, mountPath: /mnt/root-ca, readOnly: true }
            - { name: merged-ca-bundle, mountPath: /mnt/merged-ca }
      containers:
        - name: hermes-agent
          volumeMounts:
            - name: merged-ca-bundle
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
      volumes:
        - name: root-ca-cert
          secret:
            secretName: step-certificates-certs
            items:
              - { key: root_ca.crt, path: root_ca.crt }
        - name: merged-ca-bundle
          emptyDir: {}
