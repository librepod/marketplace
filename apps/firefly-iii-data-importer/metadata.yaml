apiVersion: marketplace/v1
kind: AppDefinition
metadata:
  name: firefly-iii-data-importer
spec:
  displayName: "Firefly III Data Importer"
  description: "Companion app for Firefly III: import transactions from CSV files or bank APIs (GoCardless, Salt Edge, Nordigen). Requires a running Firefly III install and a Personal Access Token (create one in Firefly III under Profile → OAuth) — install and log into Firefly III first"
  icon: "https://raw.githubusercontent.com/firefly-iii/firefly-iii/main/.github/assets/img/logo-small.png"
  category: "Finance"
  website: "https://data-importer.firefly-iii.org/"

  # renovate: datasource=docker depName=fireflyiii/data-importer extractVersion=^version-(?<version>.+)$
  version: "2.3.5"   # tracks fireflyiii/data-importer; keep compatible with the pinned firefly-iii core

  source:
    type: oci-kustomize
    url: "oci://ghcr.io/librepod/marketplace/apps/firefly-iii-data-importer"
    path: ./overlays/librepod

  # The PAT is a required install question: the importer v2 web UI only offers
  # the OAuth client-ID flow, which 500s under LibrePod's header SSO (Passport's
  # authorize endpoint needs a stateful guard; remote_user_guard isn't one), so
  # the PAT must arrive via FIREFLY_III_ACCESS_TOKEN env — deliverable only at
  # install through settings. See firefly-iii app's AUTHENTICATION_GUARD.
  settings:
    items:
      - name: FIREFLY_III_ACCESS_TOKEN
        label: "Firefly III Personal Access Token"
        description: "Create it in Firefly III → Profile → OAuth → Personal Access Tokens → Create new token. Copy the long token (starts with eyJ...) and paste it here."
        required: true
        sensitive: true
  dependencies:
    required:
      - kind: IngressController
        description: "Traefik (provided by traefik app)"
      - kind: AuthProxy
        description: "oauth2-proxy (provided by oauth2-proxy app)"
      # Soft dependency on the firefly-iii app, deliberately NOT a dependsOn gate:
      # the marketplace has no app→app dependency mechanism, and hard-gating on
      # marketplace-firefly-iii would wedge this Kustomization in "installing"
      # forever on a cluster without it. The importer boots fine without core;
      # its UI surfaces the connection when the user actually runs an import.

  templates:
    source: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: marketplace-firefly-iii-data-importer
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "firefly-iii-data-importer"
      spec:
        interval: 10m
        url: oci://ghcr.io/librepod/marketplace/apps/firefly-iii-data-importer
        ref:
          tag: "__VERSION__"   # sentinel: catalog generation fills it from spec.version
    release: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: marketplace-firefly-iii-data-importer
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "firefly-iii-data-importer"
      spec:
        dependsOn:
          - name: traefik
          - name: oauth2-proxy
        force: true
        interval: 1h
        retryInterval: 2m
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: marketplace-firefly-iii-data-importer
        path: ./overlays/librepod
        prune: true
        wait: true
        postBuild:
          substitute:
            BASE_DOMAIN: "${BASE_DOMAIN}"
    kustomization: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - source.yaml
        - release.yaml
