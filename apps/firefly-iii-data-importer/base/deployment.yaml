apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-iii-data-importer
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: firefly-iii-data-importer
          image: fireflyiii/data-importer
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: firefly-iii-data-importer
