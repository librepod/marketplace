apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: firefly-iii-data-importer

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: firefly-iii-data-importer

configMapGenerator:
- name: firefly-iii-data-importer
  envs:
  - firefly-iii-data-importer.env

resources:
- namespace.yaml
- service.yaml
- deployment.yaml
- externalsecret.yaml
