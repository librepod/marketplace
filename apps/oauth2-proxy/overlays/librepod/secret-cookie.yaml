# oauth2-proxy session-cookie encryption key. This is NOT an OIDC client
# credential — it is the AES/HMAC key that signs and encrypts the
# _oauth2_proxy session cookie. Anyone with repo read can forge a session
# cookie; the mitigation is structural — the oauth2-proxy Service is
# ClusterIP-only, so only Traefik can reach /oauth2/auth, and the cookie-secret
# never leaves the cluster. Rotating invalidates all sessions.
#
# OPTIONAL Flux substitution (same ${VAR:=default} pattern as BASE_DOMAIN):
# unset, it defaults to the committed value below and works out-of-the-box.
# To use your own key, set OAUTH2_PROXY_COOKIE_SECRET in the cluster's Flux
# Kustomization (postBuild.substitute, or substituteFrom a Secret). The value
# MUST base64url-decode to 16/24/32 bytes (oauth2-proxy SecretBytes strips a
# trailing '=' then RawURLEncoding-decodes); generate one with:
#   openssl rand -base64 32 | tr -- '+/' '-_'
# NOTE: ${...} is expanded by Flux postBuild.substitute at deploy time. It stays
# literal in a plain `kustomize build`, and the :=default only fires when the
# substitute map is non-empty (production always sets BASE_DOMAIN, so it is).
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-cookie
type: Opaque
stringData:
  cookie-secret: "${OAUTH2_PROXY_COOKIE_SECRET:=EFwAz5bA1tu7E86CcNvlUV2LvdqP0yGc8fPIncek5C4=}"
