# oauth2-proxy session-cookie encryption key. This is NOT an OIDC client
# credential — it is the AES/HMAC key that signs and encrypts the
# _oauth2_proxy session cookie. It is generated once and committed so sessions
# survive restarts (GitOps-deterministic). Anyone with repo read can forge a
# session cookie; mitigate by keeping --trusted-proxy-ip set so only Traefik's
# source IPs are honored for forwarded headers. Rotate by regenerating and
# redeploying (invalidates all sessions).
#
# Generated with: openssl rand -base64 32 | tr -- '+/' '-_'  (32 bytes, AES-256).
# oauth2-proxy SecretBytes strips trailing '=' then base64url-decodes; 32 bytes is accepted.
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-cookie
type: Opaque
stringData:
  cookie-secret: "EFwAz5bA1tu7E86CcNvlUV2LvdqP0yGc8fPIncek5C4="
