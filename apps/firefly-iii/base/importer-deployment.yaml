apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-iii-importer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: importer
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: importer
    spec:
      containers:
        - name: firefly-iii-importer
          image: fireflyiii/data-importer
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: firefly-iii-importer
