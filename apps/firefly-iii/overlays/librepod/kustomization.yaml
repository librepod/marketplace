apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: firefly-iii

resources:
- ../../base
- ingressroute.yaml

# postgres/curl tags are bumped by hand — spec.version in metadata.yaml tracks
# only the core app version. The data importer lives in its own app
# (apps/firefly-iii-data-importer) with its own version pin.
images:
- name: fireflyiii/core
  newTag: version-6.7.9
- name: postgres
  newTag: 18.6-alpine3.24
- name: curlimages/curl
  newTag: 8.23.0

# Multi-doc patch files must not carry `target:` (kustomize refuses); each
# document matches its PVC by name.
patches:
- path: ./patch-storage-class.yaml
