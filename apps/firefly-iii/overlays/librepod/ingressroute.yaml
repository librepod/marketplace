# Both routes carry the oauth2-proxy middlewares: they authenticate (Casdoor)
# AND inject X-Auth-Request-Email, which firefly-iii's remote_user_guard reads.
# The headers are overwritten from the auth response, so they cannot be spoofed
# on requests that pass the middleware, and unauthenticated requests never
# reach the app.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: firefly-iii
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    match: Host(`firefly-iii.${BASE_DOMAIN:=libre.pod}`)
    priority: 1
    middlewares:
    - name: oauth2-errors
      namespace: oauth2-proxy
    - name: oauth2-forwardauth
      namespace: oauth2-proxy
    services:
    - name: firefly-iii
      port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: firefly-iii-importer
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    match: Host(`firefly-iii-importer.${BASE_DOMAIN:=libre.pod}`)
    priority: 1
    middlewares:
    - name: oauth2-errors
      namespace: oauth2-proxy
    - name: oauth2-forwardauth
      namespace: oauth2-proxy
    services:
    - name: firefly-iii-importer
      port: 80
