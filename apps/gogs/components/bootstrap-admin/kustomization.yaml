apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

namespace: gogs

# Patches to add the admin-bootstrap initContainer to the Gogs deployment.
patches:
  - path: deployment-patch.yaml

generatorOptions:
  disableNameSuffixHash: true

# Local source of truth for the flux-account credential (issue #253 option a:
# rotation stays a git commit; the repo treats it as a low-sensitivity machine
# credential — docs/DECISIONS_LOG.md row 7). Consumed in this namespace by the
# deployment's postStart hook and the bootstrap-ssh-key Job; the publish-auth
# component pushes it to openbao KV apps/user-apps-source, from where consumer
# namespaces (flux-system, marketplace-ui) sync it via ExternalSecret.
secretGenerator:
  - name: user-apps-source-auth
    envs:
      - secret.env
