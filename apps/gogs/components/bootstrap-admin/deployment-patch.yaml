apiVersion: apps/v1
kind: Deployment
metadata:
  name: gogs
  annotations:
    # The bootstrap-admin postStart hook uses shell ${VAR} expansion (e.g.
    # ${GOGS_USER}). Flux's postBuild.substitute (BASE_DOMAIN on the gogs
    # Kustomization) would otherwise blank any ${VAR} it doesn't recognize.
    # BASE_DOMAIN is consumed in app.ini + the IngressRoute, not this Deployment,
    # so disabling substitution here is safe. See docs/FLUX_WORKFLOW.md.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  template:
    spec:
      containers:
        - name: gogs
          # Inject the flux admin credentials so the postStart hook can create
          # the user. These are NOT gogs config keys (gogs uses GOGS__<section>__
          # <key>), so they don't affect gogs itself.
          env:
            - name: GOGS_USER
              valueFrom:
                secretKeyRef:
                  name: user-apps-source-auth
                  key: username
            - name: GOGS_PASS
              valueFrom:
                secretKeyRef:
                  name: user-apps-source-auth
                  key: password
          lifecycle:
            # Create the flux admin AFTER gogs has started. `gogs admin
            # create-user` needs the DB schema, which gogs only initializes when
            # the `web` server starts — running it in an initContainer (before
            # the main container) fails on a fresh DB and leaves NO user. The
            # postStart hook runs concurrently with the entrypoint, so it first
            # waits until the web server answers (schema initialized), then
            # creates the admin. Marker-guarded so it runs once and no-ops on an
            # already-provisioned install.
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # A postStart hook that exits non-zero KILLS the container
                    # (crashloop), so this script must never hard-fail a gogs
                    # that is actually serving. It is best-effort on every path
                    # EXCEPT the wait-timeout below (deliberate exit 1: gogs
                    # isn't serving anyone at that point, and the kill+restart
                    # is the only retry trigger that re-runs this hook). Hence
                    # no `set -e` and exit 0 on the create-user paths.
                    MARKER_FILE="/data/.bootstrap-admin-complete"

                    # Idempotency: once bootstrapped (or an existing install was
                    # adopted), never touch users again.
                    if [ -f "$MARKER_FILE" ]; then
                      echo "Admin bootstrap already completed (marker found), skipping."
                      exit 0
                    fi

                    # Wait until the gogs web server answers — the signal that the
                    # DB schema has been initialized and create-user can succeed.
                    # (INSTALL_LOCK=true skips the install wizard.) create-user in
                    # an initContainer (before this server starts) fails on a
                    # fresh DB and leaves NO user — that is why this runs here.
                    #
                    # Budget is 900s (450 × 2s): a fresh install runs SQLite
                    # migrations over the NFS PVC before the web server listens,
                    # observed >2 min on a slow volume (issue #367). The old 120s
                    # cap gave up mid-migration with exit 0 — the Deployment went
                    # Ready with NO flux user and nothing ever re-ran this hook,
                    # wedging gogs-bootstrap-ssh-key on 403 forever.
                    echo "Waiting for gogs web server to initialize the DB..."
                    i=0
                    until wget -qO- http://localhost:3000/ >/dev/null 2>&1; do
                      i=$((i + 1))
                      if [ "$i" -ge 450 ]; then
                        # Deliberately exit non-zero. A postStart failure makes
                        # the kubelet kill and restart the container, which is
                        # the ONLY retry trigger for this hook (a plain give-up
                        # is permanent — issue #367). Safe here because a
                        # timeout means the web server never answered, so gogs
                        # is serving no one; completed DB migrations resume via
                        # the xorm version table, so every restart makes forward
                        # progress. The restart backoff paces the retries and
                        # FailedPostStartHook events make the state visible.
                        echo "ERROR: gogs web not reachable after 900s; exiting 1 so the container restart re-runs the admin bootstrap." >&2
                        exit 1
                      fi
                      sleep 2
                    done

                    # Create the flux admin. On an already-provisioned cluster
                    # (old zip-restored, or a prior run whose marker was lost)
                    # create-user errors because the user exists — swallow it. Set
                    # the marker only on a genuine success so a transient failure
                    # is retried on the next container start rather than being
                    # permanently masked by the marker.
                    echo "Ensuring Gogs admin user '${GOGS_USER}'..."
                    cd /app/gogs
                    # `gogs admin` refuses to run when the current user differs
                    # from app.ini's RUN_USER (git): it FATALs with "user
                    # configured to run Gogs is 'git', but the current user is
                    # 'root'". Since the 0.14.x crashloop fix starts this
                    # container as ROOT (the s6 entrypoint su-execs to git
                    # itself), create-user must be dropped to git the same way
                    # the entrypoint does — via s6-setuidgid (shipped in the
                    # image). Without this the admin is NEVER created on a fresh
                    # cluster and marketplace-ui installs 500 forever.
                    if s6-setuidgid git ./gogs admin create-user \
                      --name "$GOGS_USER" \
                      --password "$GOGS_PASS" \
                      --email "flux@libre.pod" \
                      --admin \
                      --config /data/gogs/conf/app.ini; then
                      touch "$MARKER_FILE"
                      echo "Admin created; bootstrap complete."
                    else
                      # Non-zero here means either "user already exists" (adopted
                      # install — safe, mark complete) or a real transient error.
                      # Probe the API to tell them apart: if flux can authenticate,
                      # the user exists and we mark complete; otherwise leave the
                      # marker unset so the next start retries.
                      if wget -qO- --header="Authorization: Basic $(printf '%s:%s' "$GOGS_USER" "$GOGS_PASS" | base64 | tr -d '\n')" \
                          "http://localhost:3000/api/v1/users/${GOGS_USER}/tokens" >/dev/null 2>&1; then
                        touch "$MARKER_FILE"
                        echo "Admin already exists and authenticates; bootstrap complete."
                      else
                        echo "WARN: create-user failed and flux does not authenticate; leaving marker unset to retry next start." >&2
                      fi
                    fi
