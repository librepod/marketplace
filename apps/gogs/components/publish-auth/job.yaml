# Publishes Secret/user-apps-source-auth (generated by the bootstrap-admin
# component from the committed secret.env) into openbao KV apps/user-apps-source
# for ExternalSecret distribution to consumer namespaces. ttlSecondsAfterFinished
# GCs the pod, and every Flux reconcile of the gogs Kustomization (interval 10m)
# recreates the Job — that recreate loop is the retry cadence for the warn+skip
# runs (see job.sh). Never fails the Kustomization: the script exits 0 on every
# path, because gogs gates the user-apps chain and must not block on openbao.
apiVersion: batch/v1
kind: Job
metadata:
  name: gogs-publish-source-auth
  annotations:
    # Bump on job.sh changes: the Job spec is immutable, so this is what makes
    # the apply recreate it (gogs Kustomization force: true) and re-run.
    gogs.librepod/publish-version: "1"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  # Normally finishes in seconds (one login+put); the in-script retry loop is
  # sized to stay under the gogs Kustomization's 5m health-check timeout
  # (wait: true) — do not lengthen one without the other.
  activeDeadlineSeconds: 300
  template:
    metadata:
      name: gogs-publish-source-auth
    spec:
      restartPolicy: Never
      serviceAccountName: gogs-publish-source-auth
      containers:
        - name: publish
          # Structural exception (librepod-app skill "Image versions",
          # cross-renderer category): this Job needs the bao CLI, and the only
          # in-repo image shipping it is the server's own. Keep this tag in
          # sync with the openbao app pin (apps/openbao/overlays/librepod/
          # kustomization.yaml images[].newTag) — move both together.
          image: openbao/openbao:2.7.1
          imagePullPolicy: IfNotPresent
          env:
            - name: BAO_ADDR
              value: http://openbao.openbao.svc.cluster.local:8200
            # Bound so a blackholed connection cannot outlive the retry budget
            - name: BAO_CLIENT_TIMEOUT
              value: 5s
          envFrom:
            - secretRef:
                name: user-apps-source-auth
          command: ["/bin/sh", "/scripts/publish-source-auth.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: cm-gogs-publish-source-auth
