apiVersion: apps/v1
kind: Deployment
metadata:
  name: gogs
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # On a genuinely empty volume (real bare-metal first-boot), the app.ini
        # subPath mount at /data/gogs/conf/app.ini makes the kubelet pre-create
        # the parents /data/gogs and /data/gogs/conf as root:root before the
        # entrypoint runs. The image's start.sh only chowns /data when the
        # top-level /data isn't already git-owned; the nfs-subdir provisioner
        # (reclaim Retain) leaves /data git-owned, so that guard is false and the
        # recursive chown is skipped — /data/gogs stays root:root. gogs then runs
        # as git and cannot `mkdir /data/gogs/log` → FATAL, crashlooping before it
        # ever creates the DB. Deterministically chown /data/gogs as root here so
        # the main container's first boot succeeds regardless of the image guard.
        - name: fix-data-ownership
          image: gogs/gogs
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # chown by name — the git user (uid 1000, gid 102) exists in this
              # image. Pre-create the subfolders the entrypoint needs so the
              # /app/gogs/log -> /data/gogs/log symlink resolves once gogs starts.
              mkdir -p /data/gogs/log /data/gogs/data
              chown -R git:git /data/gogs
          securityContext:
            # Must run as root to chown the root-owned subPath parents.
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: gogs
          image: gogs/gogs
          imagePullPolicy: IfNotPresent
          # The gogs/gogs 0.14.x image uses an s6-supervised, root-based
          # entrypoint: it chowns /data, launches s6-svscan (which writes locks
          # under the root-owned /app/gogs/docker/s6), and su-execs to the git
          # user itself. A hardened non-root securityContext (runAsUser 1000 /
          # drop ALL) prevents all of that and crashloops the container with
          # "s6-svscan: fatal: unable to open .s6-svscan/lock: Permission
          # denied". So the container starts as root and the image drops privs.
          # fsGroup on the pod (below) still governs volume group ownership.
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: ssh
              containerPort: 2222
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /data/gogs/conf/app.ini
              subPath: app.ini
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 0
            failureThreshold: 30
            timeoutSeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gogs-data
        - name: config
          configMap:
            name: gogs
