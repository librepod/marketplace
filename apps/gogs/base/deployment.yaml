apiVersion: apps/v1
kind: Deployment
metadata:
  name: gogs
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: gogs
          image: gogs/gogs
          imagePullPolicy: IfNotPresent
          # The gogs/gogs 0.14.x image uses an s6-supervised, root-based
          # entrypoint: it chowns /data, launches s6-svscan (which writes locks
          # under the root-owned /app/gogs/docker/s6), and su-execs to the git
          # user itself. A hardened non-root securityContext (runAsUser 1000 /
          # drop ALL) prevents all of that and crashloops the container with
          # "s6-svscan: fatal: unable to open .s6-svscan/lock: Permission
          # denied". So the container starts as root and the image drops privs.
          # fsGroup on the pod (below) still governs volume group ownership.
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: ssh
              containerPort: 2222
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /data/gogs/conf/app.ini
              subPath: app.ini
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 0
            failureThreshold: 30
            timeoutSeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gogs-data
        - name: config
          configMap:
            name: gogs
