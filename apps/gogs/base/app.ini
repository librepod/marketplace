[server]
DOMAIN = gogs.${BASE_DOMAIN:=libre.pod}
HTTP_PORT = 3000
EXTERNAL_URL = http://gogs.${BASE_DOMAIN:=libre.pod}/
DISABLE_SSH = false
START_SSH_SERVER = true
; Port shown in clone URLs — SSH enters via the traefik `ssh` entryPoint
; (host port 2222), see overlays/librepod/ingressroute-tcp.yaml. Real port 22
; on the host is the node's own sshd.
SSH_PORT = 2222
SSH_LISTEN_PORT = 2222

[database]
TYPE = sqlite3
PATH = /data/gogs.db

; TYPE = postgres
; HOST = gogs-postgres:5432
; NAME = gogs
; USER = gogs
; PASSWORD = gogs

[repository]
ROOT = /data/git/gogs-repositories

[security]
INSTALL_LOCK = true

[auth]
REQUIRE_SIGNIN_VIEW = true
ENABLE_REVERSE_PROXY_AUTHENTICATION = true
REVERSE_PROXY_AUTHENTICATION_HEADER = X-Auth-Request-Email
ENABLE_REVERSE_PROXY_AUTO_REGISTRATION = true
; The auth header is only honored when the request comes from these CIDRs.
; Default is loopback-only, but Traefik reaches Gogs from the pod CIDR, so
; without this SSO silently degrades to the local login page.
TRUSTED_PROXY_IPS = 10.42.0.0/16
