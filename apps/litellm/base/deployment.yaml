apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: litellm
          image: litellm/litellm
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/app/config.yaml"
          envFrom:
            - configMapRef:
                name: litellm-env
            # Settings Secret synced by ESO from OpenBao (externalsecret.yaml):
            # non-optional — the pod waits (CreateContainerConfigError) until it
            # exists. LAST in envFrom so its values override the .env defaults.
            # Supplies LITELLM_SALT_KEY (name matches) and DB_PASSWORD, which the
            # DATABASE_URL env below expands via kubelet $(VAR) substitution.
            - secretRef:
                name: litellm-settings
          env:
            - name: DATABASE_URL
              value: postgresql://llmproxy:$(DB_PASSWORD)@postgres:5432/litellm
            - name: GENERIC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: litellm-sso
                  key: GENERIC_CLIENT_ID
            - name: GENERIC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litellm-sso
                  key: GENERIC_CLIENT_SECRET
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 4000
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
          startupProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            failureThreshold: 30
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: data
              mountPath: /root/.config
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: data
          persistentVolumeClaim:
            claimName: litellm-data
