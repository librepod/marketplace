apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

namespace: litellm

# No `labels:` transformer here on purpose. A Component's transformers merge into
# the overlay root and would stamp app.kubernetes.io/name=litellm onto the postgres
# pod — leaking it into the litellm Service selector (which matches on that label).
# Labels are hardcoded on the postgres Deployment/Service as component=postgres.
# See memory: kustomize-component-transformer-scope.

configMapGenerator:
- name: postgres-config
  envs:
  - postgres.env

resources:
- deployment.yaml
- service.yaml
- pvc.yaml
