apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
- ../../components/postgres

resources:
- ../../base
- ingressroute.yaml
- ssoclient.yaml
- externalsecret-ca.yaml

namespace: litellm

images:
- name: litellm/litellm
  newTag: v1.95.0
- name: postgres
  newTag: 16-alpine


patches:
- path: patch-storage.yaml
  target:
    kind: PersistentVolumeClaim
# Inject the LibrePod root+intermediate CA trust (init container + volumes)
# into the Deployment. Separate from base so every SSO app carries CA trust the
# same way (see deployment-ca-patch.yaml).
- path: deployment-ca-patch.yaml
