apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
- ../../components/postgres

resources:
- ../../base
- ingressroute.yaml
- ssoclient.yaml

configMapGenerator:
# Self-service the LibrePod private CA into this namespace. Reflector pulls
# root_ca.crt + intermediate_ca.crt from the source (step-ca/step-certificates-certs,
# which carries reflection-allowed: "true") into this stub. Mirrors open-webui.
# disableNameSuffixHash keeps the name stable so the Deployment volume mount matches.
- name: step-certificates-certs
  options:
    disableNameSuffixHash: true
    annotations:
      reflector.v1.k8s.emberstack.com/reflects: "step-ca/step-certificates-certs"

namespace: litellm

images:
- name: litellm/litellm
  newTag: v1.95.0
- name: postgres
  newTag: 16-alpine


patches:
- path: patch-storage.yaml
  target:
    kind: PersistentVolumeClaim
# Inject the LibrePod root+intermediate CA trust (init container + volumes)
# into the Deployment. Separate from base so every SSO app carries CA trust the
# same way (see deployment-ca-patch.yaml).
- path: deployment-ca-patch.yaml
