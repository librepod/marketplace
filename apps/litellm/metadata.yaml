apiVersion: marketplace/v1
kind: AppDefinition
metadata:
  name: litellm
spec:
  displayName: "LiteLLM"
  description: "Open-source API gateway for 100+ LLM providers"
  icon: "https://raw.githubusercontent.com/BerriAI/litellm/main/images/litellm_logo.png"
  category: "AI"
  website: "https://github.com/BerriAI/litellm"

  version: "v1.93.0"

  source:
    type: oci-kustomize
    url: "oci://ghcr.io/librepod/marketplace/apps/litellm"
    path: ./overlays/librepod

  params:
    required:
      - name: BASE_DOMAIN
        description: "Base domain (app will be at litellm.BASE_DOMAIN)"
        type: string
        example: "example.com"
  secrets:
    - name: LITELLM_SALT_KEY
      description: "Salt key LiteLLM uses to encrypt credentials stored in its DB (e.g. provider API keys). Generated once per install."
      required: true
      generate:
        type: random
        length: 64
    - name: DB_PASSWORD
      description: "PostgreSQL password (A-Za-z0-9 only — no special chars, since it is URL-embedded in DATABASE_URL). Shared by the bundled postgres and litellm."
      required: true
      generate:
        type: random
        length: 40

  dependencies:
    required:
      - kind: IngressController
        description: "Traefik (provided by bootstrap)"
      - kind: StorageClass
        description: "nfs-client (provided by bootstrap)"
      - kind: SSOProvider
        description: "Casdoor SSO (provided by casdoor-sso-controller)"

  templates:
    source: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: marketplace-litellm
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "litellm"
      spec:
        interval: 10m
        url: oci://ghcr.io/librepod/marketplace/apps/litellm
        ref:
          tag: "v1.93.0"
    release: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: marketplace-litellm
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "litellm"
      spec:
        dependsOn:
          - name: casdoor-sso
        interval: 10m
        targetNamespace: litellm
        sourceRef:
          kind: OCIRepository
          name: marketplace-litellm
        path: ./overlays/librepod
        prune: true
        wait: true
        postBuild:
          substitute:
            BASE_DOMAIN: "${BASE_DOMAIN}"
          substituteFrom:
            - kind: Secret
              name: litellm-config
    secret: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: litellm-config
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "litellm"
      type: Opaque
      stringData:
        LITELLM_SALT_KEY: "${LITELLM_SALT_KEY}"
        DB_PASSWORD: "${DB_PASSWORD}"
    kustomization: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - source.yaml
        - release.yaml
        - secret.yaml
