apiVersion: marketplace/v1
kind: AppDefinition
metadata:
  name: litellm
spec:
  displayName: "LiteLLM"
  description: "Open-source API gateway for 100+ LLM providers"
  icon: "https://raw.githubusercontent.com/BerriAI/litellm/main/images/litellm_logo.png"
  category: "AI"
  website: "https://github.com/BerriAI/litellm"

  # renovate: datasource=docker depName=litellm/litellm
  # serge: notesRepo=BerriAI/litellm
  version: "v1.95.0"

  source:
    type: oci-kustomize
    url: "oci://ghcr.io/librepod/marketplace/apps/litellm"
    path: ./overlays/librepod

  # Closed settings (no allowCustom): litellm's config is file/salt-driven and
  # env override semantics are unclear — only the two machine secrets flow here.
  # Both are generate-only (never shown in the install dialog); on reinstall the
  # stored values are reused, so DB credentials keep working against the
  # NFS-surviving postgres data.
  settings:
    items:
      - name: LITELLM_SALT_KEY
        label: "Salt key"
        description: "Salt key LiteLLM uses to encrypt credentials stored in its DB (e.g. provider API keys). Generated once per install."
        sensitive: true
        generate:
          length: 64
      - name: DB_PASSWORD
        label: "Database password"
        description: "PostgreSQL password (A-Za-z0-9 only — no special chars, since it is URL-embedded in DATABASE_URL). Shared by the bundled postgres and litellm."
        sensitive: true
        generate:
          length: 40

  dependencies:
    required:
      - kind: IngressController
        description: "Traefik (provided by bootstrap)"
      - kind: StorageClass
        description: "nfs-client (provided by bootstrap)"
      - kind: SSOProvider
        description: "Casdoor SSO (provided by casdoor-sso-controller)"

  templates:
    source: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: marketplace-litellm
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "litellm"
      spec:
        interval: 10m
        url: oci://ghcr.io/librepod/marketplace/apps/litellm
        ref:
          tag: "__VERSION__"
    release: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: marketplace-litellm
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "litellm"
      spec:
        dependsOn:
          - name: casdoor-sso-controller
        interval: 10m
        targetNamespace: litellm
        sourceRef:
          kind: OCIRepository
          name: marketplace-litellm
        path: ./overlays/librepod
        prune: true
        wait: true
        postBuild:
          substitute:
            BASE_DOMAIN: "${BASE_DOMAIN}"
    kustomization: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - source.yaml
        - release.yaml
