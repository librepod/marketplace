apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  values:
    # immich app version. The chart deliberately does not bump image.tag with
    # every Immich release, so it must be set explicitly. Defined at the shared
    # top-level controllers so it applies to every component (server; ML is off).
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.0.3

    immich:
      persistence:
        library:
          # Pre-created in base/pvc.yaml — the chart refuses to create the
          # library volume itself.
          existingClaim: immich-library

    # Redis: enable the chart's bundled Valkey subchart. REDIS_HOSTNAME is wired
    # to it automatically by the chart (templates to "immich-valkey").
    valkey:
      enabled: true

    # Machine learning: enabled with a persistent model cache so the multi-GB
    # models survive restarts. The chart wires IMMICH_MACHINE_LEARNING_URL so the
    # server reaches the ML service automatically.
    machine-learning:
      enabled: true
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: immich-ml-cache

    server:
      controllers:
        main:
          # Init container merges the LibrePod root + intermediate CA into the
          # alpine system bundle. Without this, immich-server (Node.js) cannot
          # verify the *.libre.pod cert — it is issued by the internal
          # StepClusterIssuer, not a public CA — so its OIDC HTTPS calls to
          # https://id.libre.pod fail with "unable to get local issuer
          # certificate". Adapted to the immich chart's bjw-s common v5 schema.
          initContainers:
            merge-ca-bundle:
              image:
                repository: alpine
                tag: "3.19"
                pullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  cat /etc/ssl/certs/ca-certificates.crt > /mnt/merged-ca/ca-certificates.crt
                  echo "" >> /mnt/merged-ca/ca-certificates.crt
                  echo "# LibrePod Root CA" >> /mnt/merged-ca/ca-certificates.crt
                  cat /mnt/root-ca/root_ca.crt >> /mnt/merged-ca/ca-certificates.crt
                  echo "" >> /mnt/merged-ca/ca-certificates.crt
                  echo "# LibrePod Intermediate CA" >> /mnt/merged-ca/ca-certificates.crt
                  cat /mnt/root-ca/intermediate_ca.crt >> /mnt/merged-ca/ca-certificates.crt
          containers:
            main:
              # DB_* connection vars come from the immich-env ConfigMap.
              envFrom:
                - configMapRef:
                    name: immich-env
              env:
                # Trust the merged CA bundle (system + LibrePod CAs) for the
                # OIDC HTTPS calls. SSL_CERT_FILE covers OpenSSL-based tooling;
                # NODE_EXTRA_CA_CERTS covers Node's tls/fetch (immich is Node).
                SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
                NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
      persistence:
        # LibrePod CA bundle (root + intermediate), mirrored from step-ca by
        # Reflector (see kustomization.yaml). Mounted into the init container.
        root-ca-cert:
          type: configMap
          name: step-certificates-certs
          advancedMounts:
            main:
              merge-ca-bundle:
                - path: /mnt/root-ca
                  readOnly: true
        # EmptyDir where the init container writes the merged system+LibrePod
        # bundle; the main container reads it (subPath) as its CA trust file.
        merged-ca-bundle:
          type: emptyDir
          advancedMounts:
            main:
              merge-ca-bundle:
                - path: /mnt/merged-ca
              main:
                - path: /etc/ssl/certs/ca-certificates.crt
                  subPath: ca-certificates.crt
                  readOnly: true
