apiVersion: marketplace/v1
kind: AppDefinition
metadata:
  name: happy-server
spec:
  displayName: "Happy Server"
  description: "Self-hosted Obsidian web interface"
  icon: "https://raw.githubusercontent.com/denysvitali/happy-server/main/web/public/logo192.png"
  category: "Productivity"
  website: "https://github.com/denysvitali/happy-server"

  # NOTE: rolling tag, not pinned — Renovate cannot track it. Pin to a
  # concrete released tag first, then add a renovate annotation for
  # image ghcr.io/denysvitali/happy-server (datasource docker).
  version: "latest"

  source:
    type: oci-kustomize
    url: "oci://ghcr.io/librepod/marketplace/apps/happy-server"
    path: ./overlays/librepod

  dependencies:
    required:
      - kind: IngressController
        description: "Traefik (provided by bootstrap)"
      - kind: StorageClass
        description: "nfs-client (provided by bootstrap)"

  templates:
    source: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: marketplace-happy-server
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "happy-server"
      spec:
        interval: 10m
        url: oci://ghcr.io/librepod/marketplace/apps/happy-server
        ref:
          tag: "__VERSION__"
    release: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: marketplace-happy-server
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "happy-server"
      spec:
        interval: 10m
        targetNamespace: happy-server
        sourceRef:
          kind: OCIRepository
          name: marketplace-happy-server
        path: ./overlays/librepod
        prune: true
        wait: true
        postBuild:
          substitute:
            BASE_DOMAIN: "${BASE_DOMAIN}"
    kustomization: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - source.yaml
        - release.yaml
