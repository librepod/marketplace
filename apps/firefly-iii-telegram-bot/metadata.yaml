apiVersion: marketplace/v1
kind: AppDefinition
metadata:
  name: firefly-iii-telegram-bot
spec:
  displayName: "Firefly III Telegram Bot"
  description: "Telegram bot for the Firefly III finance manager: create transactions and browse accounts, categories and reports straight from chat"
  icon: "https://github.com/cyxou.png"
  category: "Finance"
  website: "https://github.com/cyxou/firefly-iii-telegram-bot"

  # renovate: datasource=docker depName=ghcr.io/cyxou/firefly-iii-telegram-bot extractVersion=^v(?<version>.+)$
  version: "3.0.0"

  source:
    type: oci-kustomize
    url: "oci://ghcr.io/librepod/marketplace/apps/firefly-iii-telegram-bot"
    path: ./overlays/librepod

  settings:
    allowCustom: true
    items:
      - name: BOT_TOKEN
        label: "Telegram Bot Token"
        description: "Token issued by @BotFather for your bot"
        type: string
        required: true
        sensitive: true
      - name: ALLOWED_TG_USER_IDS
        label: "Allowed Telegram user IDs"
        description: "Comma-separated Telegram user IDs that may use the bot (e.g. 123456,987654). Leave empty to allow anyone"
        type: string
        required: false
        sensitive: false
      - name: FIREFLY_URL
        label: "Firefly III URL"
        description: "Public URL of your Firefly III instance (e.g. https://firefly-iii.example.com). Leave empty to use the Firefly III app installed on this device"
        type: string
        required: false
        sensitive: false
      - name: FIREFLY_ACCESS_TOKEN
        label: "Firefly III access token"
        description: "Personal access token (Firefly III → Options → OAuth → Personal Access Tokens). Pre-configures the bot for every user; users can still save their own via /settings in Telegram"
        type: string
        required: false
        sensitive: true
      - name: REDIS_PASSWORD
        sensitive: true
        generate:
          length: 32

  components:
    - name: gluetun
    - name: sing-box

  templates:
    source: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: marketplace-firefly-iii-telegram-bot
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "firefly-iii-telegram-bot"
      spec:
        interval: 10m
        url: oci://ghcr.io/librepod/marketplace/apps/firefly-iii-telegram-bot
        ref:
          # __VERSION__ is the generate-catalog.sh sentinel — replaced by
          # spec.version when catalog.yaml is built. A literal tag here would
          # pin the catalog to that version even after a version bump.
          tag: "__VERSION__"
    release: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: marketplace-firefly-iii-telegram-bot
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "firefly-iii-telegram-bot"
      spec:
        force: true
        interval: 1h
        retryInterval: 2m
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: marketplace-firefly-iii-telegram-bot
        path: ./overlays/librepod
        prune: true
        wait: true
        postBuild:
          substitute:
            BASE_DOMAIN: "${BASE_DOMAIN}"
    kustomization: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - source.yaml
        - release.yaml
