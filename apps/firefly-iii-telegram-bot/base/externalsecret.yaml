apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firefly-iii-telegram-bot-settings
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: firefly-iii-telegram-bot-settings
  dataFrom:
    - extract:
        key: apps/firefly-iii-telegram-bot
