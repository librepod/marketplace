apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: firefly-iii-telegram-bot

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: firefly-iii-telegram-bot

configMapGenerator:
- name: firefly-iii-telegram-bot
  envs:
  - firefly-iii-telegram-bot.env

resources:
- namespace.yaml
- pvc.yaml
- deployment.yaml
- externalsecret.yaml
