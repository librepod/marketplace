apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-iii-telegram-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: firefly-iii-telegram-bot
          image: ghcr.io/cyxou/firefly-iii-telegram-bot
          imagePullPolicy: IfNotPresent
          env:
            # REDIS_URL embeds the generated valkey password, so it cannot live
            # in the .env ConfigMap — envFrom values get no $(VAR) expansion.
            # Explicit secretKeyRef first, $(VAR) reference next; kubelet
            # expands env entries defined earlier in the same list.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firefly-iii-telegram-bot-settings
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@valkey:6379
          envFrom:
            - configMapRef:
                name: firefly-iii-telegram-bot
            - secretRef:
                name: firefly-iii-telegram-bot-settings
