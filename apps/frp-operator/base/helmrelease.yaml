apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frp-operator
spec:
  interval: 12h
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  # No frpc pin: the operator hardcodes fatedier/frpc (v0.71.1 at v0.15.0),
  # no chart override — relays' frps must match or UDP relay silently breaks.
  chart:
    spec:
      chart: frp-operator
      # Exact pin — chart patch releases can change the baked appVersion.
      # No lockstep with the app version (chart 1.13.0 ships app 0.15.0), so
      # spec.version in metadata.yaml is hand-coupled to this pin: move both
      # in the same change.
      version: "1.13.0"
      sourceRef:
        kind: HelmRepository
        name: frp-operator-charts
