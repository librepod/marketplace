apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frp-operator
spec:
  interval: 12h
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  # The fork chart is an OCI artifact, so reference the OCIRepository via
  # chartRef. spec.chart.spec.sourceRef only accepts HelmRepository/
  # GitRepository/Bucket (per the HelmRelease CRD enum) — NOT OCIRepository — so
  # chartRef is the only way to consume an OCIRepository-sourced chart. The
  # chart version is pinned in the OCIRepository's ref.semver (~1.7.0).
  chartRef:
    kind: OCIRepository
    name: frp-operator-charts
  values:
    operator:
      replica: 1
