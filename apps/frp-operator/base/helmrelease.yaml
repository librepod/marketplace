apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frp-operator
spec:
  interval: 12h
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  chart:
    spec:
      chart: frp-operator
      # Exact pin — chart patch releases can change the baked appVersion.
      # No lockstep with the app version (chart 1.13.0 ships app 0.15.0), so
      # spec.version in metadata.yaml is hand-coupled to this pin: move both
      # in the same change.
      version: "1.13.0"
      sourceRef:
        kind: HelmRepository
        name: frp-operator-charts
      interval: 12h
  values:
    # The frpc version is owned by the operator, not this chart: upstream
    # v0.15.0 hardcodes fatedier/frpc:v0.71.1 (controllers/client_controller.go)
    # and exposes NO override — the fork's spec.podTemplate.image /
    # frpc.defaultImage do not exist upstream. Relay servers must run a
    # matching frps — frpc/frps version skew can silently break UDP relay,
    # and the WireGuard remote-access path rides a UDP upstream.
    operator:
      replica: 1
