# LibrePod fork chart: https://github.com/librepod/frp-operator
# Adds the HTTPS Upstream `subdomain` field (upstream PR #17) so frps can build
# the full domain from its `subDomainHost` config, and makes `customDomains`
# optional. Also adds the configurable frpc image (--frpc-default-image /
# spec.podTemplate.image).
#
# 1.7.0 (appVersion 0.9.0) is the first release with the configurable frpc
# image. Older tags (e.g. 0.0.0-pr.3) omit --frpc-default-image and fail every
# Client with ImageUnresolved — so we pin 1.7.0 explicitly.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: frp-operator-charts
spec:
  interval: 24h
  url: oci://ghcr.io/librepod/charts/frp-operator
  ref:
    # Pinned chart tag; Renovate opens a PR to move it (no auto-merge).
    tag: "1.7.0"
