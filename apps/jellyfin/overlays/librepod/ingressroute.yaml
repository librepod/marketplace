apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    match: Host(`jellyfin.${BASE_DOMAIN:=libre.pod}`)
    priority: 1
    # Deliberate exception — no SSO forward-auth in front of this app:
    # Jellyfin is consumed by rich non-browser clients (TV apps, mobile,
    # Kodi) that cannot complete an auth-proxy redirect, and the app has
    # native user management plus a first-run wizard that creates the
    # admin in-band. Future OIDC path, not deploy-time wiring: the
    # community jellyfin-plugin-sso, configured post-install under /config.
    services:
    - name: jellyfin
      port: 80
