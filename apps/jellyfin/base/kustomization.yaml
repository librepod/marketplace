apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jellyfin

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: jellyfin

configMapGenerator:
- name: jellyfin
  envs:
  - jellyfin.env

resources:
- namespace.yaml
- pvc.yaml
- service.yaml
- externalsecret.yaml
- deployment.yaml
