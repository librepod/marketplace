# Pulls this app's install settings from OpenBao. Written by marketplace-ui at
# install time (custom variables only — jellyfin declares no settings items);
# synced here by ESO.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-settings
  namespace: jellyfin
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: jellyfin-settings
  dataFrom:
    - extract:
        # Mount-relative key (the openbao ClusterSecretStore points at the
        # `apps` mount): marketplace-ui stores each app's entry as
        # <mount>/<name>, so this reads the same entry the installer writes.
        key: apps/jellyfin
