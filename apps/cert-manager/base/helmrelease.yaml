apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 12h
  install:
    # RetryOnFailure: a failed install (e.g. --wait timing out on slow image
    # pulls through flaky egress) is retried as an upgrade instead of wedging
    # terminal in Stalled/RetriesExceeded — everything downstream dependsOn
    # this release, so a terminal install blocks the whole bootstrap until the
    # spec is hand-patched (repo convention; see
    # apps/oauth2-proxy/overlays/librepod/helmrelease.yaml).
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: cert-manager
  values:
    crds:
      enabled: true
    featureGates: AdditionalCertificateOutputFormats=true
    webhook:
      featureGates: AdditionalCertificateOutputFormats=true
