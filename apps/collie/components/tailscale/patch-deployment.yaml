apiVersion: apps/v1
kind: Deployment
metadata:
  name: collie
spec:
  template:
    spec:
      # No serviceAccountName and no API token: the sidecar's node identity
      # lives in tailscaled.state on the state PVC (TS_KUBE_SECRET=""), so
      # containerboot never talks to the Kubernetes API. Base's automount
      # off for the whole pod stands; nothing re-adds the token now that
      # rbac.yaml is gone.
      #
      # MagicDNS first: it answers tailnet names and forwards the rest; CoreDNS
      # second is consulted on SERVFAIL, or once MagicDNS has not answered
      # internal names resolve via hostAliases, not DNS. The search domain is
      # the MagicDNS base domain the headscale app configures (ts.<BASE_DOMAIN>).
      # 10.43.0.10 (CoreDNS) and 10.43.0.1 (API server) below are k3s's
      # default service-CIDR addresses.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 100.100.100.100
          - 10.43.0.10
        searches:
          - ts.${BASE_DOMAIN:=libre.pod}
        options:
          - name: timeout
            value: "1"
          - name: attempts
            value: "2"
      # containerboot's kube client needs the API server under a name its
      # certificate is valid for.
      hostAliases:
        - ip: 10.43.0.1
          hostnames:
            - kubernetes.default.svc
            - kubernetes.default
            - kubernetes
      initContainers:
        # One-shot migration (and safety net) for installs whose lead's
        # identity still lives in the legacy collie-tailscale-state Secret:
        # serialise that Secret into tailscaled.state in TS_STATE_DIR, the
        # file store containerboot now uses (TS_KUBE_SECRET=""). No-op on a
        # fresh install (no legacy Secret, empty state dir) and on any pod
        # restart after the first (state file exists). busybox-only: the
        # kube state store is a set of base64 fields; the file store is a
        # JSON object of the same keys with base64 values (ipn/store/stores.go
        # NewFileStore / ipn/store/kubestore), so plain base64 -d + a shell
        # JSON writer are enough. Inherits the pod security context (65534),
        # which owns the state subPath dir; tailscaled (root) can read and
        # rewrite the file regardless.
        - name: init-tailscale-state
          image: ghcr.io/cyxou/collie-lead
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              STATE=/var/lib/tailscale/tailscaled.state
              if [ -s "$STATE" ]; then
                echo "tailscaled state already on the PVC; nothing to migrate"
                exit 0
              fi
              if [ ! -d /ts-secret ] || [ -z "$(ls -A /ts-secret)" ]; then
                echo "no legacy state Secret mounted; fresh install"
                exit 0
              fi
              echo "migrating kube-Secret state to $STATE"
              first=1
              {
                printf '{'
                for f in /ts-secret/*; do
                  [ -f "$f" ] || continue
                  key=$(basename "$f")
                  val=$(base64 -d <"$f" | base64 | tr -d '\n')
                  if [ "$first" = "1" ]; then first=0; else printf ','; fi
                  printf '"%s":"%s"' "$key" "$val"
                done
                printf '}'
              } >"$STATE.tmp"
              # Sanity check the result is loadable JSON before installing it.
              if ! grep -q '^{.*}$' "$STATE.tmp"; then
                echo "state file failed sanity check"; rm -f "$STATE.tmp"; exit 1
              fi
              chmod 600 "$STATE.tmp"
              mv -f "$STATE.tmp" "$STATE"
              echo "migration complete: $(wc -c <"$STATE") bytes"
          volumeMounts:
            - name: state
              mountPath: /var/lib/tailscale
              subPath: tailscale
            - name: ts-legacy-state
              mountPath: /ts-secret
              readOnly: true
      containers:
        - name: tailscale
          image: tailscale/tailscale
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              add: ["NET_ADMIN"]
          envFrom:
            - configMapRef:
                name: collie-tailscale
          env:
            # Install setting (optional): the lead's tailnet hostname.
            # Unset, the configMap default from tailscale.env (collie-lead)
            # applies — an optional secretKeyRef to a missing key keeps the
            # envFrom value (verified on k8s ≥1.27). Explicit so the node
            # name never depends on a control-server collision suffix.
            - name: TS_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: collie-settings
                  key: TS_HOSTNAME
                  optional: true
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: collie-settings
                  key: TS_AUTHKEY
            - name: TS_EXTRA_ARGS
              valueFrom:
                secretKeyRef:
                  name: collie-settings
                  key: TS_EXTRA_ARGS
                  optional: true
          # containerboot's /healthz answers 200 once the node holds a tailnet
          # IP. A startup probe only: the pod stays unready (and the install
          # fails visibly) until the lead first joins the tailnet, e.g. on a
          # wrong auth key or login server, while a later tailnet blip leaves
          # the PWA up.
          startupProbe:
            httpGet:
              path: /healthz
              port: 9002
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            # kubelet creates the subPath dir on first mount.
            - name: state
              mountPath: /var/lib/tailscale
              subPath: tailscale
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        # The legacy kube-Secret state store (pre-PVC-identity installs).
        # optional: absent on fresh installs and after the Secret is dropped.
        - name: ts-legacy-state
          secret:
            secretName: collie-tailscale-state
            optional: true
