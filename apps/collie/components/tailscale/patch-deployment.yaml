apiVersion: apps/v1
kind: Deployment
metadata:
  name: collie
spec:
  template:
    spec:
      # No API token: the sidecar's node identity lives in tailscaled.state on
      # the state PVC (TS_KUBE_SECRET=""), so containerboot never talks to the
      # Kubernetes API. Base's automount off for the whole pod stands.
      #
      # serviceAccountName is set to default rather than omitted: installs
      # from before this change run as the since-removed collie
      # ServiceAccount, and on them the API server refills an omitted
      # serviceAccountName from the deprecated serviceAccount alias (still
      # collie) under both client- and server-side apply. The new pods would
      # then reference the pruned ServiceAccount and never be created.
      serviceAccountName: default
      #
      # MagicDNS first: it answers tailnet names and forwards the rest; CoreDNS
      # second is consulted on SERVFAIL, or once MagicDNS has not answered
      # within the timeout (tailscaled down or restarting), so a sidecar outage
      # costs each lookup ~1s instead of the resolver's default 5s. The search
      # domain is the MagicDNS base domain the headscale app configures
      # (ts.<BASE_DOMAIN>). 10.43.0.10 (CoreDNS) below is k3s's default
      # service-CIDR address.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 100.100.100.100
          - 10.43.0.10
        searches:
          - ts.${BASE_DOMAIN:=libre.pod}
        options:
          - name: timeout
            value: "1"
          - name: attempts
            value: "2"
      initContainers:
        # One-shot migration (and safety net) for installs whose lead's
        # identity still lives in the legacy collie-tailscale-state Secret:
        # serialise that Secret into tailscaled.state in TS_STATE_DIR, the
        # file store containerboot now uses (TS_KUBE_SECRET=""). No-op on a
        # fresh install (no legacy Secret) and on any pod restart after the
        # first (state file exists). The formats map 1:1: the kube store keeps
        # each state key as a Secret data key (mounted below as a file of the
        # raw, already-decoded bytes); the file store is a JSON object of the
        # same keys with base64 values (ipn/store/stores.go FileStore,
        # ipn/store/kubestore). The kube store sanitises keys to
        # [-._a-zA-Z0-9], so they need no JSON escaping. The tailscale image
        # (busybox) as root: the user tailscaled writes the state dir as.
        - name: init-tailscale-state
          image: tailscale/tailscale
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          command: ["/bin/sh", "-ec"]
          args:
            - |
              STATE=/var/lib/tailscale/tailscaled.state
              if [ -s "$STATE" ]; then
                echo "tailscaled state already on the PVC; nothing to migrate"
                exit 0
              fi
              # Not an emptiness test of /ts-secret: kubelet populates even an
              # absent optional Secret's volume with its ..data entries.
              if [ ! -s /ts-secret/_machinekey ]; then
                echo "no legacy state Secret; fresh install"
                exit 0
              fi
              echo "migrating kube-Secret state to $STATE"
              first=1
              {
                printf '{'
                for f in /ts-secret/*; do
                  [ -f "$f" ] || continue
                  key=$(basename "$f")
                  val=$(base64 <"$f" | tr -d '\n')
                  if [ "$first" = "1" ]; then first=0; else printf ','; fi
                  printf '"%s":"%s"' "$key" "$val"
                done
                printf '}'
              } >"$STATE.tmp"
              chmod 600 "$STATE.tmp"
              mv -f "$STATE.tmp" "$STATE"
              echo "migration complete: $(wc -c <"$STATE") bytes"
          volumeMounts:
            - name: state
              mountPath: /var/lib/tailscale
              subPath: tailscale
            - name: ts-legacy-state
              mountPath: /ts-secret
              readOnly: true
      containers:
        - name: tailscale
          image: tailscale/tailscale
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              add: ["NET_ADMIN"]
          envFrom:
            - configMapRef:
                name: collie-tailscale
          env:
            # Install setting (optional): the lead's tailnet hostname.
            # Unset, the configMap default from tailscale.env (collie-lead)
            # applies — an optional secretKeyRef to a missing key keeps the
            # envFrom value (verified on k8s ≥1.27). Explicit so the node
            # name never depends on a control-server collision suffix.
            - name: TS_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: collie-settings
                  key: TS_HOSTNAME
                  optional: true
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: collie-settings
                  key: TS_AUTHKEY
            - name: TS_EXTRA_ARGS
              valueFrom:
                secretKeyRef:
                  name: collie-settings
                  key: TS_EXTRA_ARGS
                  optional: true
          # containerboot's /healthz answers 200 once the node holds a tailnet
          # IP. A startup probe only: the pod stays unready (and the install
          # fails visibly) until the lead first joins the tailnet, e.g. on a
          # wrong auth key or login server, while a later tailnet blip leaves
          # the PWA up.
          startupProbe:
            httpGet:
              path: /healthz
              port: 9002
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            # kubelet creates the subPath dir on first mount.
            - name: state
              mountPath: /var/lib/tailscale
              subPath: tailscale
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        # The legacy kube-Secret state store (pre-PVC-identity installs).
        # optional: absent on fresh installs and after the Secret is dropped.
        - name: ts-legacy-state
          secret:
            secretName: collie-tailscale-state
            optional: true
