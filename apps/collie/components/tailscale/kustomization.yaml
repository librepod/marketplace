# Tailscale sidecar: gives the lead its tailnet egress to the crew members
# (the lead dials each member over the tailnet) and the tailnet address
# members join at. The image tag is pinned in the overlay.
#
# No RBAC resources: the node identity lives in tailscaled.state on the
# collie-data PVC (TS_KUBE_SECRET explicitly empty in tailscale.env), so
# containerboot never talks to the Kubernetes API. The legacy
# collie-tailscale-state Secret is read by the init-tailscale-state init
# container as a mounted volume, which needs no permissions.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
- name: collie-tailscale
  envs:
  - tailscale.env

patches:
- path: patch-deployment.yaml
  target:
    kind: Deployment
    name: collie
