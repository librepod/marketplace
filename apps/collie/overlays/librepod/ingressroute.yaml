# /auth/* → oauth2-proxy's own sign-in. Collie reserves /auth/ for the fronting
# proxy's login flow (the PWA's "Sign in" banner links there; collie itself
# answers 404). It has to be a 302 with rd pointing back at the app root: a
# replacePathRegex rewrite to /oauth2/sign_in?rd=… does not work, because
# traefik treats the replacement as a raw path and percent-encodes the '?'.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: collie-auth-signin
spec:
  redirectRegex:
    regex: ^https?://[^/]+/auth.*$
    replacement: https://oauth2-proxy.${BASE_DOMAIN:=libre.pod}/oauth2/sign_in?rd=https%3A%2F%2Fcollie.${BASE_DOMAIN:=libre.pod}%2F
    permanent: false
---
# Reads are SSO-gated by the forward-auth middlewares; writes are additionally
# gated by collie's device pairing. Never drop the middlewares, and never
# expose the lead with `tailscale funnel`.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: collie
spec:
  entryPoints:
  - web
  - websecure
  routes:
  # Higher priority than the catch-all below, so /auth never reaches collie.
  # noop@internal is traefik's placeholder service for redirect-only rules.
  - kind: Rule
    match: Host(`collie.${BASE_DOMAIN:=libre.pod}`) && PathPrefix(`/auth`)
    priority: 100
    middlewares:
    - name: collie-auth-signin
    services:
    - name: noop@internal
      kind: TraefikService
  - kind: Rule
    match: Host(`collie.${BASE_DOMAIN:=libre.pod}`)
    priority: 1
    middlewares:
    - name: oauth2-errors
      namespace: oauth2-proxy
    - name: oauth2-forwardauth
      namespace: oauth2-proxy
    services:
    - name: collie
      port: 80
