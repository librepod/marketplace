apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: collie

resources:
- ../../base
- ingressroute.yaml
- networkpolicy.yaml

components:
- ../../components/tailscale

images:
- name: ghcr.io/cyxou/collie-lead
  newTag: 1.24.3
- name: tailscale/tailscale
  newTag: v1.104.4

patches:
- path: ./patch-storage-class.yaml
  target:
    kind: PersistentVolumeClaim
