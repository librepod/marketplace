apiVersion: marketplace/v1
kind: AppDefinition
metadata:
  name: wg-easy
spec:
  displayName: "WG Easy"
  description: "WireGuard VPN with a web-based configuration UI for easy setup and management"
  icon: "https://raw.githubusercontent.com/wg-easy/wg-easy/master/src/assets/img/logo.png"
  category: "Network"
  website: "https://github.com/wg-easy/wg-easy"

  # renovate: datasource=docker depName=ghcr.io/wg-easy/wg-easy
  # serge: notesRepo=wg-easy/wg-easy
  version: "15.4.0"

  source:
    type: oci-kustomize
    url: "oci://ghcr.io/librepod/marketplace/apps/wg-easy"
    path: ./overlays/librepod

  # Two install questions. The first-run wizard answers both: INIT_PASSWORD
  # with the LibrePod admin password (server-side, from OpenBao system/admin)
  # and INIT_HOST with the endpoint the owner confirmed. wg-easy rejects admin
  # passwords shorter than 12 characters at login; the settings contract has
  # no length rule, so the description states it. An empty INIT_HOST answer is
  # never stored, so the ConfigMap's ${DEVICE_IP} default applies.
  settings:
    items:
      - name: INIT_PASSWORD
        label: "Admin password"
        description: "Password for wg-easy's built-in admin account, applied on first start. Use your LibrePod admin password — at least 12 characters, or wg-easy rejects it at login. Single sign-on is the primary login; this is the fallback."
        sensitive: true
        required: true
      - name: INIT_HOST
        label: "Endpoint host"
        description: "The address your devices dial to reach this VPN, applied on first start. Leave empty to use this device's IP address."

  dependencies:
    required:
      - kind: IngressController
        description: "Traefik (provided by traefik app)"
      - kind: StorageClass
        description: "nfs-client (provided by nfs-provisioner app)"
      - kind: SSOProvider
        description: "Casdoor SSO (provided by casdoor-sso-controller)"

  # templates.release substitutes exactly the two platform variables:
  # BASE_DOMAIN, and DEVICE_IP — the device's LAN IP, which marketplace-ui reads
  # from its node at install time (wg-easy's endpoint host, INIT_HOST). Nothing
  # fills any other ${VAR} on a catalog install: it would stay literal text in
  # the committed release and break the apply.
  templates:
    source: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: marketplace-wg-easy
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "wg-easy"
      spec:
        interval: 10m
        url: oci://ghcr.io/librepod/marketplace/apps/wg-easy
        ref:
          tag: "__VERSION__"
    release: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: marketplace-wg-easy
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "wg-easy"
      spec:
        dependsOn:
          - name: traefik
          - name: storage
          # SSOClient CR + Secret need the CRD/controller to exist first
          - name: casdoor-sso-controller
        interval: 1h
        retryInterval: 2m
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: marketplace-wg-easy
        path: ./overlays/librepod
        prune: true
        wait: true
        postBuild:
          substitute:
            BASE_DOMAIN: "${BASE_DOMAIN}"
            DEVICE_IP: "${DEVICE_IP}"
    kustomization: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - source.yaml
        - release.yaml
