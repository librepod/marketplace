apiVersion: marketplace/v1
kind: AppDefinition
metadata:
  name: wg-easy
spec:
  displayName: "WG Easy"
  description: "WireGuard VPN with a web-based configuration UI for easy setup and management"
  icon: "https://raw.githubusercontent.com/wg-easy/wg-easy/master/src/assets/img/logo.png"
  category: "Network"
  website: "https://github.com/wg-easy/wg-easy"

  # renovate: datasource=docker depName=ghcr.io/wg-easy/wg-easy
  # serge: notesRepo=wg-easy/wg-easy
  version: "15.4.0"

  source:
    type: oci-kustomize
    url: "oci://ghcr.io/librepod/marketplace/apps/wg-easy"
    path: ./overlays/librepod

  dependencies:
    required:
      - kind: IngressController
        description: "Traefik (provided by traefik app)"
      - kind: StorageClass
        description: "nfs-client (provided by nfs-provisioner app)"
      - kind: SSOProvider
        description: "Casdoor SSO (provided by casdoor-sso-controller)"

  templates:
    source: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: marketplace-wg-easy
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "wg-easy"
      spec:
        interval: 10m
        url: oci://ghcr.io/librepod/marketplace/apps/wg-easy
        ref:
          tag: "__VERSION__"
    release: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: marketplace-wg-easy
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "wg-easy"
      spec:
        dependsOn:
          - name: traefik
          - name: storage
          # SSOClient CR + Secret need the CRD/controller to exist first
          - name: casdoor-sso-controller
        interval: 1h
        retryInterval: 2m
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: marketplace-wg-easy
        path: ./overlays/librepod
        prune: true
        wait: true
        postBuild:
          substitute:
            BASE_DOMAIN: "${BASE_DOMAIN}"
            FRP_SERVER_ADDR: "${FRP_SERVER_ADDR}"
            FRP_REMOTE_PORT: "${FRP_REMOTE_PORT}"
            WIREGUARD_PROXY_NAME: "${WIREGUARD_PROXY_NAME}"
            TZ: "${TZ}"
    kustomization: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - source.yaml
        - release.yaml
