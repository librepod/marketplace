apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-easy
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wg-easy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wg-easy
    spec:
      # No hostNetwork: the pod runs in its own netns where the primary
      # interface is always eth0, so wg-easy's MASQUERADE rule matches
      # deterministically regardless of which firewall backend it lands in.
      # The pod is reached only via its ClusterIP Service — from Traefik's
      # wireguard UDP entryPoint (on-LAN) and the FRP relay (remote).
      initContainers:
      # wg-easy expects the operator to enable kernel forwarding (its docs
      # require net.ipv4.ip_forward=1 + src_valid_mark=1). Under hostNetwork
      # these were inherited from the host; in a pod netns they default to 0,
      # so set them here. The init container must be privileged: writing
      # /proc/sys/net/* needs a read-write /proc, which the kubelet mounts
      # read-only for non-privileged containers (NET_ADMIN governs netlink/
      # iptables, not /proc/sys writes). The official wg-easy compose uses
      # Docker `sysctls:`, which has no direct k8s equivalent for these
      # "unsafe" sysctls without a kubelet allowed-unsafe-sysctls host change
      # we avoid on principle. Reuses the app image so the overlay's images:
      # transformer keeps it version-locked, no new dependency.
      - name: sysctl
        image: ghcr.io/wg-easy/wg-easy
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -e
          sysctl -w net.ipv4.ip_forward=1
          sysctl -w net.ipv4.conf.all.src_valid_mark=1
        securityContext:
          privileged: true
      containers:
      - name: wg-easy
        image: ghcr.io/wg-easy/wg-easy
        imagePullPolicy: IfNotPresent
        # wg-easy ≤15.5.0 points `iptables` at iptables-legacy, and its
        # PostUp/PostDown hooks (seeded into its DB, no env override in v15)
        # call it bare — `iptables -t nat … MASQUERADE`. Kernels without the
        # legacy xtables ABI (no ip_tables module at all: NixOS 26.05 /
        # kernel 6.18.x) fail every such call with "Table does not exist",
        # wg-quick up aborts, and the pod crash-loops. Upstream fixed this
        # with an iptables-backend wrapper (wg-easy PR #2834, merged
        # 2026-10-26, two days AFTER v15.5.0 was cut — unreleased). This
        # command mirrors that wrapper: keep legacy where it works, else
        # register + select the nft flavor the image already ships, so the
        # DB-seeded hook commands run unchanged through iptables-nft.
        # If neither backend answers the kernel, the pod fails exactly
        # as it would without this wrapper. Removal note: spec.version
        # in metadata.yaml.
        command:
        - /bin/sh
        - -c
        - |
          if ! iptables-legacy -w -L -n >/dev/null 2>&1 && iptables-nft -L -n >/dev/null 2>&1; then
            update-alternatives --install /usr/sbin/iptables iptables /usr/sbin/iptables-nft 5 --slave /usr/sbin/iptables-restore iptables-restore /usr/sbin/iptables-nft-restore --slave /usr/sbin/iptables-save iptables-save /usr/sbin/iptables-nft-save
            update-alternatives --install /usr/sbin/ip6tables ip6tables /usr/sbin/ip6tables-nft 5 --slave /usr/sbin/ip6tables-restore ip6tables-restore /usr/sbin/ip6tables-nft-restore --slave /usr/sbin/ip6tables-save ip6tables-save /usr/sbin/ip6tables-nft-save
            update-alternatives --set iptables /usr/sbin/iptables-nft
            update-alternatives --set ip6tables /usr/sbin/ip6tables-nft
          fi
          exec /usr/bin/dumb-init node server/index.mjs
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - SYS_MODULE
        envFrom:
        - configMapRef:
            name: wg-easy
          # Settings Secret (OpenBao via ESO) LAST so its values override the
          # .env defaults. Non-optional on purpose: the pod waits until ESO has
          # synced INIT_PASSWORD rather than booting without its admin account.
        - secretRef:
            name: wg-easy-settings
        # OIDC client credentials, written by casdoor-sso-controller from the
        # SSOClient CR in the overlay. Not optional on purpose: until the
        # controller writes the secret the pod stays in
        # CreateContainerConfigError and self-heals within seconds of the
        # secret appearing (wg-easy skips unconfigured providers, so there is
        # no broken half-SSO state).
        env:
        - name: OAUTH_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: wg-easy-sso
              key: OAUTH_OIDC_CLIENT_ID
        - name: OAUTH_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: wg-easy-sso
              key: OAUTH_OIDC_CLIENT_SECRET
        volumeMounts:
        - name: config
          mountPath: /etc/wireguard
        - name: tun
          mountPath: /dev/net/tun
        livenessProbe:
          tcpSocket:
            port: 51821
          initialDelaySeconds: 0
          failureThreshold: 3
          timeoutSeconds: 1
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 51821
          initialDelaySeconds: 0
          failureThreshold: 3
          timeoutSeconds: 1
          periodSeconds: 10
        startupProbe:
          tcpSocket:
            port: 51821
          initialDelaySeconds: 0
          failureThreshold: 30
          timeoutSeconds: 1
          periodSeconds: 5
        ports:
        - name: http
          containerPort: 51821
          protocol: TCP
        - name: wireguard
          containerPort: 51820
          protocol: UDP
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: wg-easy-config
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
