apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- ingressroute-http.yaml
- ingressroute-udp.yaml
- ssoclient.yaml
- externalsecret-ca.yaml

images:
- name: ghcr.io/wg-easy/wg-easy
  newTag: "15.4"

components:
  - ../../components/frp-upstreams
  - ../../components/sing-box-router

patches:
- path: patch-pvc.yaml
- path: deployment-ca-patch.yaml
  target:
    kind: Deployment
    name: wg-easy
