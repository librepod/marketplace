# Copy this directory into your cluster's user-apps repo (see README.md),
# replace the WireGuard keys and server with your upstream VPN exit, then
# restart the wg-easy pod. Routing policy is plain sing-box config — edit
# rules/outbounds/endpoints to taste: https://sing-box.sagernet.org/configuration/
apiVersion: v1
kind: Secret
metadata:
  name: sing-box-router
  namespace: wg-easy
type: Opaque
stringData:
  config.json: |
    {
      "log": { "level": "info", "timestamp": true },
      "dns": {
        "servers": [
          { "tag": "cluster", "type": "udp", "server": "10.43.0.10" },
          { "tag": "remote", "type": "udp", "server": "1.1.1.1", "detour": "wg-exit" }
        ],
        "rules": [
          { "domain_suffix": [".libre.pod"], "server": "cluster" },
          { "rule_set": "geosite-category-ru", "server": "cluster" }
        ],
        "final": "remote"
      },
      "inbounds": [
        { "type": "tproxy", "tag": "tproxy-in", "listen": "0.0.0.0", "listen_port": 12345 },
        { "type": "direct", "tag": "dns-in", "listen": "0.0.0.0", "listen_port": 5353 }
      ],
      "outbounds": [
        { "type": "direct", "tag": "direct-out" }
      ],
      "endpoints": [
        {
          "type": "wireguard",
          "tag": "wg-exit",
          "address": ["10.10.0.2/32"],
          "private_key": "4N96RYasaF++zcz1049E5391tD4s3aivDDPTzY0Vx38=",
          "peers": [
            {
              "address": "nl-server.example.com",
              "port": 51820,
              "public_key": "r2/rs5xP7TrtFnrCKuQcrnq4Zv5So365s2bHJzUd7CE=",
              "allowed_ips": ["0.0.0.0/0"]
            }
          ],
          "mtu": 1280
        }
      ],
      "route": {
        "default_domain_resolver": "cluster",
        "rules": [
          { "action": "sniff" },
          { "protocol": "dns", "action": "hijack-dns" },
          { "ip_is_private": true, "outbound": "direct-out" },
          { "rule_set": "geosite-category-ru", "outbound": "direct-out" },
          { "ip_cidr": ["91.108.0.0/16"], "outbound": "wg-exit" }
        ],
        "rule_set": [
          {
            "type": "remote",
            "tag": "geosite-category-ru",
            "format": "binary",
            "url": "https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-category-ru.srs",
            "download_detour": "direct-out"
          }
        ],
        "final": "direct-out",
        "auto_detect_interface": true
      }
    }
