apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: casdoor
spec:
  values:
    # Override app.conf keys via env vars (Casdoor supports per-key env override
    # of app.conf). All keys from the casdoor-env ConfigMap are loaded with a
    # single envFrom entry:
    #   - dataSourceName: chart default is a relative SQLite path (upstream
    #     https://github.com/casdoor/casdoor-helm/issues/42); write to the /data PVC.
    #   - runmode: chart default is "dev"; pin "prod" for this deployment.
    # NB: we use envFrom (whole-ConfigMap) rather than per-key envFromConfigmap
    # because the chart's envFromConfigmap helper has a {{- end -}} trim bug that
    # concatenates list entries when there are 2+, producing invalid YAML
    # (casdoor-helm-charts 3.106.0).
    envFrom:
      - type: configmap
        name: casdoor-env

    service:
      port: 80

    extraVolumeMounts:
    - name: data
      mountPath: /data
    # Casdoor keeps beego sessions as files in ./tmp (hardcoded in main.go,
    # relative to CWD=/). Container-local /tmp dies with every pod restart —
    # the nightly borgmatic backup scales this deployment to 0, wiping all
    # SSO sessions cluster-wide. Mount the PVC over /tmp so sessions persist
    # (the browser cookie is already valid for 30 days: cookieExpireInHours).
    # No subPath: a kubelet-created subPath dir would be root-owned on NFS
    # and unwritable by the casdoor process.
    - name: data
      mountPath: /tmp
    # - name: init-data
    #   mountPath: /init_data.json
    #   subPath: init_data.json

    extraVolumes:
    - name: data
      persistentVolumeClaim:
        claimName: casdoor-data
    # - name: init-data
    #   configMap:
    #     name: init-data

  # Upstream chart (casdoor-helm-charts 3.106.0) ships a bare livenessProbe
  # (GET /, kube defaults: no delay, timeoutSeconds 1) that kills the container
  # ~30s in — mid-first-start-init. Casdoor creates the `built-in` org first;
  # once it exists, later starts skip the rest of init, leaving the DB
  # permanently without app-built-in/admin user/certs and crashlooping
  # casdoor-sso-controller's bootstrap (issue #366). It also false-kills under
  # load (issue #273). Upstream fixed this with a startup probe + /api/health
  # (casdoor/casdoor@6121c737), but no released chart carries it yet; this
  # postRender patch reproduces that fix's exact shape. DELETE this whole
  # postRenderers block when the pinned chart ships it natively.
  # /api/health is anonymous-200 on casdoor 3.106.0 (verified on a live
  # deployment). NB: the container is chart-hardcoded "casdoor-helm-charts";
  # a postRender patch that stops matching is silently ignored, so re-check
  # this on every chart bump.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: casdoor
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: casdoor
              spec:
                template:
                  spec:
                    containers:
                      - name: casdoor-helm-charts
                        # Holds liveness+readiness off until first-start init
                        # (org/app/admin/cert seeding on a fresh SQLite DB over
                        # NFS) completes: budget 10s x 30 = 5 min.
                        startupProbe:
                          httpGet:
                            path: /api/health
                            port: http
                          periodSeconds: 10
                          timeoutSeconds: 5
                          failureThreshold: 30
                        livenessProbe:
                          httpGet:
                            path: /api/health
                            port: http
                          periodSeconds: 10
                          timeoutSeconds: 5
                          failureThreshold: 3
                        readinessProbe:
                          httpGet:
                            path: /api/health
                            port: http
                          periodSeconds: 10
                          timeoutSeconds: 5
                          failureThreshold: 3
