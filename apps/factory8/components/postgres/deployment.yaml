# Temporal's only store: one plain Postgres, no operator. Recreate (single
# writer on NFS) and the converge-db-password container are both load-bearing —
# see the app skill's "Bundled PostgreSQL" rules.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: factory8
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: postgres
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: factory8-settings
                  key: DB_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
        - name: converge-db-password
          image: postgres
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: postgres
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: factory8-settings
                  key: DB_PASSWORD
          command: ["/bin/sh", "-c"]
          args:
            - |
              until psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c '\q' 2>/dev/null; do
                sleep 1
              done
              printf "ALTER USER %s PASSWORD :'pw';\n" "$POSTGRES_USER" | \
                psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                  -v on_error_stop=1 -v pw="$POSTGRES_PASSWORD"
              while sleep 3600; do :; done
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres
