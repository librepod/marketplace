# The cluster's root CA, so the Temporal UI trusts the IdP's TLS during the
# server-side token exchange (docs/sso-app-author-guide.md §4).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: step-certificates-certs
  namespace: factory8
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: step-certificates-certs
    creationPolicy: Owner
  data:
    - secretKey: root_ca.crt
      remoteRef: { key: apps/step-ca, property: root_ca.crt }
    - secretKey: intermediate_ca.crt
      remoteRef: { key: apps/step-ca, property: intermediate_ca.crt }
