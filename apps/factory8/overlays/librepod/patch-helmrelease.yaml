# Chart version pin (HTTP HelmRepository — exact version, never a range) and
# the domain-dependent web UI values. additionalEnv lists replace wholesale on
# strategic merge, so this patch carries the complete list.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal
spec:
  chart:
    spec:
      chart: temporal
      version: "1.7.0"
      sourceRef:
        kind: HelmRepository
        name: temporal-helm-charts
      interval: 12h
  values:
    web:
      # SSO through the cluster's Casdoor. Without server-side authorization,
      # everyone who logs in can do anything in the UI.
      additionalEnvSecretName: temporal-sso
      additionalEnv:
        - { name: TEMPORAL_AUTH_ENABLED, value: "true" }
        - { name: TEMPORAL_AUTH_PROVIDER_URL, value: "https://id.${BASE_DOMAIN:=libre.pod}" }
        - { name: TEMPORAL_AUTH_CALLBACK_URL, value: "https://temporal.${BASE_DOMAIN:=libre.pod}/auth/sso/callback" }
        - { name: TEMPORAL_AUTH_SCOPES, value: "openid,profile,email" } # comma-separated in this image, not as in the docs
        - { name: SSL_CERT_FILE, value: /etc/libre-pod-ca/root_ca.crt } # the UI's only TLS peer is the IdP
      additionalVolumes:
        - { name: root-ca, secret: { secretName: step-certificates-certs } }
      additionalVolumeMounts:
        - { name: root-ca, mountPath: /etc/libre-pod-ca, readOnly: true }
