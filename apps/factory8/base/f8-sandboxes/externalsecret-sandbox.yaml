# The sandbox pods' admin-owned settings (worker/src/activities.ts reads Secret
# `f8-sandbox` via envFrom). Same OpenBao entry as factory8-settings, but
# data:-selected keys only: the sandbox pods get the agent credentials, and
# deliberately NOT the DB password (nor anything else added to the entry later).
#
# The marketplace's settings editor only force-syncs the factory8-settings
# ExternalSecret after a save; this one picks up changes on its 5m refresh —
# sandbox pods are created per step and read the Secret at pod start, so a
# briefly stale token only delays the next step.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: f8-sandbox-settings
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: f8-sandbox
  data:
    - secretKey: GH_TOKEN
      remoteRef:
        key: apps/factory8
        property: GH_TOKEN
    - secretKey: ANTHROPIC_BASE_URL
      remoteRef:
        key: apps/factory8
        property: ANTHROPIC_BASE_URL
    - secretKey: ANTHROPIC_AUTH_TOKEN
      remoteRef:
        key: apps/factory8
        property: ANTHROPIC_AUTH_TOKEN
