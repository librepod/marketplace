# The worker's only powers, scoped to this namespace: create/watch/delete the
# step pods and create their PVCs. Nothing cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: f8-worker
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: f8-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: f8-worker
subjects:
  - kind: ServiceAccount
    name: f8-worker
    namespace: factory8
