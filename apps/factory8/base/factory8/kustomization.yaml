apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: factory8

configMapGenerator:
- name: factory8
  envs:
  - factory8.env

resources:
- serviceaccount.yaml
- deployment.yaml
- helmrepository.yaml
- helmrelease.yaml
- externalsecret.yaml

components:
# App-root component (apps/factory8/components/postgres), outside base/ by
# convention — included here so it inherits this kustomization's namespace
# transformer (factory8) and the root's labels.
- ../../components/postgres
