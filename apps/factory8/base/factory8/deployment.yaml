# The Temporal worker: manages sandboxes in f8-sandboxes, holds no GitHub token.
# Upstream design (DEP-6): the sandbox credentials (GH_TOKEN, ANTHROPIC_*) live
# only in the f8-sandbox Secret in f8-sandboxes, read by the sandbox pods.
# That is why this Deployment does NOT envFrom factory8-settings — it takes the
# settings it needs as named secretKeyRefs, so GH_TOKEN never reaches the worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: f8-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f8-worker
  template:
    metadata:
      labels:
        app: f8-worker
    spec:
      serviceAccountName: f8-worker
      containers:
        - name: worker
          image: ghcr.io/factory8/worker
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: factory8
          env:
            - name: F8_IMAGES
              valueFrom:
                secretKeyRef:
                  name: factory8-settings
                  key: F8_IMAGES
            - name: F8_MODEL
              valueFrom:
                secretKeyRef:
                  name: factory8-settings
                  key: F8_MODEL
            - name: F8_REVIEW_MODEL
              valueFrom:
                secretKeyRef:
                  name: factory8-settings
                  key: F8_REVIEW_MODEL
            # The ship flow's settings (F8_BANDS JSON, F8_PLUGIN URL) are not
            # settings items; users add them as custom variables, which land in
            # the same Secret. Optional: absent on installs that never ship —
            # the basic issue→PR flow needs neither.
            - name: F8_BANDS
              valueFrom:
                secretKeyRef:
                  name: factory8-settings
                  key: F8_BANDS
                  optional: true
            - name: F8_PLUGIN
              valueFrom:
                secretKeyRef:
                  name: factory8-settings
                  key: F8_PLUGIN
                  optional: true
