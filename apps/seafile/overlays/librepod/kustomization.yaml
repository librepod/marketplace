# Seafile overlay for LibrePod deployment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: seafile

resources:
- ../../base
- ../../components/mysql
- ../../components/redis
- ingressroute.yaml
- ssoclient.yaml
- externalsecret-ca.yaml

# Patch storageClassName onto every PVC (base/components stay portable).
patches:
- path: ./patch-storage-class.yaml
# Inject the LibrePod root-CA trust (init container + volumes) into the
# Deployment. Separate from base so every SSO app carries CA trust the same way
# (see deployment-ca-patch.yaml).
- path: deployment-ca-patch.yaml

# Image tag transformers
images:
- name: seafileltd/seafile-mc
  newTag: "13.0-latest"
- name: mariadb
  newTag: "10.11"
- name: redis
  newTag: "8.4"
