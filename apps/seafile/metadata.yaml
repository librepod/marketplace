apiVersion: marketplace/v1
kind: AppDefinition
metadata:
  name: seafile
spec:
  displayName: "Seafile"
  description: "Self-hosted file synchronization and collaboration platform"
  icon: "https://raw.githubusercontent.com/haiwen/seafile/master/media/seafile-icon.png"
  category: "Productivity"
  website: "https://github.com/haiwen/seafile"

  # NOTE: "13.0-latest" is a rolling tag, not pinned — Renovate cannot
  # track it. Pin to a concrete patch tag first, then add a renovate
  # annotation for image seafileltd/seafile-mc (datasource docker).
  version: "13.0-latest"

  source:
    type: oci-kustomize
    url: "oci://ghcr.io/librepod/marketplace/apps/seafile"
    path: ./overlays/librepod

  # Closed settings (no allowCustom): seafile has no user-facing install
  # questions — everything here is a machine secret, generate-only (never shown
  # in the install dialog). On reinstall the stored values are reused, so MySQL
  # credentials keep working against the NFS-surviving MariaDB data (this app
  # has NO converge container) and existing sessions/JWTs stay valid.
  #
  # NOTE: JWT_PRIVATE_KEY is a random opaque string by legacy design (surfaced
  # to seafile-mc as SEAFILE_AI_SECRET_KEY) — NOT a PEM key. Preserve that
  # semantics; do not "fix" it into a real key in this migration.
  settings:
    items:
      - name: MYSQL_ROOT_PASSWORD
        label: "MySQL root password"
        description: "MariaDB root password, shared by the mysql container and seafile's DB bootstrap (INIT_SEAFILE_MYSQL_ROOT_PASSWORD derives from it). Generated once per install."
        sensitive: true
        generate:
          length: 32
      - name: SEAFILE_MYSQL_DB_PASSWORD
        label: "Seafile database password"
        description: "Password of the seafile MySQL user (ccnet/seahub/seafile DBs). Generated once per install."
        sensitive: true
        generate:
          length: 32
      - name: REDIS_PASSWORD
        label: "Redis password"
        description: "Redis requirepass, shared by the redis container and seafile's cache config. Generated once per install."
        sensitive: true
        generate:
          length: 32
      - name: INIT_SEAFILE_ADMIN_PASSWORD
        label: "Seafile admin password"
        description: "Initial admin (admin@<domain>) password, applied on first bootstrap. Generated once per install."
        sensitive: true
        generate:
          length: 32
      - name: JWT_PRIVATE_KEY
        label: "Seafile JWT signing key"
        description: "Random opaque signing key (surfaced to seafile-mc as SEAFILE_AI_SECRET_KEY); stable per-install, so existing tokens stay valid across restarts."
        sensitive: true
        generate:
          length: 40

  dependencies:
    required:
      - kind: IngressController
        description: "Traefik (provided by bootstrap)"
      - kind: StorageClass
        description: "nfs-client (provided by bootstrap)"
      - kind: SSOProvider
        description: "Casdoor SSO (provided by casdoor-sso-controller)"

  templates:
    source: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: marketplace-seafile
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "seafile"
      spec:
        interval: 10m
        url: oci://ghcr.io/librepod/marketplace/apps/seafile
        ref:
          tag: "__VERSION__"
    release: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: marketplace-seafile
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "seafile"
      spec:
        dependsOn:
          - name: casdoor-sso-controller
        force: true
        interval: 1h
        retryInterval: 2m
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: marketplace-seafile
        path: ./overlays/librepod
        prune: true
        wait: true
        postBuild:
          substitute:
            BASE_DOMAIN: "${BASE_DOMAIN}"
    kustomization: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - source.yaml
        - release.yaml
