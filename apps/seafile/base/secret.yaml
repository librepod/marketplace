# Seafile application secrets.
#
# This is a plain Secret (NOT a secretGenerator) with ${VAR} placeholders.
# Flux postBuild.substitute (via substituteFrom: Secret/seafile-config, see
# metadata.yaml) replaces each ${VAR} with the marketplace-generated value at
# deploy time. A secretGenerator would NOT work here: kustomize base64-encodes
# its output before Flux's text substitution runs, so ${VAR} would survive
# unchanged (see apps/immich/base/immich.env for the same gotcha). Plain
# stringData stays human-readable in the rendered manifest, so Flux CAN
# substitute it. Same pattern as apps/frpc/base/secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: seafile-secret
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
  # Seafile's mysql bootstrap reads the root password from this var; reuse the
  # generated root password rather than declaring a second secret.
  INIT_SEAFILE_MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
  SEAFILE_MYSQL_DB_PASSWORD: "${SEAFILE_MYSQL_DB_PASSWORD}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  # JWT signing key (surfaced to seafile-mc as SEAFILE_AI_SECRET_KEY). Generated
  # per-install; stable thereafter, so existing tokens stay valid across restarts.
  JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY}"
  INIT_SEAFILE_ADMIN_PASSWORD: "${INIT_SEAFILE_ADMIN_PASSWORD}"
