apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seafile
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seafile
    spec:
      enableServiceLinks: false
      initContainers:
        - name: set-ownership
          image: busybox:1.36
          command: ['sh', '-c', 'chown -R root:root /shared']
          volumeMounts:
            - name: seafile-data
              mountPath: /shared
      containers:
        - name: seafile
          image: seafileltd/seafile-mc
          imagePullPolicy: IfNotPresent
          env:
            - name: SEAFILE_AI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seafile-secret
                  key: JWT_PRIVATE_KEY
            - name: INIT_SEAFILE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-secret
                  key: INIT_SEAFILE_ADMIN_PASSWORD
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: seafile-sso
                  key: OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: seafile-sso
                  key: OAUTH_CLIENT_SECRET
          envFrom:
            - configMapRef:
                name: seafile
            - secretRef:
                name: seafile-secret
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    f=/shared/seafile/conf/seahub_settings.py
                    m="# >>> librepod-sso (managed) >>>"
                    # Wait for seafile-mc to generate the file (first boot).
                    i=0
                    while [ ! -f "$f" ] && [ "$i" -lt 60 ]; do sleep 2; i=$((i+1)); done
                    [ -f "$f" ] || exit 0
                    # Append once (marker-guarded). os.environ is read by seahub
                    # at import time, so rotation just needs a pod restart.
                    grep -q "$m" "$f" && exit 0
                    cat >> "$f" <<'PY'

                    # >>> librepod-sso (managed) >>>
                    import os
                    ENABLE_OAUTH = True
                    OAUTH_ENABLE_INSECURE_TRANSPORT = False
                    OAUTH_CLIENT_ID = os.environ["OAUTH_CLIENT_ID"]
                    OAUTH_CLIENT_SECRET = os.environ["OAUTH_CLIENT_SECRET"]
                    OAUTH_REDIRECT_URL = "https://seafile.${BASE_DOMAIN:=libre.pod}/oauth/callback/"
                    OAUTH_PROVIDER = "casdoor"
                    OAUTH_AUTHORIZATION_URL = "https://id.${BASE_DOMAIN:=libre.pod}/login/oauth/authorize"
                    OAUTH_TOKEN_URL = "https://id.${BASE_DOMAIN:=libre.pod}/api/login/oauth/access_token"
                    OAUTH_USER_INFO_URL = "https://id.${BASE_DOMAIN:=libre.pod}/api/userinfo"
                    OAUTH_SCOPE = ["openid", "profile", "email"]
                    OAUTH_ATTRIBUTE_MAP = {
                        "sub":   (True,  "uid"),
                        "name":  (False, "name"),
                        "email": (False, "contact_email"),
                    }
                    CSRF_TRUSTED_ORIGINS = ["https://seafile.${BASE_DOMAIN:=libre.pod}"]
                    # <<< librepod-sso (managed) <<<
                    PY
          ports:
            - containerPort: 80
          volumeMounts:
            - name: seafile-data
              mountPath: /shared
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: seafile-data
          persistentVolumeClaim:
            claimName: seafile-data
