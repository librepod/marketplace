# Pulls this app's install settings from OpenBao. Written by marketplace-ui at
# install time (answer → default → stored value → generated); synced here by ESO.
#
# Uses data[] (not dataFrom.extract) because the legacy secret mapped ONE
# generated value onto TWO keys: INIT_SEAFILE_MYSQL_ROOT_PASSWORD equals
# MYSQL_ROOT_PASSWORD (seafile's DB bootstrap reads the former, the mysql
# container and runtime the latter — divergence locks seafile out of its own
# DB). extract cannot duplicate a key, so both secretKeys derive from the same
# remoteRef property and stay equal by construction, on fresh and migrated
# installs alike.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seafile-settings
  namespace: seafile
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: seafile-settings
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        # Mount-relative key (the openbao ClusterSecretStore points at the
        # `apps` mount): marketplace-ui stores each app's entry as
        # <mount>/<name>, so this reads the same entry the installer writes.
        key: apps/seafile
        property: MYSQL_ROOT_PASSWORD
    - secretKey: INIT_SEAFILE_MYSQL_ROOT_PASSWORD
      remoteRef:
        key: apps/seafile
        property: MYSQL_ROOT_PASSWORD  # same source: stays equal
    - secretKey: SEAFILE_MYSQL_DB_PASSWORD
      remoteRef:
        key: apps/seafile
        property: SEAFILE_MYSQL_DB_PASSWORD
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: apps/seafile
        property: REDIS_PASSWORD
    - secretKey: INIT_SEAFILE_ADMIN_PASSWORD
      remoteRef:
        key: apps/seafile
        property: INIT_SEAFILE_ADMIN_PASSWORD
    - secretKey: JWT_PRIVATE_KEY
      remoteRef:
        key: apps/seafile
        property: JWT_PRIVATE_KEY
