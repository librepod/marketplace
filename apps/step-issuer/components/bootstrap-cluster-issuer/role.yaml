# ClusterRole for creating the StepClusterIssuer resource. Idempotent flow
# is GET (exists → skip) + POST (create); re-provisioning goes via delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: step-ca-bootstrap-cluster-issuer
rules:
  - apiGroups: ["certmanager.step.sm"]
    resources: ["stepclusterissuers"]
    verbs: ["get", "create"]
---
# Namespace-scoped Role for reading the bootstrap Secret (password/kid/
# caBundle) produced by the step-certificates bootstrap Job.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: step-ca-bootstrap-cluster-issuer
  namespace: step-ca
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
