# ClusterRole for the StepClusterIssuer resource: create on first boot,
# patch when the provisioner Secret changes under a CA rotation (the
# bootstrap initContainer is the issuer's reconciler — the controller never
# re-reads a changed kid from the Secret on its own).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: step-ca-bootstrap-cluster-issuer
rules:
  - apiGroups: ["certmanager.step.sm"]
    resources: ["stepclusterissuers"]
    verbs: ["get", "create", "patch"]
---
# Namespace-scoped Role for reading the bootstrap Secret (password/kid/
# caBundle) produced by the step-certificates bootstrap Job.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: step-ca-bootstrap-cluster-issuer
  namespace: step-ca
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
