# Pulls this app's install settings from OpenBao. Written by marketplace-ui at
# install time (answer → default → stored value → generated); synced here by ESO.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-settings
  namespace: open-webui
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: open-webui-settings
  dataFrom:
    - extract:
        # Engine-relative key: the openbao ClusterSecretStore has no mount
        # scope, so the key carries its mount prefix — marketplace-ui writes
        # each app's entry to apps/<name> on the `apps` KV mount.
        key: apps/open-webui
