apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: synch

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: synch

configMapGenerator:
- name: synch
  envs:
  - synch.env

resources:
- namespace.yaml
- pvc.yaml
- service.yaml
- deployment.yaml
- externalsecret.yaml
