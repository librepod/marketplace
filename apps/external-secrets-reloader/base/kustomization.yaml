apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` transformer, by design: the vendored bundle already ships
# every namespaced resource in 'external-secrets-reloader' — this app's own
# name — so nothing needs rewriting. Adding one would additionally stamp the
# cluster-scoped Config CR, a field the API server silently drops.
resources:
- namespace.yaml
- bundle.yaml
- config.yaml
