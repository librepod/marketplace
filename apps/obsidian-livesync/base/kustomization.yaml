# Based on this guide: https://github.com/vrtmrz/obsidian-livesync/blob/main/docs/setup_own_server.md?plain=1
#
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: obsidian-livesync

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: obsidian-livesync

configMapGenerator:
- name: obsidian-livesync
  envs:
  - obsidian-livesync.env
- name: couchdb-init-script
  files:
  - init-script.sh
  options:
    disableNameSuffixHash: true
    # The script interpolates shell variables (${hostname}, ${password}, …) that
    # must be expanded at RUNTIME from the job's env — never by Flux's
    # postBuild.substitute, which would blank them. This annotation opts the
    # generated ConfigMap out of Flux variable substitution entirely.
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled

resources:
- namespace.yaml
- externalsecret.yaml
- pvc.yaml
- service.yaml
- job.yaml
- deployment.yaml
