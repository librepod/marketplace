apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-livesync
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      enableServiceLinks: false
      containers:
        - name: couchdb
          image: couchdb
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: obsidian-livesync
            # Settings Secret synced by ESO from OpenBao (externalsecret.yaml):
            # non-optional — the pod waits (CreateContainerConfigError) until it
            # exists. LAST in envFrom so its values override .env defaults.
            # Supplies COUCHDB_PASSWORD and COUCHDB_SECRET (names match), which
            # the liveness/readiness probes below expand at runtime. Never
            # rotate them: CouchDB persists the admin-password hash in its
            # data PVC, so a changed value is a permanent lockout.
            - secretRef:
                name: obsidian-livesync-settings
          ports:
            - containerPort: 5984
              name: http
          volumeMounts:
            - name: couchdb-data
              mountPath: /opt/couchdb/data
            - name: couchdb-config
              mountPath: /opt/couchdb/etc/local.d
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -s -f -u "$COUCHDB_USER:$COUCHDB_PASSWORD" http://localhost:5984/_up
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -s -f -u "$COUCHDB_USER:$COUCHDB_PASSWORD" http://localhost:5984/_up
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: couchdb-data
          persistentVolumeClaim:
            claimName: obsidian-livesync-data
        - name: couchdb-config
          persistentVolumeClaim:
            claimName: obsidian-livesync-config
        - name: couchdb-init-script
          configMap:
            name: couchdb-init-script
            defaultMode: 0755
