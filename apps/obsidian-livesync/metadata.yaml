apiVersion: marketplace/v1
kind: AppDefinition
metadata:
  name: obsidian-livesync
spec:
  displayName: "Obsidian LiveSync"
  description: "Self-hosted synchronization server for Obsidian notes"
  icon: "https://obsidian.md/images/obsidian-logo-gradient.svg"
  category: "Productivity"
  website: "https://github.com/vrtmrz/obsidian-livesync"

  # renovate: datasource=docker depName=couchdb
  version: "3.5.1"

  source:
    type: oci-kustomize
    url: "oci://ghcr.io/librepod/marketplace/apps/obsidian-livesync"
    path: ./overlays/librepod

  # Generate-only settings (never shown in the install dialog): on reinstall the
  # stored values are reused. This app has NO converge/self-healing container —
  # CouchDB persists the admin-password hash in its NFS-surviving data dir, so a
  # changed COUCHDB_PASSWORD locks every client out permanently. Treat both
  # values as immutable once installed.
  settings:
    items:
      - name: COUCHDB_PASSWORD
        label: "CouchDB admin password"
        description: "Admin password for the embedded CouchDB (user: admin). Generated once per install — do NOT change: CouchDB keeps the old hash in its persistent data, so a new value locks all synced clients out with no recovery path."
        sensitive: true
        generate:
          length: 32
      - name: COUCHDB_SECRET
        label: "CouchDB cookie secret"
        description: "Secret used to sign CouchDB session cookies. Generated once per install — changing it invalidates all active sync sessions."
        sensitive: true
        generate:
          length: 32

  dependencies:
    required:
      - kind: IngressController
        description: "Traefik (provided by bootstrap)"
      - kind: StorageClass
        description: "nfs-client (provided by bootstrap)"

  templates:
    source: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: marketplace-obsidian-livesync
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "obsidian-livesync"
      spec:
        interval: 10m
        url: oci://ghcr.io/librepod/marketplace/apps/obsidian-livesync
        ref:
          tag: "__VERSION__"
    release: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: marketplace-obsidian-livesync
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "obsidian-livesync"
      spec:
        interval: 10m
        targetNamespace: obsidian-livesync
        sourceRef:
          kind: OCIRepository
          name: marketplace-obsidian-livesync
        path: ./overlays/librepod
        prune: true
        wait: true
        postBuild:
          substitute:
            BASE_DOMAIN: "${BASE_DOMAIN}"
    kustomization: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - source.yaml
        - release.yaml
