apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: superplane
spec:
  interval: 12h
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  # An OCIRepository chart source is referenced via chartRef, not chart.spec.
  chartRef:
    kind: OCIRepository
    name: superplane-helm-charts
  valuesFrom:
    - kind: Secret
      name: superplane-settings
      valuesKey: DB_PASSWORD
      targetPath: database.password
    - kind: Secret
      name: superplane-settings
      valuesKey: RABBITMQ_PASSWORD
      targetPath: rabbitmq.password
  values:
    # Control plane only: no runners, no fleet manager.
    fleetManagerSetup:
      enabled: false
    authentication:
      github:
        enabled: false
      google:
        enabled: false
    telemetry:
      opentelemetry:
        enabled: false
    installation:
      beaconEnabled: false
    # Credentials come from OpenBao via the ExternalSecrets, never chart defaults.
    session:
      secretName: superplane-settings
    jwt:
      secretName: superplane-settings
    encryption:
      secretName: superplane-settings
    oidc:
      secretName: superplane-oidc
    # The default {} leaves the app pods without a numeric user, so kubelet
    # rejects the runAsNonRoot wait-for-migrate init container (image user is
    # "nobody"). Same values as the chart's migrate pod; fsGroup makes the
    # blob PVC writable for 65534.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    database:
      local:
        # Chart defaults (1000 / 1024MB) are sized for a cloud VM, not a home
        # device; the three app pods open 15 pooled connections in total.
        maxConnections: "100"
        sharedBuffers: 128MB
