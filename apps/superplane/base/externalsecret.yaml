apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: superplane-settings
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: superplane-settings
    # Deviation from the standard form: SuperPlane wants its master key as
    # env://<id>:<base64 of 32 bytes>, which the hex generator cannot emit.
    # Derive it here from the generated 32-char seed (same shape as upstream's
    # Terraform installer); Merge keeps every extracted key alongside it.
    template:
      mergePolicy: Merge
      data:
        ENCRYPTION_MASTER_KEYS: 'env://initial:{{ .ENCRYPTION_MASTER_KEY | b64enc }}'
  dataFrom:
    - extract:
        # The full entry is <mount>/<name>; ESO accepts the mount-prefixed key
        # and strips the leading store path.
        key: apps/superplane
---
# RSA signing key for SuperPlane's own OIDC tokens (not user SSO). Settings can
# only generate hex, so ESO mints the key in-cluster once and never refreshes
# it. dataFrom is only there because ESO requires a source; none of it is used.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: superplane-oidc
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: superplane-oidc
    template:
      data:
        oidc.pem: '{{ genPrivateKey "rsa" }}'
  dataFrom:
    - extract:
        key: apps/superplane
