apiVersion: marketplace/v1
kind: AppDefinition
metadata:
  name: superplane
spec:
  displayName: "SuperPlane"
  description: "Workflow control plane with an AI software factory that turns issues into pull requests"
  icon: "https://raw.githubusercontent.com/superplanehq/superplane/main/web_src/src/assets/superplane-icon.png"
  category: "Development"
  website: "https://superplane.com"

  # Chart and app ship in lockstep (chart 1.0.0-rc3 bakes image v1.0.0-rc3), so
  # this tracks the chart pin in base/ocirepository.yaml.
  # renovate: datasource=docker depName=ghcr.io/superplanehq/superplane-chart
  version: "1.0.0-rc3"

  source:
    type: oci-kustomize
    url: "oci://ghcr.io/librepod/marketplace/apps/superplane"
    path: ./overlays/librepod

  settings:
    items:
      - name: DB_PASSWORD
        sensitive: true
        generate:
          length: 32
      - name: RABBITMQ_PASSWORD
        sensitive: true
        generate:
          length: 32
      - name: SESSION_SECRET
        sensitive: true
        generate:
          length: 64
      - name: JWT_SECRET
        sensitive: true
        generate:
          length: 64
      # 32 chars = the 32 key bytes ENCRYPTION_MASTER_KEYS is built from
      # (base/externalsecret.yaml). Never rotate: it decrypts stored data.
      - name: ENCRYPTION_MASTER_KEY
        sensitive: true
        generate:
          length: 32

  dependencies:
    required:
      - kind: IngressController
        description: "Traefik (provided by traefik app)"
      - kind: StorageClass
        description: "nfs-client (provided by nfs-provisioner app)"

  templates:
    source: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: marketplace-superplane
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "superplane"
      spec:
        interval: 10m
        url: oci://ghcr.io/librepod/marketplace/apps/superplane
        ref:
          tag: "__VERSION__"
    release: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: marketplace-superplane
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "superplane"
      spec:
        dependsOn:
          - name: traefik
          - name: storage
        force: true
        interval: 1h
        retryInterval: 2m
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: marketplace-superplane
        path: ./overlays/librepod
        prune: true
        wait: true
        postBuild:
          substitute:
            BASE_DOMAIN: "${BASE_DOMAIN}"
    kustomization: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - source.yaml
        - release.yaml
