# The bootstrap Job creates exactly one Kubernetes object: the
# step-certificates-provisioner-password Secret (password + kid + caBundle)
# consumed by step-issuer's StepClusterIssuer. Everything else it produces
# goes to the openbao KV store.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: step-ca-bootstrap-step-issuer
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
