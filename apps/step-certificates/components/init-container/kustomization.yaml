apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  # ServiceAccount under which the Deployment (and its init container) runs;
  # used for the openbao CA-backup restore login.
  - serviceaccount.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  # ConfigMap for the init script – mounted by the custom initContainer
  # defined in spec.values.extraInitContainers in helmrelease.yaml.
  - name: step-ca-init-script
    files:
      - step-ca-init.sh=script.sh
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled

  # ConfigMap for environment variables
  - name: step-ca-init-env
    envs:
      - init-container.env

# NOTE: the initContainer is declared natively via spec.values.extraInitContainers
# in the HelmRelease — no Deployment patch needed here.
