apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

images:
  # No renovate annotation needed: depName == image name (renovate/renovate),
  # so Renovate's native kustomize manager bumps this tag directly. The
  # matching spec.version bump is driven by the # renovate: comment in
  # metadata.yaml; both share depName=renovate/renovate → one grouped PR.
  - name: renovate/renovate
    newTag: "44.14.1"

patches:
  - path: ./patch-storage-class.yaml
    target:
      kind: PersistentVolumeClaim
