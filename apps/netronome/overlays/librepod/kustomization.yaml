apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: netronome

resources:
- ../../base
- ingressroute.yaml
- ssoclient.yaml
- externalsecret-ca.yaml

images:
- name: ghcr.io/autobrr/netronome
  newTag: v0.15.0

patches:
- path: ./patch-storage-class.yaml
  target:
    kind: PersistentVolumeClaim
- path: ./deployment-ca-patch.yaml
  target:
    kind: Deployment
    name: netronome
