apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: traefik
  values:
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              # The redirect router's default priority is MaxInt32-1 (beats
              # everything). Lower it so a route that must serve plain http —
              # the marketplace-ui raw-IP front door (see
              # apps/marketplace-ui/overlays/librepod/ingressroute-ip.yaml,
              # priority 200) — can outrank it. Named-host routes keep default
              # rule-length priority (<100) and still redirect to https.
              priority: 100
      # WireGuard UDP 51820 entryPoint. Exposed via this Traefik LoadBalancer
      # Service (host:51820 UDP — the same mechanism as 80/443) and routed by
      # the wg-easy IngressRouteUDP to the wg-easy-wireguard Service, so on-LAN
      # clients reach wg-easy at <device-ip>:51820 without hostNetwork/hostPort
      # on the app pod. Remote clients use the FRP relay -> wg-easy-wireguard
      # ClusterIP Service (no Traefik).
      wireguard:
        port: 51820
        exposedPort: 51820
        expose:
          default: true
        protocol: UDP
      # SSH TCP 2222 entryPoint for Git-over-SSH (gogs). Port 22 is taken by
      # the host's own sshd, so Git SSH is exposed on 2222 via the same
      # LoadBalancer mechanism as 80/443 and routed by the gogs
      # IngressRouteTCP to the gogs Service.
      ssh:
        port: 2222
        exposedPort: 2222
        expose:
          default: true
        protocol: TCP

    providers:
      kubernetesCRD:
        allowExternalNameServices: true
        allowCrossNamespace: true

    priorityClassName: "system-cluster-critical"

    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"

    logs:
      access:
        enabled: true
