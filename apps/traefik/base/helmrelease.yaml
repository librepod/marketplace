apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: traefik
  values:
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      # WireGuard UDP 51820 entryPoint. Exposed via this Traefik LoadBalancer
      # Service (host:51820 UDP — the same mechanism as 80/443) and routed by
      # the wg-easy IngressRouteUDP to the wg-easy-wireguard Service, so on-LAN
      # clients reach wg-easy at <device-ip>:51820 without hostNetwork/hostPort
      # on the app pod. Remote clients use the FRP relay -> wg-easy-wireguard
      # ClusterIP Service (no Traefik).
      wireguard:
        port: 51820
        exposedPort: 51820
        expose: true
        protocol: udp

    providers:
      kubernetesCRD:
        allowExternalNameServices: true
        allowCrossNamespace: true

    priorityClassName: "system-cluster-critical"

    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"

    logs:
      access:
        enabled: true
