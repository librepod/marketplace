apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  chart:
    spec:
      chart: external-secrets
      # HTTP Helm repo: pin the chart minor here. 2.11.x tracks app v2.11.x;
      # patch updates flow, minors/majors are manual.
      version: "~2.11.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets-helm-charts
      interval: 12h
  # No values overrides — and deliberately no image.tag: external-secrets
  # versions chart and app in lockstep (chart 2.11.x bakes image v2.11.x), so
  # the chart pin above IS the app-version pin; an override would be a second
  # anchor to drift. The datasource=helm renovate annotation on metadata
  # spec.version is correct here for the same reason (chart line == app line).
  # values: {} — explicit empty map so the strategic merge leaves base values
  # (installCRDs, replicaCount) intact; a bare `values:` (null) would delete them.
  values: {}
