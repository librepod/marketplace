apiVersion: marketplace/v1
kind: AppDefinition
metadata:
  name: external-secrets
spec:
  displayName: "External Secrets Operator"
  description: "Kubernetes operator that synchronizes secrets from external secret stores (such as OpenBao) into native Kubernetes Secrets"
  icon: "https://raw.githubusercontent.com/external-secrets/external-secrets/main/assets/eso-logo-large.png"
  category: "Infrastructure"
  website: "https://external-secrets.io"

  # renovate: datasource=helm depName=external-secrets registryUrl=https://charts.external-secrets.io
  # serge: notesRepo=external-secrets/external-secrets
  version: "2.11.0"

  source:
    type: oci-kustomize
    url: "oci://ghcr.io/librepod/marketplace/apps/external-secrets"
    path: ./overlays/librepod

  params:
    required:
      - name: BASE_DOMAIN
        description: "Base domain for the cluster (unused by this app; kept for install-template consistency)"
        type: string
        example: "example.com"

  dependencies:
    required: []

  templates:
    source: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: marketplace-external-secrets
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "external-secrets"
      spec:
        interval: 10m
        url: oci://ghcr.io/librepod/marketplace/apps/external-secrets
        ref:
          tag: "__VERSION__"
    release: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: marketplace-external-secrets
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "external-secrets"
      spec:
        interval: 1h
        retryInterval: 2m
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: marketplace-external-secrets
        path: ./overlays/librepod
        prune: true
        wait: true
        postBuild:
          substitute:
            BASE_DOMAIN: "${BASE_DOMAIN}"
    kustomization: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - source.yaml
        - release.yaml
