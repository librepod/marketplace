apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: 2.2.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  interval: 50m
  install:
    # RetryOnFailure: a failed install (e.g. --wait timing out on slow image
    # pulls through flaky egress) is retried as an upgrade instead of wedging
    # terminal in Stalled/RetriesExceeded (repo convention; see
    # apps/oauth2-proxy/overlays/librepod/helmrelease.yaml).
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  # Default values
  # https://github.com/external-secrets/external-secrets/blob/main/deploy/charts/external-secrets/values.yaml
  values:
    installCRDs: true
