# No oauth2-proxy forward-auth middlewares on purpose: the panel enforces
# its own auth (first login registers the admin; Telegram login widget)
# and node agents need unauthenticated WebSocket access to
# /api/v2/agent/ws, which forward-auth would break.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: remnawave-admin
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    match: Host(`remnawave-admin.${BASE_DOMAIN:=libre.pod}`) && PathPrefix(`/api`)
    priority: 100
    services:
    - name: remnawave-admin-web-backend
      port: 8081
  - kind: Rule
    match: Host(`remnawave-admin.${BASE_DOMAIN:=libre.pod}`) && PathPrefix(`/ws`)
    priority: 100
    services:
    - name: remnawave-admin-web-backend
      port: 8081
  - kind: Rule
    match: Host(`remnawave-admin.${BASE_DOMAIN:=libre.pod}`)
    priority: 1
    services:
    - name: remnawave-admin-web-frontend
      port: 80
