apiVersion: v1
kind: Service
metadata:
  name: remnawave-admin-db
  labels:
    app.kubernetes.io/name: remnawave-admin
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: remnawave-admin
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
