apiVersion: apps/v1
kind: Deployment
metadata:
  name: remnawave-admin-bot
spec:
  replicas: 1
  strategy:
    # Two bot instances polling Telegram collide on getUpdates; never surge
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: bot
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bot
    spec:
      containers:
        - name: remnawave-admin-bot
          image: ghcr.io/case211/remnawave-admin
          imagePullPolicy: IfNotPresent
          ports:
            # Receives Remnawave panel webhooks; ClusterIP-only, never ingressed
            - name: webhook
              containerPort: 8080
          env:
            # DATABASE_URL is composed from the generated DB_PASSWORD; kubelet
            # expands $(VAR) from earlier entries in this same list
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: remnawave-admin-settings
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: postgresql://remnawave:$(DB_PASSWORD)@remnawave-admin-db:5432/remnawave_bot
          envFrom:
            - configMapRef:
                name: remnawave-admin
            - secretRef:
                name: remnawave-admin-settings # LAST: overrides .env defaults
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: geoip
              mountPath: /app/geoip
      volumes:
        - name: logs
          emptyDir: {}
        - name: geoip
          # GeoLite2 databases download at startup when MAXMIND_LICENSE_KEY is
          # set; re-downloading after a pod restart is fine
          emptyDir: {}
# No probes: the bot runs DB migrations before serving (upstream start_period
# is 180s); a liveness probe during that window would kill it mid-migration.
