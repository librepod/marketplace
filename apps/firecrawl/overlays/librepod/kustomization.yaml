apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: firecrawl

resources:
- ../../base
- ingressroute.yaml

images:
- name: ghcr.io/firecrawl/firecrawl
  newTag: "2.11.805" # renovate: datasource=docker depName=ghcr.io/firecrawl/firecrawl
# playwright-service and nuq-postgres are only ever published as :latest
# (rebuilt on every upstream push to main) — digest-pinned for
# reproducibility; renovate refreshes the digests.
- name: ghcr.io/firecrawl/playwright-service
  # renovate: datasource=docker depName=ghcr.io/firecrawl/playwright-service
  digest: sha256:227ce3d8059173925a5a0697c63a1e947662cca934a609151651f578774edd5d
- name: ghcr.io/firecrawl/nuq-postgres
  # renovate: datasource=docker depName=ghcr.io/firecrawl/nuq-postgres
  digest: sha256:d719b36160eac2fcbe16dc7e7360ddb9c82c40ea5da183d07bf4a755c6a0b2ae
- name: valkey/valkey
  newTag: 8.1-alpine # renovate: datasource=docker depName=valkey/valkey
- name: rabbitmq
  newTag: 3.13-management # renovate: datasource=docker depName=rabbitmq

patches:
- path: ./patch-storage-class.yaml
  target:
    kind: PersistentVolumeClaim
    name: firecrawl-data
