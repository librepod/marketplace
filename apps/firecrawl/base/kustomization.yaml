apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: firecrawl

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: firecrawl

configMapGenerator:
- name: firecrawl
  envs:
  - firecrawl.env
- name: playwright-service
  envs:
  - playwright.env

resources:
- namespace.yaml
- service.yaml
- deployment.yaml
- playwright.yaml
- externalsecret.yaml

# Bundled third-party service units (postgres/valkey/rabbitmq) — mandatory,
# included per the image-ownership criterion in the librepod-app skill
# (vendor fabric stays in base/; generic infra images go to components/).
# They inherit this kustomization's namespace; labels/selectors are hardcoded
# inside each component (a transformer there would hoist to the overlay root).
components:
- ../components/postgres
- ../components/valkey
- ../components/rabbitmq
