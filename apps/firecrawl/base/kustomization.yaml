apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: firecrawl

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: firecrawl

configMapGenerator:
- name: firecrawl
  envs:
  - firecrawl.env
- name: playwright-service
  envs:
  - playwright.env

resources:
- namespace.yaml
- service.yaml
- deployment.yaml
- playwright.yaml
- externalsecret.yaml

# Bundled third-party service units (placement rule: librepod-app skill).
components:
- ../components/postgres
- ../components/valkey
- ../components/rabbitmq
