# Cache/rate-limit store. Upstream's compose ships a commented-out valkey line
# as the open-source alternative to redis; LibrePod standardizes on valkey.
# --bind 0.0.0.0 is load-bearing (loopback-only default otherwise), same as the
# upstream redis command. No persistence flags: rate-limit state is disposable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    app.kubernetes.io/component: valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/component: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey
          imagePullPolicy: IfNotPresent
          args: ["valkey-server", "--bind", "0.0.0.0"]
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels:
    app.kubernetes.io/component: valkey
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: valkey
      protocol: TCP
      name: valkey
  selector:
    app.kubernetes.io/component: valkey
