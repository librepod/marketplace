# Headless-Chromium scraping engine (upstream apps/playwright-service-ts).
# Compose runs it with cap_drop ALL + no-new-privileges and the default 64MB
# /dev/shm — mirrored here; if Chromium ever crashes with shm exhaustion, add
# a Memory medium emptyDir at /dev/shm.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-service
  labels:
    app.kubernetes.io/component: playwright
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: playwright
  template:
    metadata:
      labels:
        app.kubernetes.io/component: playwright
    spec:
      containers:
        - name: playwright-service
          image: ghcr.io/firecrawl/playwright-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: playwright-service
            # Upstream passes PROXY_* through to this container too; envFrom on
            # the settings Secret keeps that path open for custom variables.
            - secretRef:
                name: firecrawl-settings
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: playwright-service
  labels:
    app.kubernetes.io/component: playwright
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: playwright
