# API + workers in one container: the harness supervisor boots the HTTP API and
# all queue workers (upstream `node dist/src/harness.js --start-docker`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl
  labels:
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      initContainers:
        # Compose `depends_on`: wait for every backing service before the
        # harness boots (it has a 60s startup budget and does not retry fast).
        - name: wait-for-dependencies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              until nc -z valkey 6379 \
                 && nc -z rabbitmq 5672 \
                 && nc -z nuq-postgres 5432 \
                 && nc -z playwright-service 3000; do
                echo "waiting for backing services"; sleep 2
              done
      containers:
        - name: firecrawl
          image: ghcr.io/firecrawl/firecrawl
          imagePullPolicy: IfNotPresent
          args: ["node", "dist/src/harness.js", "--start-docker"]
          ports:
            - name: http
              containerPort: 3002
          env:
            # Stored as DB_PASSWORD in OpenBao; the env name differs, so it
            # rides an explicit secretKeyRef (explicit env wins over envFrom).
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firecrawl-settings
                  key: DB_PASSWORD
          envFrom:
            - configMapRef:
                name: firecrawl
            - secretRef:
                name: firecrawl-settings
          readinessProbe:
            httpGet:
              path: /v0/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /v0/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /v0/health/readiness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
