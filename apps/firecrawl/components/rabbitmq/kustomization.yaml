apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Bundled third-party service unit (image-ownership criterion — see the
# librepod-app skill). No labels/namespace transformers here: a transformer
# declared inside a component hoists to the composing overlay root. Both label
# pairs are hardcoded in the resources; the namespace comes from base.
resources:
- rabbitmq.yaml
