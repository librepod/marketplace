apiVersion: apps/v1
kind: Deployment
metadata:
  name: nuq-postgres
  labels:
    app.kubernetes.io/name: firecrawl
    app.kubernetes.io/component: nuq-postgres
spec:
  replicas: 1
  # Single writer on NFS: a RollingUpdate surge pod would mount the same NFS
  # export while the old postmaster still runs — two writers, one data dir.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: firecrawl
      app.kubernetes.io/component: nuq-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firecrawl
        app.kubernetes.io/component: nuq-postgres
    spec:
      containers:
        - name: nuq-postgres
          image: ghcr.io/firecrawl/nuq-postgres
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # Stored as DB_PASSWORD in OpenBao; env name differs → secretKeyRef.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firecrawl-settings
                  key: DB_PASSWORD
          envFrom:
            - configMapRef:
                name: nuq-postgres
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
        # NFS rebound volumes outlive their PVC: POSTGRES_PASSWORD only applies
        # at initdb, so a reinstalled app with a fresh DB_PASSWORD would be
        # locked out by the old data dir. This sidecar converges the stored
        # password to the declared one on every boot (loopback trust).
        - name: converge-db-password
          image: ghcr.io/firecrawl/nuq-postgres
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nuq-postgres
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firecrawl-settings
                  key: DB_PASSWORD
          command: ["/bin/sh", "-c"]
          args:
            - |
              until psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c '\q' 2>/dev/null; do
                sleep 1
              done
              printf "ALTER USER %s PASSWORD :'pw';\n" "$POSTGRES_USER" | \
                psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                  -v on_error_stop=1 -v pw="$POSTGRES_PASSWORD"
              while sleep 3600; do :; done
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: firecrawl-data
