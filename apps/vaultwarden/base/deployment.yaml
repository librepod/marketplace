apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vaultwarden
            # Settings Secret — DELIBERATE DEVIATION from the non-optional
            # convention: every vaultwarden settings item is optional, and an
            # install that leaves them all empty writes an EMPTY OpenBao entry.
            # ESO's dataFrom.extract maps an empty entry to "nothing to sync"
            # and creates no Secret, so a non-optional ref would block the
            # container forever (CreateContainerConfigError). Optional lets the
            # pod boot on the .env defaults; with values set (ADMIN_TOKEN,
            # custom vars) ESO creates the Secret and it still wins — it stays
            # last in envFrom.
            - secretRef:
                name: vaultwarden-settings
                optional: true
          env:
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-sso
                  key: SSO_CLIENT_ID
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-sso
                  key: SSO_CLIENT_SECRET
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 0
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 0
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 0
            failureThreshold: 30
            timeoutSeconds: 1
            periodSeconds: 5
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
