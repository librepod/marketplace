apiVersion: marketplace/v1
kind: AppDefinition
metadata:
  name: vaultwarden
spec:
  displayName: "Vaultwarden"
  description: "Lightweight Bitwarden-compatible password manager server"
  icon: "https://raw.githubusercontent.com/dani-garcia/vaultwarden/main/resources/vaultwarden-icon.svg"
  category: "Security"
  website: "https://github.com/dani-garcia/vaultwarden"

  # renovate: datasource=docker depName=vaultwarden/server
  # serge: notesRepo=dani-garcia/vaultwarden
  version: "1.37.0"

  source:
    type: oci-kustomize
    url: "oci://ghcr.io/librepod/marketplace/apps/vaultwarden"
    path: ./overlays/librepod

  # vaultwarden is env-var-driven: the settings Secret is LAST in envFrom, so
  # custom environment variables override the .env defaults — power users win.
  settings:
    allowCustom: true
    items:
      - name: ADMIN_TOKEN
        label: "Admin auth token"
        description: "Admin token which enables  the Admin page at /admin. Read more here: https://github.com/dani-garcia/vaultwarden/wiki/Enabling-admin-page#secure-the-admin_token"
        sensitive: true
        required: false

  dependencies:
    required:
      - kind: IngressController
        description: "Traefik (provided by bootstrap)"
      - kind: StorageClass
        description: "nfs-client (provided by bootstrap)"
      - kind: SSOProvider
        description: "Casdoor SSO (provided by casdoor-sso-controller)"

  templates:
    source: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: marketplace-vaultwarden
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "vaultwarden"
      spec:
        interval: 10m
        url: oci://ghcr.io/librepod/marketplace/apps/vaultwarden
        ref:
          tag: "__VERSION__"
    release: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: marketplace-vaultwarden
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "vaultwarden"
      spec:
        dependsOn:
          - name: casdoor-sso-controller
        interval: 10m
        targetNamespace: vaultwarden
        sourceRef:
          kind: OCIRepository
          name: marketplace-vaultwarden
        path: ./overlays/librepod
        prune: true
        wait: true
        postBuild:
          substitute:
            BASE_DOMAIN: "${BASE_DOMAIN}"
    kustomization: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - source.yaml
        - release.yaml
