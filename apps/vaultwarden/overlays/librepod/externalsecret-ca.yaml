# LibrePod private CA (root + intermediate), synced by the External Secrets
# Operator from the openbao KV store (apps/step-ca — published by the
# openbao bootstrap Job) into a Secret in this namespace. The CA-trust
# patches mount it by this exact name. See docs/sso-app-author-guide.md §4.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: step-certificates-certs
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: step-certificates-certs
    creationPolicy: Owner
  data:
    - secretKey: root_ca.crt
      remoteRef:
        key: apps/step-ca
        property: root_ca.crt
    - secretKey: intermediate_ca.crt
      remoteRef:
        key: apps/step-ca
        property: intermediate_ca.crt
