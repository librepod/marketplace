apiVersion: apps/v1
kind: Deployment
metadata:
  name: remnawave-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: remnawave-postgres-env
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            # Single mount at /var/lib/postgresql (not .../data): postgres 18
            # images store data in versioned subdirs (18/docker) and hard-error
            # on a volume mounted at the legacy .../data path. Matches upstream
            # compose.
            - name: postgres-data
              mountPath: /var/lib/postgresql
            - name: shm
              mountPath: /dev/shm
        # NFS-backed PVCs survive uninstall (a same-named PVC rebinds to the
        # old folder), but POSTGRES_PASSWORD only takes effect at initdb — so
        # a reinstall that generates a fresh password is rejected by the old
        # data dir (Prisma P1000 on the app side). This container converges the
        # stored password to the declared one on every boot: the official
        # postgres image trusts loopback connections (pg_hba: 127.0.0.1/::1
        # trust), and containers in one pod share a network namespace, so no
        # old password is needed. Also self-heals future secret rotation.
        # SQL goes via stdin because psql does not expand :'vars' inside -c;
        # $VAR without braces so Flux postBuild substitution leaves it alone.
        - name: converge-db-password
          image: postgres
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: remnawave-postgres-env
          command: ["/bin/sh", "-c"]
          args:
            - |
              until psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c '\q' 2>/dev/null; do
                sleep 1
              done
              printf "ALTER USER %s PASSWORD :'pw';\n" "$POSTGRES_USER" | \
                psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                  -v on_error_stop=1 -v pw="$POSTGRES_PASSWORD"
              while sleep 3600; do :; done
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: remnawave-postgres-data
        # Upstream compose sets shm_size: 512mb; k8s defaults /dev/shm to 64Mi.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
