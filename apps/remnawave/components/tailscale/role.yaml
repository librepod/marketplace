apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remnawave-tailscale
rules:
  # Mirrors apps/tailscale/base/role.yaml, pinned to this component's state
  # secret instead of the "tailscale" default name.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["remnawave-tailscale-state"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "create", "patch"]
