# No oauth2-proxy forward-auth middlewares: the panel handles authentication
# itself (password login + native OIDC via the "generic" provider — see
# ssoclient.yaml and docs/sso-setup.md). Gating the panel behind forward-auth
# would also break the OAuth2 redirect dance and the /api/sub subscription
# endpoint polled by VPN clients.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: remnawave
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    match: Host(`remnawave.${BASE_DOMAIN:=libre.pod}`)
    priority: 1
    services:
    - name: remnawave
      port: 80
