apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- ingressroute.yaml
- ssoclient.yaml
- externalsecret-ca.yaml

components:
- ../../components/postgres
# Optional tailscale sidecar (panel originates traffic into an external
# tailnet via kernel TUN) — disabled by default. Per-install enablement
# without editing this app: add ../../components/tailscale to spec.components
# of the install's release.yaml (user-apps repo; paths are relative to
# spec.path). Uncomment here only when building from a git checkout — never
# both, kustomize rejects the double add.
# - ../../components/tailscale

namespace: remnawave

images:
- name: remnawave/backend
  newTag: "3.4.3"
- name: postgres
  newTag: "18.4-alpine"
- name: valkey/valkey
  newTag: "9-alpine"

patches:
- path: ./patch-storage-class.yaml
  target:
    kind: PersistentVolumeClaim
# Inject the LibrePod root+intermediate CA trust (init container + volumes) into
# the remnawave container so its server-side OIDC token exchange to
# id.${BASE_DOMAIN} passes TLS verification (see deployment-ca-patch.yaml).
- path: ./deployment-ca-patch.yaml
