apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- ingressroute.yaml
- ssoclient.yaml
- externalsecret-ca.yaml

components:
- ../../components/postgres

namespace: remnawave

images:
- name: remnawave/backend
  newTag: "3.4.3"
- name: postgres
  newTag: "18.4-alpine"
- name: valkey/valkey
  newTag: "9-alpine"

patches:
- path: ./patch-storage-class.yaml
  target:
    kind: PersistentVolumeClaim
# Inject the LibrePod root+intermediate CA trust (init container + volumes) into
# the remnawave container so its server-side OIDC token exchange to
# id.${BASE_DOMAIN} passes TLS verification (see deployment-ca-patch.yaml).
- path: ./deployment-ca-patch.yaml
