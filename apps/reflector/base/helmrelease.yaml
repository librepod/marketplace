apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
spec:
  releaseName: reflector
  chartRef:
    kind: OCIRepository
    name: reflector
  interval: 12h
  install:
    # RetryOnFailure: a failed install (e.g. --wait timing out on slow image
    # pulls through flaky egress) is retried as an upgrade instead of wedging
    # terminal in Stalled/RetriesExceeded (repo convention; see
    # apps/oauth2-proxy/overlays/librepod/helmrelease.yaml).
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  # Default values
  # https://github.com/emberstack/kubernetes-reflector/blob/main/src/helm/values.yaml
  values: {}
