apiVersion: apps/v1
kind: Deployment
metadata:
  name: headplane
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headplane
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headplane
    spec:
      initContainers:
        # Generates a 32-character random cookie secret on first boot.
        # Only writes if the file doesn't exist yet (preserves value across pod restarts).
        - name: generate-cookie-secret
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              if [ ! -s /var/lib/headplane/cookie_secret ]; then
                head -c 24 /dev/urandom | base64 | head -c 32 > /var/lib/headplane/cookie_secret
                echo "Generated new cookie secret"
              else
                echo "Cookie secret already exists, keeping it"
              fi
          volumeMounts:
            - name: data
              mountPath: /var/lib/headplane
      containers:
        - name: headplane
          image: ghcr.io/tale/headplane
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            # Headplane's own config file.
            - name: config
              mountPath: /etc/headplane/config.yaml
              subPath: config.yaml
            # Persistent storage for internal database, cache, and cookie secret.
            - name: data
              mountPath: /var/lib/headplane
            # Shared Headscale config (read-only) for network/settings view in UI.
            - name: headscale-config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
              readOnly: true
            # OIDC client secret — read via oidc.client_secret_path in config.yaml.
            # Secret/headplane-sso is provisioned by casdoor-sso-controller from
            # the SSOClient CR (ssoclient.yaml). Only the clientSecret key is
            # projected, as "client_secret".
            - name: oidc-secret
              mountPath: /etc/headplane/oidc
              readOnly: true
            # Headscale API key — read via oidc.headscale_api_key_path in
            # config.yaml (v0.6.3 field name). Secret/headscale-api-key is
            # created once per deployment (manual; see the setup comment in the
            # volumes section below). Mounted via subPath into /etc/headscale/.
            # NOTE: the volume is optional so the Deployment itself applies
            # before the Secret exists, but headplane's config validator
            # CRASHES (CrashLoopBackOff) without the key once OIDC is enabled —
            # so in practice you must create the Secret, then rollout restart,
            # before headplane will serve.
            - name: headscale-api-key
              mountPath: /etc/headscale/api_key
              subPath: api_key
              readOnly: true
          # Headplane has no HTTP health endpoint — use TCP socket probes.
          # The image includes /bin/hp_healthcheck for Docker HEALTHCHECK,
          # but TCP probes are simpler and don't require knowing the exact URL.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 0
            failureThreshold: 30
            timeoutSeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: headplane-config
        - name: data
          persistentVolumeClaim:
            claimName: headplane-data
        # References the headscale ConfigMap from the base layer (same namespace).
        - name: headscale-config
          configMap:
            name: headscale-config
        # OIDC client secret (consumed via oidc.client_secret_path).
        - name: oidc-secret
          secret:
            secretName: headplane-sso
            items:
              - key: OIDC_CLIENT_SECRET
                path: client_secret
        # Headscale API key (consumed via oidc.headscale_api_key_path).
        # OPTIONAL: created manually per-deployment, NOT committed. One-time setup:
        #   API_KEY=$(kubectl exec deploy/headscale -n headscale -c headscale -- \
        #               headscale apikeys create --expiration 999d)
        #   kubectl -n headscale create secret generic headscale-api-key \
        #               --from-literal=api_key="$API_KEY"
        #   kubectl rollout restart deploy/headplane -n headscale
        - name: headscale-api-key
          secret:
            secretName: headscale-api-key
            optional: true
            items:
              - key: api_key
                path: api_key
