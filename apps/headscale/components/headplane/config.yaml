# Headplane configuration
#
# Default config: https://github.com/tale/headplane/blob/main/config.example.yaml
#
# Variables like ${BASE_DOMAIN} are substituted by FluxCD postBuild.substitute.
# For local testing: export BASE_DOMAIN=libre.pod && kustomize build ... | envsubst

server:
  host: "0.0.0.0"
  port: 3000
  # External URL — used for OIDC callbacks and cookie domain.
  base_url: "https://headplane.${BASE_DOMAIN:=libre.pod}"
  # Session cookie secret — auto-generated by initContainer on first boot.
  # Stored on the persistent data volume so it survives pod restarts.
  cookie_secret_path: "/var/lib/headplane/cookie_secret"
  cookie_secure: true
  cookie_max_age: 86400
  # Persistent storage for Headplane's internal database and cache.
  data_path: "/var/lib/headplane"

headscale:
  # Internal Kubernetes service URL (same namespace).
  url: "http://headscale:80"
  # Public URL shown in the UI for user-facing links.
  public_url: "https://headscale.${FRP_DOMAIN:=libre.pod}"
  # Read-only access to the Headscale config file (shared ConfigMap from base).
  config_path: "/etc/headscale/config.yaml"
  config_strict: true
  # Headscale API key — REQUIRED for headplane to function and for OIDC
  # (it reads headscale users to link OIDC identities). Read from a file via
  # headplane's whitelisted `api_key_path` secret path, mounted from
  # Secret/headscale-api-key. That Secret is created once per deployment
  # (manual one-time setup, NOT committed) — see deployment.yaml for the
  # procedure. The volume is `optional: true` so headplane still boots before
  # the key exists; SSO is simply inactive until it is added.
  api_key_path: "/etc/headscale/api_key"

# OIDC single sign-on (native headplane support — no oauth2-proxy needed).
# client_id is a literal ("headplane", matching SSOClient.spec.clientId); the
# client secret is read from a file via client_secret_path, mounted from
# Secret/headplane-sso which the casdoor-sso-controller provisions from the
# SSOClient CR in this directory (ssoclient.yaml). issuer uses ${BASE_DOMAIN}
# (standard Flux postBuild.substitute); headplane auto-discovers endpoints
# from /.well-known/openid-configuration. PKCE is S256 (headplane's only mode).
oidc:
  enabled: true
  issuer: "https://id.${BASE_DOMAIN:=libre.pod}"
  client_id: "headplane"
  client_secret_path: "/etc/headplane/oidc/client_secret"
  scope: "openid profile email"
  use_pkce: true
