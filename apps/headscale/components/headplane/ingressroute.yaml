# Headplane IngressRoute — serves the web UI from its own subdomain.
# Previously served under /admin on the headscale domain, now at headplane.${BASE_DOMAIN}.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headplane
  annotations:
    librepod.dev/launch: "/admin"
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`headplane.${BASE_DOMAIN:=libre.pod}`)
      middlewares:
        # 302 the bare root / to /admin — headplane serves its whole UI under
        # /admin, so without this a visit to the host root gets a bare 404.
        - name: headplane-root-redirect
      services:
        - name: headplane
          port: 80
