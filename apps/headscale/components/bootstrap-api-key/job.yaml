apiVersion: batch/v1
kind: Job
metadata:
  name: headscale-bootstrap-api-key
  labels:
    app.kubernetes.io/name: headscale
    app.kubernetes.io/component: bootstrap-api-key
spec:
  backoffLimit: 3
  parallelism: 1
  completions: 1
  # NOTE: deliberately NO ttlSecondsAfterFinished. Letting the Completed Job
  # persist means Flux does NOT recreate it on later reconciles — a TTL-GC'd Job
  # would be rebuilt by Flux and re-run on every reconcile. To re-provision
  # (e.g. after a headscale DB reset invalidates the key), delete BOTH this Job
  # and Secret/headscale-api-key, then `flux reconcile kustomization
  # marketplace-headscale --with-source`: Flux recreates the Job and it mints a
  # fresh key. The script is idempotent, so a stray re-run is a harmless no-op.
  template:
    metadata:
      name: headscale-bootstrap-api-key
      labels:
        app.kubernetes.io/name: headscale
        app.kubernetes.io/component: bootstrap-api-key
    spec:
      restartPolicy: Never
      serviceAccountName: headscale-bootstrap-api-key
      containers:
        - name: bootstrap-api-key
          # bitnami/kubectl ships kubectl matching the cluster version (1.34)
          # and runs as a non-root user. This avoids the download-at-runtime
          # dance (busybox wget redirect handling / apk-needs-root) that rolling
          # our own on alpine would require.
          image: bitnami/kubectl:1.34
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/bootstrap-api-key.sh"]
          envFrom:
            - configMapRef:
                name: cm-headscale-bootstrap-api-key
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: cm-headscale-bootstrap-api-key-script
            items:
              - key: bootstrap-api-key.sh
                path: bootstrap-api-key.sh
        - name: tmp
          emptyDir: {}
