apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

namespace: headscale

resources:
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  - job.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  # Env vars consumed by job.sh via envFrom.
  - name: cm-headscale-bootstrap-api-key
    envs:
      - job.env
  # The mint script. `substitute: disabled` is REQUIRED: the script uses shell
  # parameter expansion (${VAR:-default}), which Flux's postBuild.substitute
  # would otherwise mangle (it treats any ${VAR} as its own substitution and
  # blanks it). The script reads its config from the env ConfigMap at runtime.
  - name: cm-headscale-bootstrap-api-key-script
    files:
      - bootstrap-api-key.sh=job.sh
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
