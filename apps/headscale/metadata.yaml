apiVersion: marketplace/v1
kind: AppDefinition
metadata:
  name: headscale
spec:
  displayName: "Headscale"
  description: "Self-hosted Tailscale control server — one tailnet for all your devices"
  icon: "https://raw.githubusercontent.com/juanfont/headscale/main/docs/logo.png"
  category: "Network"
  website: "https://github.com/juanfont/headscale"

  version: "v0.28.0"

  source:
    type: oci-kustomize
    url: "oci://ghcr.io/librepod/marketplace/apps/headscale"
    path: ./overlays/librepod

  params:
    required:
      - name: BASE_DOMAIN
        description: "Base domain (app will be at headscale.BASE_DOMAIN)"
        type: string
        example: "example.com"
      - name: FRP_DOMAIN
        description: "FRP tunnel domain (public domain for Tailscale client connections)"
        type: string
        example: "vla1.libreport.ru"

  dependencies:
    required:
      - kind: IngressController
        description: "Traefik (provided by bootstrap)"
      - kind: StorageClass
        description: "nfs-client (provided by bootstrap)"
      - kind: SSOProvider
        description: "Casdoor SSO (provided by casdoor-sso-controller)"

  templates:
    source: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: marketplace-headscale
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "headscale"
      spec:
        interval: 10m
        url: oci://ghcr.io/librepod/marketplace/apps/headscale
        ref:
          tag: "v0.28.0"
    release: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: marketplace-headscale
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "headscale"
      spec:
        dependsOn:
          - name: traefik
          - name: storage
          - name: casdoor-sso-controller
        force: true
        interval: 10m
        retryInterval: 2m
        timeout: 5m
        targetNamespace: headscale
        sourceRef:
          kind: OCIRepository
          name: marketplace-headscale
        path: ./overlays/librepod
        prune: true
        wait: true
        # OIDC client_id is a literal in config.yaml and the client secret is
        # read from a file (client_secret_path) mounted from the
        # controller-provisioned Secret/headscale-sso in the headscale namespace.
        # Only ${BASE_DOMAIN}/${FRP_DOMAIN} need Flux substitution — no
        # substituteFrom and no cross-namespace Secret.
        postBuild:
          substitute:
            BASE_DOMAIN: "${BASE_DOMAIN}"
            FRP_DOMAIN: "${FRP_DOMAIN}"
    kustomization: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - source.yaml
        - release.yaml
