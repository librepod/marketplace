apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: headscale
          image: headscale/headscale
          imagePullPolicy: IfNotPresent
          args:
            - serve
          volumeMounts:
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
            - name: data
              mountPath: /var/lib/headscale
            # OIDC client secret, read via oidc.client_secret_path in config.yaml.
            # Secret/headscale-sso is provisioned by casdoor-sso-controller (see
            # overlays/librepod/ssoclient.yaml). The pod stays Pending until the
            # controller writes the Secret — a natural provisioning order.
            - name: oidc-secret
              mountPath: /etc/headscale/oidc
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 0
            failureThreshold: 30
            timeoutSeconds: 1
            periodSeconds: 5
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: derp-stun
              containerPort: 3478
              protocol: UDP
            - name: grpc
              containerPort: 50443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: data
          persistentVolumeClaim:
            claimName: headscale-data
        # OIDC client secret file (consumed via client_secret_path). Only the
        # clientSecret key is projected, as "client_secret".
        - name: oidc-secret
          secret:
            secretName: headscale-sso
            items:
              - key: OIDC_CLIENT_SECRET
                path: client_secret
