# Headscale configuration
#
# Default config (for reference): https://github.com/juanfont/headscale/blob/v0.28.0/config-example.yaml
#
# Settings changed from defaults:
#   server_url         → public URL (internal domain won't work for external clients)
#   listen_addr        → 0.0.0.0:8080 (default is 127.0.0.1, we need all interfaces for k8s)
#   metrics_listen_addr→ 0.0.0.0:9090 (same reason)
#   grpc_listen_addr   → 0.0.0.0:50443 (same reason)
#   derp.server.enabled→ true (default false; embedded DERP relay for regions where Tailscale
#                        DERP servers are unreachable; relay traffic goes through FRP tunnel)
#   derp.urls          → [] (self-hosted relay only; Tailscale's public map not merged)
#   dns.base_domain    → ts.${BASE_DOMAIN} for MagicDNS hostnames
#   dns.nameservers    → 1.1.1.1 only (defaults include v6 Cloudflare too)
#   disable_check_updates → true (not useful in containers)
#
# NOTE: clients only ever select this embedded region as their home DERP if its
# STUN endpoint (UDP, stun_listen_addr's port) answers on the public server_url
# host. Tailscale measures DERP latency with UDP STUN and only falls back to
# HTTPS when UDP is blocked everywhere, and unmeasured regions are never chosen.
# components/frp-upstreams publishes both the HTTPS relay and UDP 3478.
#
# Variables like ${BASE_DOMAIN} are substituted by FluxCD postBuild.substitute.
# For local testing: export BASE_DOMAIN=libre.pod && kustomize build ... | envsubst

# Public URL — must be reachable by Tailscale clients outside the VPN.
# Uses the FRP tunnel domain (not BASE_DOMAIN, which only resolves internally).
server_url: https://headscale.${FRP_DOMAIN}
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: true
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    # The BIND ADDRESS here is overridden at runtime by
    # HEADSCALE_DERP_SERVER_STUN_LISTEN_ADDR in deployment.yaml, which pins it to
    # the pod's own address: a wildcard-bound UDP socket answers with a
    # route-selected source address, which breaks STUN for every client reaching
    # it through a Service. See the long comment on that env var. Only the PORT
    # here is authoritative — headscale advertises it as STUNPort in the DERP
    # map, so it must match the env var and the public port published by
    # components/frp-upstreams.
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
  # No external DERP maps: the embedded region above is the ONLY relay clients
  # get. Tailscale's public map is deliberately not merged, because a reachable
  # region is not necessarily a used one — clients pick the lowest-latency
  # region, and an embedded relay behind a tunnel loses that race to a nearby
  # Tailscale relay (measured: ~44ms through the tunnel vs ~35ms to the nearest
  # public one). Leaving the map empty is what makes every client actually use
  # the self-hosted relay.
  #
  # Consequences, so they are not a surprise:
  #   - every relayed byte crosses the home uplink twice (in through the tunnel
  #     and back out) instead of meeting at a Tailscale relay;
  #   - there is no second relay, so while the tunnel or the relay host is down,
  #     peers that cannot reach each other directly cannot talk at all;
  #   - STUN through an FRP tunnel reports the tunnel client's own private
  #     address, and with no other region to compare against that becomes the
  #     client's GlobalV4 — so hole-punching loses its public-endpoint hint and
  #     direct connections get less likely. Answering STUN on the relay host
  #     itself (public IP, one hop) fixes this and the latency above; the
  #     embedded region only needs the DERP relay leg tunnelled.
  #
  # headscale keeps serving the embedded region here because
  # derp.server.automatically_add_embedded_derp_region defaults to true — an
  # empty urls list with no derp.paths would otherwise be a fatal config.
  urls: []
  auto_update_enabled: true
  update_frequency: 24h

disable_check_updates: true

# ACL policy storage — database mode lets Headplane manage ACLs via the API.
# File mode would require a separate policy.json volume and can't be edited from the UI.
policy:
  mode: database

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

dns:
  magic_dns: true
  # Must be DIFFERENT from server_url domain — headscale enforces this so DERP/DNS routing works.
  # MagicDNS hostnames will be: <hostname>.ts.${BASE_DOMAIN}
  base_domain: ts.${BASE_DOMAIN:=libre.pod}
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
      - 2606:4700:4700::1111
      - 2606:4700:4700::1001
    # Route internal domain queries to Kubernetes CoreDNS — same pattern as wg-easy's
    # INIT_DNS=10.43.0.10. CoreDNS resolves *.libre.pod via Traefik IngressRoutes.
    # Requires subnet routing (10.43.0.0/16) so Tailscale clients can reach CoreDNS.
    split:
      ${BASE_DOMAIN:=libre.pod}:
        - 10.43.0.10

unix_socket: /var/run/headscale/headscale.sock

log:
  level: info
  format: text

# OIDC single sign-on (native headscale support — no oauth2-proxy needed).
# client_id is the public OIDC client id (must equal SSOClient.spec.clientId
# "headscale"). The secret is NOT inlined or Flux-substituted: headscale reads
# it from a file via client_secret_path, mounted from Secret/headscale-sso
# (provisioned by casdoor-sso-controller in this namespace; see deployment.yaml).
# client_secret and client_secret_path are mutually exclusive. issuer uses
# ${BASE_DOMAIN} (standard Flux postBuild.substitute).
oidc:
  issuer: https://id.${BASE_DOMAIN}
  client_id: headscale
  client_secret_path: /etc/headscale/oidc/client_secret
  scope: ["openid", "profile", "email"]
  pkce:
    enabled: true
  email_verified_required: false
