apiVersion: marketplace/v1
kind: AppDefinition
metadata:
  name: frpc
spec:
  displayName: "FRP Client"
  description: "Fast Reverse Proxy client for remote access to cluster services and host SSH"
  icon: "https://raw.githubusercontent.com/fatedier/frp/main/doc/pic/frp.png"
  category: "Network"
  website: "https://github.com/fatedier/frp"

  # renovate: datasource=docker depName=ghcr.io/fatedier/frpc
  # serge: notesRepo=fatedier/frp
  version: "v0.65.0"

  source:
    type: oci-kustomize
    url: "oci://ghcr.io/librepod/marketplace/apps/frpc"
    path: ./overlays/librepod

  # No allowCustom: the only configurable value is the token, and it reaches frp
  # through {{ .Envs.FRP_AUTH_TOKEN }} in frp.toml — custom env vars a toml never
  # references can do nothing.
  settings:
    items:
      - name: FRP_AUTH_TOKEN
        label: "Auth token"
        description: "Authentication token matching the FRP server configuration"
        sensitive: true
        required: true

  dependencies:
    required:
      - kind: Kubernetes
        description: "Kubernetes cluster with CoreDNS"
      - kind: IngressController
        description: "Traefik (provided by traefik app)"
      - kind: AuthProxy
        description: "oauth2-proxy (provided by oauth2-proxy app)"

  templates:
    source: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: frpc
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "frpc"
      spec:
        interval: 10m
        url: oci://ghcr.io/librepod/marketplace/apps/frpc
        ref:
          tag: "__VERSION__"
    release: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: frpc
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "frpc"
      spec:
        dependsOn:
          - name: traefik
          - name: oauth2-proxy
        interval: 1h
        retryInterval: 2m
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: frpc
        path: ./overlays/librepod
        prune: true
        wait: false
        postBuild:
          substitute:
            FRP_SERVER_ADDR: "${FRP_SERVER_ADDR}"
            FRP_SERVER_PORT: "${FRP_SERVER_PORT}"
            FRP_SSH_REMOTE_PORT: "${FRP_SSH_REMOTE_PORT}"
    kustomization: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - source.yaml
        - release.yaml
