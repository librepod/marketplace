serverAddr = "${FRP_SERVER_ADDR}"
serverPort = ${FRP_SERVER_PORT}

# Optional unique identifier for this frpc instance.
# clientID = "${FRP_CLIENT_ID}"
# Proxy name will be changed to {user}.{proxy}
user = "${FRP_USER}"

# frp renders this whole file as a Go template against the container env at
# startup, so the token comes from the frpc-settings Secret (OpenBao) via
# envFrom — it never lands in this ConfigMap.
auth.method = "token"
auth.token = "{{ .Envs.FRP_AUTH_TOKEN }}"

webServer.addr = "0.0.0.0"
webServer.port = 7400
webServer.user = "admin"
webServer.password = "admin"

[[proxies]]
name = "ssh"
type = "tcp"
localIP = "127.0.0.1"
localPort = 22
remotePort = ${FRP_SSH_REMOTE_PORT}

[[proxies]]
name = "wg-easy"
type = "udp"
localIP = "127.0.0.1"
localPort = 51820
remotePort = ${FRP_WG_REMOTE_PORT}
