# Pulls this app's install settings from OpenBao. Written by marketplace-ui at
# install time (answer → default → stored value → generated); synced here by ESO.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frpc-settings
  namespace: frpc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: frpc-settings
  dataFrom:
    - extract:
        # Mount-relative key (the openbao ClusterSecretStore points at the
        # `apps` mount): marketplace-ui stores each app's entry as
        # <mount>/<name>, so this reads the same entry the installer writes.
        key: apps/frpc
