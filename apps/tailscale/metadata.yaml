apiVersion: marketplace/v1
kind: AppDefinition
metadata:
  name: tailscale
spec:
  displayName: "Tailscale"
  description: "Tailscale client for connecting your LibrePod device to a tailnet — subnet router, exit node, or plain client. Works with any Tailscale-compatible control server."
  icon: "https://raw.githubusercontent.com/tailscale/tailscale/main/logo.svg"
  category: "Network"
  website: "https://tailscale.com"

  # renovate: datasource=docker depName=tailscale/tailscale
  # serge: notesRepo=tailscale/tailscale
  version: "1.98.4"

  source:
    type: oci-kustomize
    url: "oci://ghcr.io/librepod/marketplace/apps/tailscale"
    path: ./overlays/librepod

  dependencies:
    required:
      - kind: StorageClass
        description: "nfs-client (provided by nfs-provisioner app)"

  templates:
    source: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: marketplace-tailscale
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "tailscale"
      spec:
        interval: 10m
        url: oci://ghcr.io/librepod/marketplace/apps/tailscale
        ref:
          tag: "__VERSION__"
    release: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: marketplace-tailscale
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "tailscale"
      spec:
        dependsOn:
          - name: storage
        force: true
        interval: 1h
        retryInterval: 2m
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: marketplace-tailscale
        path: ./overlays/librepod
        prune: true
        wait: true
        postBuild:
          substitute:
            TS_HOSTNAME: "${TS_HOSTNAME}"
            TS_EXTRA_ARGS: "${TS_EXTRA_ARGS}"
            TS_AUTHKEY: "${TS_AUTHKEY}"
            TS_ROUTES: "${TS_ROUTES}"
    kustomization: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - source.yaml
        - release.yaml
