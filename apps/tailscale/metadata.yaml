apiVersion: marketplace/v1
kind: AppDefinition
metadata:
  name: tailscale
spec:
  displayName: "Tailscale"
  description: "Tailscale client for connecting your LibrePod device to a tailnet — subnet router, exit node, or plain client. Works with any Tailscale-compatible control server."
  icon: "https://raw.githubusercontent.com/tailscale/tailscale/main/logo.svg"
  category: "Network"
  website: "https://tailscale.com"

  # renovate: datasource=docker depName=tailscale/tailscale
  # serge: notesRepo=tailscale/tailscale
  version: "1.98.4"

  source:
    type: oci-kustomize
    url: "oci://ghcr.io/librepod/marketplace/apps/tailscale"
    path: ./overlays/librepod

  settings:
    items:
      - name: TS_AUTHKEY
        label: "Tailnet auth key"
        description: "Pre-auth key that joins this device to your tailnet (Tailscale admin console, or `headscale preauthkeys create` on a headscale tailnet)."
        type: string
        required: true
        sensitive: true
      - name: TS_HOSTNAME
        label: "Tailnet hostname"
        description: "The node name this device takes in the tailnet."
        type: string
        default: "librepod"
        required: false
        sensitive: false
      - name: TS_EXTRA_ARGS
        label: "Extra tailscale up flags"
        description: "For a headscale tailnet: --login-server=https://headscale.<your-domain> (a headscale installed on this device answers there). Leave empty for Tailscale SaaS; add --advertise-exit-node to also be an exit node."
        type: string
        required: false
        sensitive: false
      - name: TS_ROUTES
        label: "Advertised routes"
        description: "Subnet CIDRs this device advertises into the tailnet (comma-separated) — makes it a subnet router. Defaults to the cluster's pod and service CIDRs (k3s defaults), so tailnet peers can reach cluster Services directly. Leave empty for a plain client. Routes apply once enabled in the control server (Tailscale admin console or Headplane routes)."
        type: string
        default: "10.42.0.0/16,10.43.0.0/16"
        required: false
        sensitive: false

  dependencies:
    required:
      - kind: StorageClass
        description: "nfs-client (provided by nfs-provisioner app)"

  templates:
    source: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: marketplace-tailscale
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "tailscale"
      spec:
        interval: 10m
        url: oci://ghcr.io/librepod/marketplace/apps/tailscale
        ref:
          tag: "__VERSION__"
    release: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: marketplace-tailscale
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "tailscale"
      spec:
        dependsOn:
          - name: storage
        force: true
        interval: 1h
        retryInterval: 2m
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: marketplace-tailscale
        path: ./overlays/librepod
        prune: true
        wait: true
    kustomization: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - source.yaml
        - release.yaml
