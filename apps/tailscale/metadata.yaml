apiVersion: marketplace/v1
kind: AppDefinition
metadata:
  name: tailscale
spec:
  displayName: "Tailscale"
  description: "Tailscale client for connecting your LibrePod device to a tailnet — subnet router, exit node, or plain client. Works with any Tailscale-compatible control server."
  icon: "https://raw.githubusercontent.com/tailscale/tailscale/main/logo.svg"
  category: "Network"
  website: "https://tailscale.com"

  version: "1.98.4"

  source:
    type: oci-kustomize
    url: "oci://ghcr.io/librepod/marketplace/apps/tailscale"
    path: ./overlays/librepod

  params:
    required:
      - name: TS_HOSTNAME
        description: "Hostname for this node on the tailnet (e.g. librepod, my-server)"
        type: string
        example: "librepod"

      - name: TS_EXTRA_ARGS
        description: >
          Raw CLI flags passed to `tailscale up`. You provide everything:
          --login-server, --accept-routes, --advertise-tags, etc.
          Example: "--login-server=https://headscale.example.com --accept-routes"
        type: string

      - name: TS_AUTHKEY
        description: "Tailscale auth key for automatic node authentication. Generate from your control server."
        type: string

      - name: TS_ROUTES
        description: "Routes to advertise (comma-separated CIDRs, e.g. 10.42.0.0/16,10.43.0.0/16)"
        type: string

  dependencies:
    required:
      - kind: StorageClass
        description: "nfs-client (provided by nfs-provisioner app)"

  templates:
    source: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: marketplace-tailscale
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "tailscale"
      spec:
        interval: 10m
        url: oci://ghcr.io/librepod/marketplace/apps/tailscale
        ref:
          tag: "__VERSION__"
    release: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: marketplace-tailscale
        namespace: flux-system
        labels:
          marketplace.io/managed: "true"
          marketplace.io/app: "tailscale"
      spec:
        dependsOn:
          - name: storage
        force: true
        interval: 1h
        retryInterval: 2m
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: marketplace-tailscale
        path: ./overlays/librepod
        prune: true
        wait: true
        postBuild:
          substitute:
            TS_HOSTNAME: "${TS_HOSTNAME}"
            TS_EXTRA_ARGS: "${TS_EXTRA_ARGS}"
            TS_AUTHKEY: "${TS_AUTHKEY}"
            TS_ROUTES: "${TS_ROUTES}"
    kustomization: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - source.yaml
        - release.yaml
