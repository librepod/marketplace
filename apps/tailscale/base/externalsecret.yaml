# Install settings (TS_AUTHKEY & co.) live in OpenBao at apps/tailscale and are
# synced into this Secret by ESO. Values never enter git or Flux substitution.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-settings
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: tailscale-settings
  dataFrom:
    - extract:
        key: apps/tailscale
