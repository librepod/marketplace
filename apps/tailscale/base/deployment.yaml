apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tailscale
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailscale
    spec:
      serviceAccountName: tailscale
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: tailscale
          image: tailscale/tailscale
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tailscale-env
          # NOTE: TS_ACCEPT_DNS and TS_USERSPACE are intentionally omitted.
          # FluxCD's postBuild.substitute does text-level replacement — bare
          # "true"/"false" values become YAML booleans, which the API rejects
          # for both ConfigMap.data and EnvVar.value.
          # When unset, containerboot defaults:
          # - TS_ACCEPT_DNS=false — override with --accept-dns in TS_EXTRA_ARGS.
          # - TS_USERSPACE=true — tailscaled runs with userspace networking:
          #   no tailscale0 interface or tailnet routes on the node, so
          #   cluster workloads cannot originate traffic to tailnet peers.
          #   Inbound subnet routing (TS_ROUTES) still works. This cannot be
          #   changed via TS_EXTRA_ARGS (those are `tailscale up` flags).
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          # Self-heal the wedged control stream (seen twice in
          # production): pod Running, daemon blind to headscale, node marked
          # offline, clients lose the 10.42/10.43 subnet routes. Healthy =
          # empty "Health":[] (e.g. "not in map poll" appears when the map
          # poll is dead and reconnects fail). The nc guard makes the probe
          # fail only while the login server is REACHABLE: dirty Health with
          # an unreachable control plane is a headscale outage, and cached
          # netmaps keep the data plane alive then — restarting would turn
          # that into a full tailnet outage. Containerboot's :9002/healthz is
          # not listening in userspace mode and only reports "holds a tailnet
          # IP" anyway, which the wedged node does. The half-open-TCP wedge
          # variant keeps Health clean; only headscale's last-seen catches it.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - tailscale status --json | grep '"Health"' | grep -q '\[\]' || ! nc -z -w 2 "$(echo "$TS_EXTRA_ARGS" | sed -n 's/.*--login-server=https\?:\/\/\([^:/]*\).*/\1/p')" 443
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - tailscale status --json | grep '"Health"' | grep -q '\[\]' || ! nc -z -w 2 "$(echo "$TS_EXTRA_ARGS" | sed -n 's/.*--login-server=https\?:\/\/\([^:/]*\).*/\1/p')" 443
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - tailscale status --json | grep '"Health"' | grep -q '\[\]' || ! nc -z -w 2 "$(echo "$TS_EXTRA_ARGS" | sed -n 's/.*--login-server=https\?:\/\/\([^:/]*\).*/\1/p')" 443
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: state
              mountPath: /var/lib/tailscale
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: tailscale-state
