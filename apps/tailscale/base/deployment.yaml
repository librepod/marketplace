apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tailscale
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailscale
    spec:
      serviceAccountName: tailscale
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: tailscale
          image: tailscale/tailscale
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tailscale-env
          # NOTE: TS_ACCEPT_DNS and TS_USERSPACE are intentionally omitted.
          # FluxCD's postBuild.substitute does text-level replacement — bare
          # "true"/"false" values become YAML booleans, which the API rejects
          # for both ConfigMap.data and EnvVar.value.
          # When unset, containerboot defaults:
          # - TS_ACCEPT_DNS=false — override with --accept-dns in TS_EXTRA_ARGS.
          # - TS_USERSPACE=true — tailscaled runs with userspace networking:
          #   no tailscale0 interface or tailnet routes on the node, so
          #   cluster workloads cannot originate traffic to tailnet peers.
          #   Inbound subnet routing (TS_ROUTES) still works. This cannot be
          #   changed via TS_EXTRA_ARGS (those are `tailscale up` flags).
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          # Self-heal the wedged control stream (seen twice in production):
          # pod Running, daemon blind to headscale, node offline, subnet
          # routes lost. Healthy = empty "Health":[] ("not in map poll" =
          # dead map poll). nc guard: fail only while the login server is
          # REACHABLE — during a headscale outage cached netmaps keep the
          # data plane alive and a restart would kill it. containerboot's
          # :9002/healthz is dead in userspace mode and passes wedged nodes;
          # the half-open-TCP variant keeps Health clean (only headscale
          # last-seen catches it).
          livenessProbe:
            exec: &health-probe
              command:
                - /bin/sh
                - -c
                - tailscale status --json | grep '"Health"' | grep -q '\[\]' || ! nc -z -w 2 "$(echo "$TS_EXTRA_ARGS" | sed -n 's/.*--login-server=https\?:\/\/\([^:/]*\).*/\1/p')" 443
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec: *health-probe
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: state
              mountPath: /var/lib/tailscale
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: tailscale-state
