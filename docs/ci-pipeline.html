<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibrePod Marketplace — CI/CD pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1064px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">CI/CD · LibrePod Marketplace</p>
    <h1>How a merge becomes a release</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1064 596" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ci-pipeline-title ci-pipeline-desc">
        <title id="ci-pipeline-title">LibrePod Marketplace CI/CD pipeline</title>
        <desc id="ci-pipeline-desc">A swimlane process map showing manual, pull-request, merge, and scheduled trigger lanes feeding PR gates, then fanning out into image builds and artifact publishes that converge in the catalog and ship through GHCR to Flux clusters.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#4f5d75"/></marker>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,0.10)"/>
          </pattern>
        </defs>

        <!-- ground -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- alternating lane tints: lanes 0, 2, 4 -->
        <rect x="140" y="36"  width="924" height="80" fill="rgba(45,49,66,0.018)"/>
        <rect x="140" y="196" width="924" height="80" fill="rgba(45,49,66,0.018)"/>
        <rect x="140" y="356" width="924" height="80" fill="rgba(45,49,66,0.018)"/>

        <!-- lane dividers + label column border -->
        <g stroke="rgba(45,49,66,0.12)" stroke-width="0.8">
          <line x1="0" y1="36"  x2="1064" y2="36"/>
          <line x1="0" y1="116" x2="1064" y2="116"/>
          <line x1="0" y1="196" x2="1064" y2="196"/>
          <line x1="0" y1="276" x2="1064" y2="276"/>
          <line x1="0" y1="356" x2="1064" y2="356"/>
          <line x1="0" y1="436" x2="1064" y2="436"/>
          <line x1="0" y1="516" x2="1064" y2="516"/>
        </g>
        <line x1="140" y1="36" x2="140" y2="516" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

        <!-- ── arrows (before nodes) ───────────────────────────── -->

        <!-- trigger: release PR enters the PR lane -->
        <path d="M 248,76 H 302 Q 310,76 310,84 V 123" fill="none"
              stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-sm)"/>
        <!-- trigger: renovate dependency PRs enter the PR lane -->
        <path d="M 248,396 H 302 Q 310,396 310,388 V 189" fill="none"
              stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-sm)"/>

        <!-- merge fan-out: PR gates fire builds, app publishes, bootstrap track -->
        <path d="M 260,172 H 414 Q 422,172 422,180 V 203" fill="none"
              stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 260,156 H 510 Q 518,156 518,164 V 203" fill="none"
              stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 260,140 H 734 Q 742,140 742,148 V 283" fill="none"
              stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- guard: publish-apps waits on the images -->
        <line x1="472" y1="236" x2="483" y2="236" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- focal-in: workflow_run fan-in -->
        <line x1="584" y1="236" x2="595" y2="236" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- focal-out: catalog artifact ships -->
        <path d="M 696,236 H 882 Q 890,236 890,244 V 443" fill="none"
              stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- bootstrap artifacts ship -->
        <path d="M 808,316 H 842 Q 850,316 850,324 V 443" fill="none"
              stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- flux reconciles -->
        <line x1="920" y1="476" x2="931" y2="476" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- ── step header chips ───────────────────────────────── -->
        <g font-family="'Geist Mono', ui-monospace, monospace">
          <g>
            <rect x="190" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
            <text x="198" y="19" text-anchor="middle" font-size="7" font-weight="600" fill="#2d3142">1</text>
            <text x="198" y="32" text-anchor="middle" font-size="6" font-weight="500" letter-spacing="0.12em" fill="#4f5d75">TRIGGER</text>
            <rect x="302" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
            <text x="310" y="19" text-anchor="middle" font-size="7" font-weight="600" fill="#2d3142">2</text>
            <text x="310" y="32" text-anchor="middle" font-size="6" font-weight="500" letter-spacing="0.12em" fill="#4f5d75">VALIDATE</text>
            <rect x="414" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
            <text x="422" y="19" text-anchor="middle" font-size="7" font-weight="600" fill="#2d3142">3</text>
            <text x="422" y="32" text-anchor="middle" font-size="6" font-weight="500" letter-spacing="0.12em" fill="#4f5d75">BUILD</text>
            <rect x="526" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
            <text x="534" y="19" text-anchor="middle" font-size="7" font-weight="600" fill="#2d3142">4</text>
            <text x="534" y="32" text-anchor="middle" font-size="6" font-weight="500" letter-spacing="0.12em" fill="#4f5d75">PUBLISH</text>
            <rect x="638" y="8" width="16" height="16" rx="8" fill="rgba(191,69,32,0.20)"/>
            <text x="646" y="19" text-anchor="middle" font-size="7" font-weight="600" fill="#bf4520">5</text>
            <text x="646" y="32" text-anchor="middle" font-size="6" font-weight="500" letter-spacing="0.12em" fill="#bf4520">CATALOG</text>
            <rect x="750" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
            <text x="758" y="19" text-anchor="middle" font-size="7" font-weight="600" fill="#2d3142">6</text>
            <text x="758" y="32" text-anchor="middle" font-size="6" font-weight="500" letter-spacing="0.12em" fill="#4f5d75">BOOTSTRAP</text>
            <rect x="862" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
            <text x="870" y="19" text-anchor="middle" font-size="7" font-weight="600" fill="#2d3142">7</text>
            <text x="870" y="32" text-anchor="middle" font-size="6" font-weight="500" letter-spacing="0.12em" fill="#4f5d75">REGISTRY</text>
            <rect x="974" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
            <text x="982" y="19" text-anchor="middle" font-size="7" font-weight="600" fill="#2d3142">8</text>
            <text x="982" y="32" text-anchor="middle" font-size="6" font-weight="500" letter-spacing="0.12em" fill="#4f5d75">RECONCILE</text>
          </g>
        </g>

        <!-- ── lane labels ─────────────────────────────────────── -->
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500"
           letter-spacing="0.08em" fill="#4f5d75" text-anchor="middle">
          <text x="70" y="80">MANUAL</text>
          <text x="70" y="160">ON PR</text>
          <text x="70" y="240">ON MERGE</text>
          <text x="70" y="320">BOOTSTRAP</text>
          <text x="70" y="400">SCHEDULED</text>
          <text x="70" y="480">CLUSTERS</text>
        </g>

        <!-- ── nodes ───────────────────────────────────────────── -->

        <!-- Release cut · REL lane, step 1 -->
        <g>
          <rect x="148" y="44" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
          <rect x="152" y="48" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/>
          <text x="159" y="56" text-anchor="middle" font-size="6" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" fill="rgba(45,49,66,0.8)">REL</text>
          <text x="198" y="70" text-anchor="middle" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" fill="#2d3142">Release cut</text>
          <text x="198" y="84" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75">release-marketplace-ui</text>
          <text x="198" y="96" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">manual: patch/minor</text>
        </g>

        <!-- PR gates · PR lane, step 2 -->
        <g>
          <rect x="260" y="124" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
          <rect x="264" y="128" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/>
          <text x="271" y="136" text-anchor="middle" font-size="6" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" fill="rgba(45,49,66,0.8)">PR</text>
          <text x="310" y="150" text-anchor="middle" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" fill="#2d3142">PR gates</text>
          <text x="310" y="164" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75">validate-apps · ui-e2e</text>
          <text x="310" y="176" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">nix · Playwright</text>
        </g>

        <!-- Image builds · MERGE lane, step 3 -->
        <g>
          <rect x="372" y="204" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
          <rect x="376" y="208" width="20" height="10" rx="2" fill="rgba(45,49,66,0.12)"/>
          <text x="386" y="216" text-anchor="middle" font-size="6" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" fill="rgba(45,49,66,0.8)">PUSH</text>
          <text x="422" y="230" text-anchor="middle" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" fill="#2d3142">Image builds</text>
          <text x="422" y="244" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75">ui + sso-controller</text>
          <text x="422" y="256" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">buildx + cosign</text>
        </g>

        <!-- App artifacts · MERGE lane, step 4 -->
        <g>
          <rect x="484" y="204" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
          <rect x="488" y="208" width="20" height="10" rx="2" fill="rgba(45,49,66,0.12)"/>
          <text x="498" y="216" text-anchor="middle" font-size="6" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" fill="rgba(45,49,66,0.8)">PUSH</text>
          <text x="534" y="230" text-anchor="middle" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" fill="#2d3142">App artifacts</text>
          <text x="534" y="244" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75">apps + components</text>
          <text x="534" y="256" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">flux push + cosign</text>
        </g>

        <!-- Catalog · MERGE lane, step 5 · FOCAL -->
        <g>
          <rect x="596" y="204" width="100" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
          <rect x="600" y="208" width="20" height="10" rx="2" fill="rgba(191,69,32,0.18)"/>
          <text x="610" y="216" text-anchor="middle" font-size="6" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" fill="#bf4520">PUSH</text>
          <text x="646" y="230" text-anchor="middle" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" fill="#2d3142">Catalog</text>
          <text x="646" y="244" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75">publish-catalog</text>
          <text x="646" y="256" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">workflow_run fan-in</text>
        </g>

        <!-- Bootstrap · BOOT lane, step 6 -->
        <g>
          <rect x="708" y="284" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
          <rect x="712" y="288" width="22" height="10" rx="2" fill="rgba(45,49,66,0.12)"/>
          <text x="723" y="296" text-anchor="middle" font-size="6" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" fill="rgba(45,49,66,0.8)">BOOT</text>
          <text x="758" y="310" text-anchor="middle" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" fill="#2d3142">Bootstrap</text>
          <text x="758" y="324" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75">publish + auto-cut</text>
          <text x="758" y="336" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">workflow_call chain</text>
        </g>

        <!-- Renovate · OPS lane, step 1 -->
        <g>
          <rect x="148" y="364" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
          <rect x="152" y="368" width="16" height="10" rx="2" fill="rgba(45,49,66,0.12)"/>
          <text x="160" y="376" text-anchor="middle" font-size="6" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" fill="rgba(45,49,66,0.8)">OPS</text>
          <text x="198" y="390" text-anchor="middle" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" fill="#2d3142">Renovate</text>
          <text x="198" y="404" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75">dependency PRs (PAT)</text>
          <text x="198" y="416" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">cron Mon–Fri</text>
        </g>

        <!-- GHCR · CLUSTERS lane, step 7 -->

          <rect x="820" y="444" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

          <text x="870" y="484" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75">signed OCI + images</text>
          <text x="870" y="496" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">ghcr.io/librepod</text>
        </g>

        <!-- Flux clusters · CLUSTERS lane, step 8 -->
        <g>
          <rect x="932" y="444" width="100" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
          <rect x="936" y="448" width="20" height="10" rx="2" fill="rgba(45,49,66,0.12)"/>
          <text x="946" y="456" text-anchor="middle" font-size="6" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" fill="rgba(45,49,66,0.8)">FLUX</text>
          <text x="982" y="470" text-anchor="middle" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif" fill="#2d3142">Flux clusters</text>
          <text x="982" y="484" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75">librepod · dev · k3d</text>
          <text x="982" y="496" text-anchor="middle" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" fill="#5a6580">verify + reconcile</text>
        </g>

        <!-- ── legend ──────────────────────────────────────────── -->
        <g font-family="'Geist Mono', ui-monospace, monospace">
          <!-- row 1: steps -->
          <text x="144" y="536" font-size="6" font-weight="500" letter-spacing="0.14em" fill="#4f5d75">STEPS</text>
          <g font-size="6" fill="#4f5d75">
            <rect x="206" y="526" width="12" height="12" rx="6" fill="rgba(45,49,66,0.12)"/>
            <text x="212" y="535" text-anchor="middle" font-size="6" font-weight="600" fill="#2d3142">1</text>
            <text x="224" y="535">TRIGGER</text>

            <rect x="286" y="526" width="12" height="12" rx="6" fill="rgba(45,49,66,0.12)"/>
            <text x="292" y="535" text-anchor="middle" font-size="6" font-weight="600" fill="#2d3142">2</text>
            <text x="304" y="535">VALIDATE</text>

            <rect x="366" y="526" width="12" height="12" rx="6" fill="rgba(45,49,66,0.12)"/>
            <text x="372" y="535" text-anchor="middle" font-size="6" font-weight="600" fill="#2d3142">3</text>
            <text x="384" y="535">BUILD</text>

            <rect x="446" y="526" width="12" height="12" rx="6" fill="rgba(45,49,66,0.12)"/>
            <text x="452" y="535" text-anchor="middle" font-size="6" font-weight="600" fill="#2d3142">4</text>
            <text x="464" y="535">PUBLISH</text>

            <rect x="526" y="526" width="12" height="12" rx="6" fill="rgba(191,69,32,0.20)"/>
            <text x="532" y="535" text-anchor="middle" font-size="6" font-weight="600" fill="#bf4520">5</text>
            <text x="544" y="535">CATALOG</text>

            <rect x="616" y="526" width="12" height="12" rx="6" fill="rgba(45,49,66,0.12)"/>
            <text x="622" y="535" text-anchor="middle" font-size="6" font-weight="600" fill="#2d3142">6</text>
            <text x="634" y="535">BOOTSTRAP</text>

            <rect x="716" y="526" width="12" height="12" rx="6" fill="rgba(45,49,66,0.12)"/>
            <text x="722" y="535" text-anchor="middle" font-size="6" font-weight="600" fill="#2d3142">7</text>

          <!-- row 2: flow styles -->

          <g font-size="6" fill="#4f5d75">
            <line x1="206" y1="556" x2="236" y2="556" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-sm)"/>
            <text x="242" y="559">TRIGGER · PR ENTERS LANE</text>
