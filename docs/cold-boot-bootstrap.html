<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibrePod cold boot — bootstrap dependency chain · Dependency</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .diagram-scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1280px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Dependency · LibrePod Marketplace</p>
    <h1>LibrePod cold boot — the bootstrap dependency chain</h1>

    <div class="diagram-scroll">
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="librepod-bootstrap-flow-title librepod-bootstrap-flow-desc">
      <title id="librepod-bootstrap-flow-title">LibrePod cold boot bootstrap dependency chain</title>
      <desc id="librepod-bootstrap-flow-desc">Ranked dependency graph of a LibrePod cold boot: Flux applies the marketplace artifact and the system apps, the openbao-bootstrap Job provisions the KV store and Kubernetes-auth roles, producer Jobs write credential entries, External Secrets sync them to consumers, and the Git auth gate opens marketplace-ui; the accent loop marks the Job's bounded-budget retry that replaces the old terminal-deadline wedge.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Phase labels (left margin) -->
      <text x="40" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">BOOT</text>
      <text x="40" y="248" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">APPLY</text>
      <text x="40" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">PROVISION</text>
      <text x="40" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SERVE</text>

      <!-- Connectors drawn before boxes -->
      <!-- boot -> job (fan left) -->
      <path d="M 511 132 V 148 Q 511 156 503 156 H 424 Q 416 156 416 164 V 216" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- boot -> apps (fan right) -->
      <path d="M 577 132 V 164 Q 577 172 585 172 H 664 Q 672 172 672 180 V 216" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- job -> kv (straight, same column) -->
      <line x1="416" y1="272" x2="416" y2="356" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- job -> producers (roles gate; horizontal at y=304, 24px clear of apps->producers at y=328) -->
      <path d="M 449 272 V 296 Q 449 304 457 304 H 631 Q 639 304 639 312 V 356" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- apps -> producers (straight-ish elbow, distinct top attach x=705) -->
      <path d="M 672 272 V 320 Q 672 328 680 328 H 697 Q 705 328 705 336 V 356" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- producers -> kv (horizontal KV put) -->
      <line x1="572" y1="384" x2="516" y2="384" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- kv -> eso (straight, same column) -->
      <line x1="416" y1="412" x2="416" y2="496" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- eso -> consumers (horizontal sync) -->
      <line x1="516" y1="524" x2="572" y2="524" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- consumers -> ui (horizontal gate) -->
      <line x1="772" y1="524" x2="828" y2="524" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Arrow labels (opaque masks, 6-10px off their strokes) -->
      <rect x="517" y="377" width="54" height="13" fill="#f5f5f5"/>
      <text x="544" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KV PUT</text>
      <rect x="424" y="446" width="60" height="13" fill="#f5f5f5"/>
      <text x="454" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">K8S-AUTH</text>
      <rect x="524" y="517" width="40" height="13" fill="#f5f5f5"/>
      <text x="544" y="527" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNC</text>
      <rect x="782" y="517" width="36" height="13" fill="#f5f5f5"/>
      <text x="800" y="527" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GATE</text>

      <!-- Cycle: the Job retry self-loop, out the left edge of openbao-bootstrap -->
      <path d="M 316 228 H 188 Q 180 228 180 236 V 260 Q 180 268 188 268 H 308" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="210" y="278" width="64" height="13" fill="#f5f5f5"/>
      <text x="242" y="288" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRY ×6</text>

      <!-- Callout (italic serif) -->
      <text x="104" y="330" fill="#4f5d75" font-size="13" font-family="'Instrument Serif', serif" font-style="italic">A hung wait once burned the terminal 900 s</text>
      <text x="104" y="348" fill="#4f5d75" font-size="13" font-family="'Instrument Serif', serif" font-style="italic">deadline and wedged everything downstream —</text>
      <text x="104" y="366" fill="#4f5d75" font-size="13" font-family="'Instrument Serif', serif" font-style="italic">the budget exits early; backoff retries.</text>

      <!-- boot (input) -->
      <rect x="444" y="76" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="444" y="76" width="200" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <rect x="452" y="82" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="467" y="91" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE</text>
      <rect x="612" y="84" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="626" y="93" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0 IN</text>
      <text x="544" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cold boot</text>
      <text x="544" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NixOS · k3s · Flux sync</text>

      <!-- openbao-bootstrap Job (backend; carries the retry cycle) -->
      <rect x="316" y="216" width="200" height="56" rx="6" fill="#f5f5f5"/>

      <rect x="324" y="222" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="338" y="231" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>

      <text x="498" y="233" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1 IN</text>
      <text x="416" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">openbao-bootstrap</text>
      <text x="416" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">init · KV engines · roles</text>

      <!-- system apps (backend) -->
      <rect x="572" y="216" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="572" y="216" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="580" y="222" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="594" y="231" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYS</text>
      <rect x="740" y="224" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="754" y="233" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1 IN</text>
      <text x="672" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">System apps</text>
      <text x="672" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">traefik · cert-manager · NFS</text>

      <!-- OpenBao KV (store; highest fan-in) -->
      <rect x="316" y="356" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="316" y="356" width="200" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="324" y="362" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="334" y="371" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KV</text>
      <rect x="484" y="364" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="498" y="373" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2 IN</text>
      <text x="416" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OpenBao KV</text>
      <text x="416" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">apps/ · system/ entries</text>

      <!-- producer jobs (backend) -->
      <rect x="572" y="356" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="572" y="356" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="580" y="362" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="594" y="371" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>
      <rect x="740" y="364" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="754" y="373" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2 IN</text>
      <text x="672" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Producer Jobs</text>
      <text x="672" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gogs publish-auth · step-ca</text>

      <!-- external secrets (backend) -->
      <rect x="316" y="496" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="316" y="496" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="324" y="502" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="338" y="511" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ESO</text>
      <rect x="484" y="504" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="498" y="513" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1 IN</text>
      <text x="416" y="532" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">External Secrets</text>
      <text x="416" y="548" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ESO · ClusterSecretStore</text>

      <!-- secret consumers (backend) -->
      <rect x="572" y="496" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="572" y="496" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="580" y="502" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="594" y="511" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEC</text>
      <rect x="740" y="504" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="754" y="513" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1 IN</text>
      <text x="672" y="532" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Secret consumers</text>
      <text x="672" y="548" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">oauth2-proxy · Git auth</text>

      <!-- marketplace-ui (backend, terminal payoff) -->
      <rect x="828" y="496" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="828" y="496" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="836" y="502" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>

      <rect x="996" y="504" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>

      <text x="928" y="532" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">marketplace-ui</text>
      <text x="928" y="548" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">onboarding · catalog</text>

      <!-- Legend strip -->
      <line x1="40" y1="600" x2="1240" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="632" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <text x="64" y="641" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Boot input</text>

  </div>
