apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-settings
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: tailscale-settings
  dataFrom:
    - extract:
        key: apps/${INSTANCE_NAME:=app}/tailscale
