# Name is a placeholder: the kustomization selects the annotated Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder
spec:
  template:
    spec:
      # MagicDNS first: it answers tailnet names and forwards the rest; CoreDNS
      # second is consulted on SERVFAIL, or once MagicDNS has not answered
      # within the timeout (tailscaled down or restarting), so a sidecar outage
      # costs each lookup ~1s instead of the resolver's default 5s. The search
      # domain is the MagicDNS base domain the headscale app configures
      # (ts.<BASE_DOMAIN>). dnsPolicy None drops the pod's cluster search list,
      # so it is restated: apps reach their own Services by short name. This
      # assumes the namespace equals INSTANCE_NAME, true for every app today.
      # 10.43.0.10 (CoreDNS) is k3s's default service-CIDR address.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 100.100.100.100
          - 10.43.0.10
        searches:
          - ts.${BASE_DOMAIN:=libre.pod}
          - ${INSTANCE_NAME:=app}.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: timeout
            value: "1"
          - name: attempts
            value: "2"
      containers:
        - name: tailscale
          image: tailscale/tailscale
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              add: ["NET_ADMIN"]
          envFrom:
            - configMapRef:
                name: tailscale-env
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-settings
                  key: TS_AUTHKEY
            - name: TS_EXTRA_ARGS
              valueFrom:
                secretKeyRef:
                  name: tailscale-settings
                  key: TS_EXTRA_ARGS
                  optional: true
          # containerboot's /healthz answers 200 once the node holds a tailnet
          # IP. A startup probe only: the pod stays unready (and the install
          # fails visibly) until the app first joins the tailnet, e.g. on a
          # wrong auth key or login server, while a later tailnet blip leaves
          # the app up.
          startupProbe:
            httpGet:
              path: /healthz
              port: 9002
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: tailscale-state
              mountPath: /var/lib/tailscale
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: tailscale-state
          persistentVolumeClaim:
            claimName: tailscale-state
