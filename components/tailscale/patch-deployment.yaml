# Name is a placeholder: the kustomization selects the annotated Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder
spec:
  template:
    spec:
      # Cluster search domains first, MagicDNS base domain (ts.<BASE_DOMAIN>,
      # as the headscale app configures) LAST. Order is load-bearing: the
      # system's coredns-custom rewrite maps every *.<BASE_DOMAIN> name —
      # including *.ts.<BASE_DOMAIN> — to traefik, so a cluster short name
      # resolved under the ts search domain gets a confidently wrong A record
      # (traefik's ClusterIP) and the resolver never falls through to
      # .svc.cluster.local (remnawave → postgres P1001 this way). With cluster
      # domains first, short names hit their own Services; bare tailnet node
      # names still resolve via the last search entry after a few fast
      # NXDOMAINs. MagicDNS (100.100.100.100) answers tailnet names and
      # SERVFAILs the rest; CoreDNS second is the fallback, and without an
      # upstream configured in the tailnet DNS config it serves every cluster
      # lookup. dnsPolicy None drops the pod's cluster search list, so it is
      # restated: this assumes the namespace equals INSTANCE_NAME, true for
      # every app today. 10.43.0.10 (CoreDNS) is k3s's default service-CIDR
      # address.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 100.100.100.100
          - 10.43.0.10
        searches:
          - ${INSTANCE_NAME:=app}.svc.cluster.local
          - svc.cluster.local
          - cluster.local
          - ts.${BASE_DOMAIN:=libre.pod}
        options:
          - name: timeout
            value: "1"
          - name: attempts
            value: "2"
      containers:
        - name: tailscale
          image: tailscale/tailscale
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              add: ["NET_ADMIN"]
          envFrom:
            - configMapRef:
                name: tailscale-env
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-settings
                  key: TS_AUTHKEY
            - name: TS_EXTRA_ARGS
              valueFrom:
                secretKeyRef:
                  name: tailscale-settings
                  key: TS_EXTRA_ARGS
                  optional: true
          # containerboot's /healthz answers 200 once the node holds a tailnet
          # IP. A startup probe only: the pod stays unready (and the install
          # fails visibly) until the app first joins the tailnet, e.g. on a
          # wrong auth key or login server, while a later tailnet blip leaves
          # the app up.
          startupProbe:
            httpGet:
              path: /healthz
              port: 9002
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: tailscale-state
              mountPath: /var/lib/tailscale
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: tailscale-state
          persistentVolumeClaim:
            claimName: tailscale-state
