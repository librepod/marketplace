# Reconciled by frp-operator into the FRP client configuration. TLS is
# terminated at the relay, which forwards plain HTTP to frps' vhost port, so
# this is type http and frps routes by Host header.
apiVersion: frp.zufardhiyaulhaq.com/v1alpha1
kind: Upstream
metadata:
  # Registered with frps as the proxy name; must be unique per relay.
  name: ${FRP_EXPOSE_SUBDOMAIN:=app}
spec:
  client: libreport
  http:
    host: ${FRP_EXPOSE_HOST:=localhost}
    port: ${FRP_EXPOSE_PORT:=80}
    subdomain: ${FRP_EXPOSE_SUBDOMAIN:=app}
    # No healthCheck: the CRD only supports type http + a required path, and a
    # shared component can't know each app's health endpoint (headscale's
    # /health is app-specific). It's optional and informational for a
    # single-backend proxy, so omit it rather than guess a path.
    transport:
      useEncryption: true
      useCompression: true
