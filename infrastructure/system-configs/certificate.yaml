apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-default-cert
  # Issued into step-ca (same namespace as the default TLSStore that serves
  # it — traefik reads both from there via defaultTLSResourcesNamespace):
  # no cross-namespace mirroring, and the step-certificates bootstrap Job
  # can force a re-issue on CA rotation with same-namespace RBAC only.
  namespace: step-ca
spec:
  secretName: tls-traefik-default-cert
  privateKey:
    rotationPolicy: Always
  commonName: "*.${BASE_DOMAIN:-libre.pod}"
  dnsNames:
    - "*.${BASE_DOMAIN:-libre.pod}"
    - "${BASE_DOMAIN:-libre.pod}"  # bare apex (e.g. libre.pod); the wildcard above does not cover it
  issuerRef:
    group: certmanager.step.sm
    kind: StepClusterIssuer
    name: step-cluster-issuer
