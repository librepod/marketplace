# Cluster-wide SecretStore so every namespace can pull secrets from the
# openbao KV v2 engine mounted at apps/. Pointed at the openbao app's
# service; inert (NotReady) on clusters where openbao is not installed.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      # KV v2: remoteRef keys are engine-relative (apps/myapp -> /v1/apps/data/myapp)
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: openbao-eso
            namespace: openbao
