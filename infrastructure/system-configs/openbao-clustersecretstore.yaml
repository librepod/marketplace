# Cluster-wide SecretStore so every namespace can pull secrets from the
# openbao KV v2 engine mounted at apps/. OpenBao itself is a system app
# (infrastructure/system-apps/openbao.yaml); system-configs depends on
# system-apps, so the store is created after the server it points at.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      # REQUIRED: without a vault path ESO cannot know which engine a key
      # belongs to and treats the key's first segment as the mount. With it,
      # remoteRef keys are engine-relative (apps/myapp -> /v1/apps/data/myapp).
      path: apps
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: openbao-eso
            namespace: openbao
