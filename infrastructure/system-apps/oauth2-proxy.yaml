apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: oauth2-proxy
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/librepod/marketplace/apps/oauth2-proxy
  ref:
    tag: "7.14.2"
  verify:
    provider: cosign
    secretRef:
      name: cosign-pub
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oauth2-proxy
  namespace: flux-system
spec:
  dependsOn:
    - name: traefik
    - name: casdoor
    # Gate on step-certificates: the pod mounts Secret/step-certificates-certs
    # (synced from openbao apps/step-ca by the overlay's ExternalSecret), and
    # the CA chain starts at step-ca. step-certificates waits on its bootstrap
    # Job (wait: true), so Ready ⇒ the root CA exists and has been pushed to
    # openbao; if openbao itself lags, the pod sits Pending until the
    # ExternalSecret syncs — ESO heals on its own, no wedge.
    - name: step-certificates
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: oauth2-proxy
  path: ./overlays/librepod
  prune: true
  wait: true
  postBuild:
    substitute:
      BASE_DOMAIN: "${BASE_DOMAIN}"
