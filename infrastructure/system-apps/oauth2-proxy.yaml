apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: oauth2-proxy
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/librepod/marketplace/apps/oauth2-proxy
  ref:
    tag: "7.14.2"
  verify:
    provider: cosign
    secretRef:
      name: cosign-pub
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oauth2-proxy
  namespace: flux-system
spec:
  dependsOn:
    - name: traefik
    - name: casdoor
    # Gate on step-certificates: this Kustomization applies an EMPTY
    # step-certificates-certs stub that Reflector fills from the step-ca
    # source, and Reflector warns-and-drops (never retries) if the stub
    # applies before the source exists — wedging consumer pods in Init
    # forever. step-certificates waits on its bootstrap Job (wait: true),
    # so Ready ⇒ the source ConfigMap exists and the stub mirrors on apply.
    - name: step-certificates
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: oauth2-proxy
  path: ./overlays/librepod
  prune: true
  wait: true
  postBuild:
    substitute:
      BASE_DOMAIN: "${BASE_DOMAIN}"
