apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: step-certificates
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/librepod/marketplace/apps/step-certificates
  ref:
    tag: "0.29.0"
  verify:
    provider: cosign
    secretRef:
      name: cosign-pub
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: step-certificates
  namespace: flux-system
spec:
  dependsOn:
    - name: storage
  # 10m: the completed Job is TTL-GC'd (ttlSecondsAfterFinished: 600) and the
  # next reconcile recreates it — that re-run loop is what retries cold-boot
  # CA publication into openbao and propagates CA rotation (~10-20m), rather
  # than a full hour between attempts.
  interval: 10m
  retryInterval: 2m
  # ≥ the bootstrap Job's activeDeadlineSeconds (1800s): with wait:true the
  # health check waits on that Job, and a shorter timeout reports spurious
  # Ready=False while the Job is still inside its legitimate slow-network
  # budget (see components/bootstrap-step-resources/job.yaml).
  timeout: 35m
  sourceRef:
    kind: OCIRepository
    name: step-certificates
  path: ./overlays/librepod
  prune: true
  wait: true
  postBuild:
    substitute:
      BASE_DOMAIN: "${BASE_DOMAIN}"
