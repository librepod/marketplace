apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gogs
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/librepod/marketplace/apps/gogs
  ignore: |
    # FluxCD source-controller excludes *.zip files by default when extracting OCI artifacts.
    # We need gogs-init.zip for configMapGenerator to embed binary backup data.
    # This override explicitly includes zip files along with the required directories.
    /*
    !/*.zip
    !/base
    !/components
    !/overlays
    !/metadata.yaml
  ref:
    tag: "0.14.3"
  verify:
    provider: cosign
    secretRef:
      name: cosign-pub
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gogs
  namespace: flux-system
spec:
  dependsOn:
    - name: storage
    - name: traefik
  # 10m, not 1h: the publish-auth Job is TTL'd (ttlSecondsAfterFinished), so
  # every reconcile recreates it — that loop is the Job's retry cadence for
  # its warn+skip runs (a cold boot routinely runs it before openbao exists)
  # and the only refresh path for a credential rotation.
  interval: 10m
  retryInterval: 2m
  # The publish-auth Job's spec evolves (script/annotation changes); a
  # Completed Job is immutable, so without force every such change wedges the
  # apply. force lets Flux delete+recreate the Job — the re-run is
  # idempotent (warn+skip) by design.
  force: true
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: gogs
  path: ./overlays/librepod
  prune: true
  wait: true
  postBuild:
    substitute:
      BASE_DOMAIN: "${BASE_DOMAIN}"
