apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: marketplace-ui
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/librepod/marketplace/apps/marketplace-ui
  ref:
    tag: "0.5.4"
  verify:
    provider: cosign
    secretRef:
      name: cosign-pub
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: marketplace-ui
  namespace: flux-system
spec:
  dependsOn:
    - name: gogs
    - name: cert-manager
    - name: casdoor-sso-controller
    # Gate on the user-apps Kustomization: Ready ⇔ Flux cloned a seeded
    # flux/user-apps repo and applied it — a provider-neutral "repo is seeded and
    # writable" signal (identical semantics for Gogs, GitHub, or GitLab). Without
    # this the server can become Ready while the repo is still commitless, and the
    # first install PUTs to a commitless repo → Gogs 500 (issue #180). dependsOn
    # can only target Kustomizations, not the user-apps-source GitRepository, so
    # this is the correct gate. user-apps dependsOn nothing → acyclic.
    - name: user-apps
  interval: 1m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: marketplace-ui
  path: ./overlays/librepod
  prune: true
  wait: true
  postBuild:
    substitute:
      BASE_DOMAIN: "${BASE_DOMAIN}"
