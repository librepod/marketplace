apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: marketplace-ui
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/librepod/marketplace/apps/marketplace-ui
  ref:
    tag: "0.6.0"
  verify:
    provider: cosign
    secretRef:
      name: cosign-pub
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: marketplace-ui
  namespace: flux-system
spec:
  dependsOn:
    - name: gogs
    - name: cert-manager
    - name: casdoor-sso-controller
    # Gate on step-certificates: this Kustomization applies an EMPTY
    # step-certificates-certs stub that Reflector fills from the step-ca
    # source, and Reflector warns-and-drops (never retries) if the stub
    # applies before the source exists — wedging consumer pods in Init
    # forever. step-certificates waits on its bootstrap Job (wait: true),
    # so Ready ⇒ the source ConfigMap exists and the stub mirrors on apply.
    - name: step-certificates
    # Gate on user-apps-source, whose Ready is a selective healthCheck on
    # GitRepository/user-apps-source: "Flux cloned a seeded repo". That is the
    # installer's real invariant and it is provider-neutral (identical for Gogs,
    # GitHub, GitLab). It deliberately does NOT gate on `user-apps`: that
    # Kustomization builds every installed app's YAML, so one broken app would
    # block re-applying the installer UI — the very tool needed to remove it
    # (issue #182). dependsOn cannot target a GitRepository directly, so the
    # Kustomization that owns it carries the check. Acyclic: user-apps-source
    # dependsOn system-configs + gogs only.
    - name: user-apps-source
  interval: 1m
  retryInterval: 2m
  # ≥ the session-secret bootstrap Job's activeDeadlineSeconds (1800s): with
  # wait:true the health check waits on that Job, and a shorter timeout reports
  # spurious Ready=False on slow networks (see
  # components/bootstrap-session-secret/job.yaml).
  timeout: 35m
  sourceRef:
    kind: OCIRepository
    name: marketplace-ui
  path: ./overlays/librepod
  prune: true
  wait: true
  postBuild:
    substitute:
      BASE_DOMAIN: "${BASE_DOMAIN}"
