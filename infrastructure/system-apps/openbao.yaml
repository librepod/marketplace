apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: openbao
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/librepod/marketplace/apps/openbao
  ref:
    tag: "2.7.1"
  verify:
    provider: cosign
    secretRef:
      name: cosign-pub
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao
  namespace: flux-system
spec:
  dependsOn:
    - name: storage
    # IngressRoute CRD + entrypoints
    - name: traefik
  interval: 1h
  retryInterval: 2m
  # The bootstrap Job's spec evolves (volumes/env change as auth roles are
  # added); a Completed Job is immutable, so without force every such change
  # wedges the apply ("updates to job template are not allowed"). force lets
  # Flux delete+recreate the Job — the re-run is idempotent by design.
  force: true
  # ≥ the bootstrap Job's activeDeadlineSeconds (900s): with wait:true the
  # health check waits on that Job, and a shorter timeout reports spurious
  # Ready=False on slow networks.
  timeout: 20m
  sourceRef:
    kind: OCIRepository
    name: openbao
  path: ./overlays/librepod
  prune: true
  wait: true
  postBuild:
    substitute:
      BASE_DOMAIN: "${BASE_DOMAIN}"
