apiVersion: batch/v1
kind: Job
metadata:
  name: gogs-bootstrap-ssh-key
  namespace: gogs
  labels:
    # Deliberately NOT app.kubernetes.io/name: gogs. That label is the gogs
    # Deployment's pod selector (apps/gogs/base/kustomization.yaml sets it via
    # labels.includeSelectors: true). A Job pod carrying it would be "adopted" by
    # that selector. The component label below carries no selector, so it is
    # harmless and still identifies the pod's purpose. See memory: bootstrap-job-pattern.
    app.kubernetes.io/name: user-apps-source
    app.kubernetes.io/component: bootstrap-ssh-key
spec:
  backoffLimit: 3
  parallelism: 1
  completions: 1
  # NOTE: deliberately NO ttlSecondsAfterFinished — a Completed Job persists so
  # Flux does NOT recreate+re-run it on later reconciles.
  #
  # To ROTATE the key, all three must be removed first. The script registers the
  # pubkey under the FIXED title `librepod-flux`; if a stale key with that title
  # is left in Gogs, registration is skipped, the new Secret's private key won't
  # match, and Flux fails with `permission denied (publickey)`:
  #   1. Delete the `librepod-flux` SSH key from the `flux` Gogs user
  #      (Gogs UI, or `DELETE /api/v1/user/keys/<id>`).
  #   2. Delete this Job AND Secret/user-apps-ssh-key.
  #   3. `flux reconcile kustomization user-apps-source --with-source`.
  # TODO: automate step 1 (delete-by-title) in bootstrap-ssh-key.sh once plan
  # Task 1 confirms the Gogs DELETE-endpoint shape. The script is idempotent on
  # the Secret, so a stray re-run while the Secret exists is a harmless no-op.
  template:
    metadata:
      name: gogs-bootstrap-ssh-key
      labels:
        # NO app.kubernetes.io/name: gogs here either — see the Job metadata comment.
        app.kubernetes.io/component: bootstrap-ssh-key
    spec:
      restartPolicy: Never
      serviceAccountName: gogs-bootstrap-ssh-key
      containers:
        - name: bootstrap-ssh-key
          # alpine:3.19 is already pulled cluster-wide (CA-bundle init containers,
          # headscale bootstrap Job). Root is required only for `apk add
          # openssh-client`; this is a one-shot pod, not a long-running service.
          image: alpine:3.19
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/bootstrap-ssh-key.sh"]
          env:
            - name: GOGS_NAMESPACE
              value: gogs
            - name: FLUX_USER
              valueFrom:
                secretKeyRef:
                  name: user-apps-source-auth
                  key: username
            - name: FLUX_PASS
              valueFrom:
                secretKeyRef:
                  name: user-apps-source-auth
                  key: password
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: cm-gogs-bootstrap-ssh-key-script
            items:
              - key: bootstrap-ssh-key.sh
                path: bootstrap-ssh-key.sh
        - name: tmp
          emptyDir: {}
