# The gogs flux-account credential, synced by the External Secrets Operator
# from the openbao KV store (apps/user-apps-source — published there by the
# gogs publish-auth Job) into the Secret this GitRepository authenticates its
# HTTP clone with (secretRef below). Replaces the Reflector auto-mirror
# (#253). Cold boot: gogs pushes -> ESO syncs -> GitRepository clones; no
# cycles — openbao depends only on storage + traefik (#228).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-apps-source-auth
  namespace: flux-system
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: user-apps-source-auth
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: apps/user-apps-source
        property: username
    - secretKey: password
      remoteRef:
        key: apps/user-apps-source
        property: password
